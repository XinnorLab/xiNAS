doca_distro_series: "ubuntu{{ ansible_distribution_version }}"
# One release directory of the DOCA repo, never NVIDIA's moving `latest` alias:
# when that alias re-pointed (2026-08-20, 3.4.0 -> 3.5.0) apt refused to follow
# it and every installed host's `apt-get update` failed with exit 100. Bump
# deliberately after a hardware test, in this role and in the client's copy,
# and commit with `Requires-Rebuild: doca_ofed`. Contract: docs/Installer/spec.md §3.2.
doca_version: "3.4.0"
doca_repo_base: "https://linux.mellanox.com/public/repo/doca"
doca_repo_component: "{{ doca_version }}/{{ doca_distro_series }}/x86_64"

doca_pkgs:
  - doca-all           # DOCA-Host "Everything" profile (drivers, userspace, tools)
  - mlnx-fw-updater    # NIC firmware updater
  - mlnx-nfsrdma-dkms  # Kernel module required for NFS over RDMA

doca_ofed_auto_reboot: false

# Netplan template containing desired InfiniBand names. Resolved relative to the
# playbook so it follows the repo wherever it is checked out.
ib_netplan_template: "{{ playbook_dir }}/../collection/roles/net_controllers/templates/netplan.yaml.j2"
# Location of generated udev rules for InfiniBand
ib_udev_rules_file: "/etc/udev/rules.d/70-ib-names.rules"
