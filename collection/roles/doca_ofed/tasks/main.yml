- name: Ensure build dependencies are present
  ansible.builtin.apt:
    name:
      - dkms
      - build-essential
      - linux-headers-{{ ansible_kernel }}
      - libelf-dev
    state: present
  tags: [ofed, deps]

# DOCA-Host's DKMS mlx5_ib needs the in-tree macsec module. On Ubuntu it ships
# in linux-modules-extra-<kernel>, which the virtual kernel metapackage (cloud
# images) does not pull in, and without it openibd fails with "mlx5_ib:
# Unknown symbol macsec_netdev_is_offloaded". Check the running kernel and every
# installed kernel version, add the extra modules where apt has them, and stop
# before any DOCA package otherwise (docs/Installer/spec.md §3.2 "Kernel module
# prerequisite").
- name: List the kernels that need the macsec module (running + installed)
  ansible.builtin.shell: |
    set -o pipefail
    {
      echo "{{ ansible_kernel }}"
      # dpkg-query exits 1 when nothing matches (a custom kernel); that host
      # still gets its running kernel checked, so the status is not fatal.
      { dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 'linux-image-*' 2>/dev/null || true; } \
        | awk '$1 ~ /^[ih]i/ && $2 !~ /-dbgsym$/ {print $2}' \
        | sed -nE 's/^linux-image-(unsigned-)?([0-9]+\.[0-9]+\.[0-9]+-[0-9]+.*)$/\2/p'
    } | sort -u
  args:
    executable: /bin/bash
  register: doca_ofed_kernels
  changed_when: false
  tags: [ofed, deps, install]

- name: Check the macsec module for each kernel
  ansible.builtin.command: "modinfo -k {{ item }} -n macsec"
  loop: "{{ doca_ofed_kernels.stdout_lines }}"
  register: doca_ofed_macsec_before
  changed_when: false
  failed_when: false
  tags: [ofed, deps, install]

- name: Look up linux-modules-extra for kernels without macsec
  ansible.builtin.shell: >-
    set -o pipefail;
    apt-cache policy linux-modules-extra-{{ item.item }}
    | awk '/Candidate:/ {print $2}'
  args:
    executable: /bin/bash
  loop: "{{ doca_ofed_macsec_before.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: doca_ofed_extra_candidates
  changed_when: false
  tags: [ofed, deps, install]

- name: Install linux-modules-extra for kernels without macsec
  ansible.builtin.apt:
    name: "linux-modules-extra-{{ item.item.item }}"
    state: present
  loop: "{{ doca_ofed_extra_candidates.results | rejectattr('stdout', 'in', ['', '(none)']) | list }}"
  loop_control:
    label: "{{ item.item.item }}"
  tags: [ofed, deps, install]

- name: Re-check the macsec module for each kernel
  ansible.builtin.command: "modinfo -k {{ item }} -n macsec"
  loop: "{{ doca_ofed_kernels.stdout_lines }}"
  register: doca_ofed_macsec_after
  changed_when: false
  failed_when: false
  tags: [ofed, deps, install]

- name: Stop before DOCA when a kernel has no macsec module
  ansible.builtin.fail:
    msg: >-
      Kernel(s) {{ doca_ofed_macsec_after.results | selectattr('rc', 'ne', 0)
      | map(attribute='item') | join(', ') }} still have no macsec module,
      which DOCA-Host's mlx5_ib needs: either apt has no
      linux-modules-extra-<kernel> candidate for them, or that package did not
      provide the module. Install the kernel's extra modules (or a kernel that
      provides macsec), then re-run. This check runs before the DOCA packages
      are installed or upgraded. See docs/Installer/spec.md §3.2 "Kernel module
      prerequisite".
  when: doca_ofed_macsec_after.results | selectattr('rc', 'ne', 0) | list | length > 0
  tags: [ofed, deps, install]

# NVIDIA rotated the DOCA-Host signing key (2026-01 -> 70454E6B…DC726C5E41B9CC50),
# published per component as doca_keyring.gpg (already a binary keyring). The
# legacy base-path GPG-KEY-Mellanox.pub no longer carries it, so the old
# `apt_key url=.../GPG-KEY-Mellanox.pub` produced `NO_PUBKEY DC726C5E41B9CC50` and
# `apt update` failed the entire install. Drop the keyring straight into
# trusted.gpg.d (force: true so a future rotation self-heals) — the path verified
# end-to-end on DOCA hardware. Also clears the deprecated apt_key module.
- name: Install NVIDIA DOCA repository signing key
  ansible.builtin.get_url:
    url: "{{ doca_repo_base }}/{{ doca_repo_component }}/doca_keyring.gpg"
    dest: /etc/apt/trusted.gpg.d/mellanox-doca.gpg
    mode: '0644'
    force: true
  tags: [ofed, repo]

# NVIDIA's `latest` alias re-points to each new DOCA-Host release without
# notice (2026-08-20: 3.4.0 -> 3.5.0). apt refuses to follow a source whose
# Suite/Codename changed until an operator confirms it (apt-get(8)
# --allow-releaseinfo-change), so every host installed from `latest` failed
# `apt-get update` with exit 100. The source is therefore pinned to one release
# directory (doca_version), and this task owns the sources file outright:
# writing it whole retires a stale `latest` line left by an earlier install,
# which apt_repository (add-only) would have kept beside the pinned one.
# Contract and migration path: docs/Installer/spec.md §3.2 and §8.5.
- name: Write the DOCA-OFED APT source (pinned release, file owned whole)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mellanox-doca.list
    content: |
      # Managed by xiNAS (doca_ofed role): one pinned DOCA-Host release. Do not edit.
      deb {{ doca_repo_base }}/{{ doca_repo_component }} /
    owner: root
    group: root
    mode: '0644'
  register: repo_added
  tags: [ofed, repo]

- name: Update APT cache (if repo added)
  ansible.builtin.apt:
    update_cache: yes
  when: repo_added is changed
  tags: [ofed, repo]

- name: Install DOCA-OFED packages
  ansible.builtin.apt:
    name: "{{ doca_pkgs }}"
    state: present
    update_cache: yes
  register: ofed_pkgs
  notify: Restart openibd
  tags: [ofed, install]

## --- Post-install validation (prevent silent DKMS failures) ---

- name: Verify DKMS modules built successfully
  ansible.builtin.shell: |
    set -o pipefail
    failed=""
    for pkg in mlnx-ofed-kernel nfsrdma; do
      status=$(dkms status 2>/dev/null | grep -i "$pkg" || true)
      if [ -n "$status" ]; then
        if echo "$status" | grep -qiE ':\s*(added|error|broken)'; then
          failed="${failed}${pkg}: ${status}\n"
        fi
      fi
    done
    if [ -n "$failed" ]; then
      printf "DKMS build failures detected:\n%b" "$failed"
      exit 1
    fi
    echo "All DKMS modules built successfully"
  args:
    executable: /bin/bash
  register: dkms_check
  changed_when: false
  failed_when: dkms_check.rc != 0
  when: ofed_pkgs is changed
  tags: [ofed, verify]

- name: Verify mlx5_core kernel module is loadable
  ansible.builtin.command: modinfo mlx5_core
  register: mlx5_modinfo
  changed_when: false
  failed_when: mlx5_modinfo.rc != 0
  tags: [ofed, verify]

- name: Verify NFS-RDMA kernel module is loadable
  ansible.builtin.command: modinfo rpcrdma
  register: rpcrdma_modinfo
  changed_when: false
  failed_when: false
  tags: [ofed, verify]

- name: Warn if NFS-RDMA module is missing
  ansible.builtin.debug:
    msg: >-
      WARNING: rpcrdma (NFS-RDMA) kernel module not found.
      NFS over RDMA will not function. Verify mlnx-nfsrdma-dkms built
      correctly with: dkms status | grep nfsrdma
  when: rpcrdma_modinfo.rc != 0
  tags: [ofed, verify]

- name: Deploy InfiniBand UDEV rename script
  ansible.builtin.copy:
    src: configure_ib_udev.sh
    dest: /usr/local/sbin/configure_ib_udev.sh
    mode: '0755'
  tags: [ofed, udev]

- name: Generate UDEV rules for InfiniBand interfaces
  ansible.builtin.command: >-
    /usr/local/sbin/configure_ib_udev.sh
    {{ ib_netplan_template }}
    {{ ib_udev_rules_file }}
  register: ib_udev_result
  changed_when: ib_udev_result.stdout is search('^changed:')
  tags: [ofed, udev]

- name: Report InfiniBand UDEV rename outcome
  ansible.builtin.debug:
    msg: "{{ ib_udev_result.stdout | default(ib_udev_result.stderr) | default('(no output)') }}"
  tags: [ofed, udev]

- name: Reboot if kernel modules built and reboot requested
  ansible.builtin.reboot:
    msg: "Reboot after DOCA-OFED install (role doca_ofed)"
    reboot_timeout: 1200
  when: ofed_pkgs is changed and doca_ofed_auto_reboot | bool
  tags: [ofed, reboot]

# Run the queued `Restart openibd` now instead of at end-of-play.
#
# On a card in InfiniBand mode, mlx5_core creates no netdev — the ibN
# interfaces come from ib_ipoib, which is only loaded when openibd starts.
# net_controllers runs immediately after this role and detects interfaces by
# scanning /sys/class/net. With the restart still queued as a handler, that
# scan finds nothing on a host where DOCA-OFED was not already installed, so
# net_controllers writes the "no high-speed interfaces detected" placeholder
# netplan and the IB ports come up with no addresses. The install still exits
# 0, which is why this only ever reproduced on a genuinely cold node
# (any reinstall over an existing OFED already has ib_ipoib loaded).
#
# Safe to flush globally here: the only other handlers pending at this point
# are common's `Reload sysctl` / `Restart unattended-upgrades`, both
# independent and idempotent. This is deliberately NOT done in xinas_mcp,
# where an early flush would restart one daemon before the other's unit
# exists (see that role's handlers/main.yml).
- name: Flush handlers so openibd restarts before net_controllers scans for NICs
  ansible.builtin.meta: flush_handlers
  tags: [ofed, network]
