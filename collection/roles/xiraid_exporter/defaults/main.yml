# xiraid-exporter version to install
xiraid_exporter_version: "1.1.0"

# Architecture for the release asset
xiraid_exporter_arch: "amd64"

# GitHub repository for releases
xiraid_exporter_github_repo: "E4-Computer-Engineering/xiraid-exporter"

# Download URL of the .deb package
# (Folded scalar broken inside the Jinja braces, where whitespace is
# insignificant — the rendered URL is identical.)
xiraid_exporter_download_url: >-
  https://github.com/{{ xiraid_exporter_github_repo }}/releases/download/v{{
  xiraid_exporter_version }}/xiraid-exporter_{{ xiraid_exporter_version }}_linux_{{ xiraid_exporter_arch }}.deb

# Metrics listen port
xiraid_exporter_port: 9827

# Candidate systemd unit names, most likely first. The .deb installs
# `xiraid_exporter.service` (underscore) even though the package and binary
# are hyphenated; older builds shipped the hyphenated unit. The role resolves
# which one is actually present instead of assuming.
xiraid_exporter_unit_candidates:
  - xiraid_exporter.service
  - xiraid-exporter.service
