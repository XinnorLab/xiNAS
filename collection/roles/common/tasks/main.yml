# -------------------------------------------------------------
# tasks/main.yml
# -------------------------------------------------------------
---
# Preflight: xiRAID's kernel-module package refuses to install on a CPU that
# does not report the `avx` flag (xiraid-kmod's pre-install script aborts with
# "ERROR: The CPU flag is not supported: avx."). xiraid_classic is only the
# fourth role, so without this check that abort surfaces after doca_ofed has
# already spent ~20 minutes installing DOCA-OFED. Read the flags before the
# first apt call and fail with the fix named. Contract and vendor citation:
# docs/Installer/spec.md §3.1.
- name: Read the CPU flags (xiRAID AVX preflight)
  ansible.builtin.command: grep -m1 '^flags' {{ xinas_cpuinfo_path }}
  register: xinas_cpu_flags
  changed_when: false
  failed_when: false
  when:
    - xinas_require_avx | bool
    - not (xiraid_skip_install | default(false) | bool)
  tags: [preflight, xiraid]

- name: Fail fast when the CPU has no AVX (xiRAID cannot be installed on it)
  ansible.builtin.fail:
    msg: >-
      This CPU does not report the AVX instruction set, which xiRAID requires:
      the xiraid-kmod package's pre-install script aborts with
      "The CPU flag is not supported: avx", so the install would fail only
      after DOCA-OFED had already been installed. On a virtual machine, give the
      guest a CPU model that passes AVX through (QEMU/KVM: -cpu host; Proxmox:
      CPU type "host"; VMware: raise the EVC mode) and re-run. Set
      xinas_require_avx=false to skip this check.
      Flags line read from {{ xinas_cpuinfo_path }}:
      "{{ xinas_cpu_flags.stdout | default('') | trim }}"
  when:
    - xinas_require_avx | bool
    - not (xiraid_skip_install | default(false) | bool)
    - "'avx' not in (xinas_cpu_flags.stdout | default('') | regex_replace('^flags\\s*:', '')).split()"
  tags: [preflight, xiraid]

# Preflight: the mirror image of the AVX one above. `xiraid_skip_install: true`
# promises xiRAID is already on the host - playbooks/site.yml skips the whole
# xiraid_classic role under it, so nothing later in the run can install one.
# The flag is sticky (the reuse wizard writes it into the operator overlay), so
# it outlives the host state it described: on v3.13.2-rc.4 a menu purge at
# 12:13 met a run at 12:18 that still carried it, and the missing xicli only
# surfaced ~50 tasks later, in a storage gate that could only report "the probe
# could not answer". Check the promise before the first apt call instead.
# Contract and the full incident: docs/Installer/spec.md §3.1.
- name: Look for the xiRAID CLI (existing-install preflight)  # noqa: command-instead-of-shell
  ansible.builtin.shell: command -v xicli
  register: xinas_xicli_check
  changed_when: false
  failed_when: false
  when: xiraid_skip_install | default(false) | bool
  tags: [preflight, xiraid]

- name: Fail fast when the run skips installing a xiRAID that is not there
  ansible.builtin.fail:
    msg: >-
      xiRAID is not installed on this host ('xicli' is not on PATH), but this run was
      told to skip installing it (xiraid_skip_install=true): playbooks/site.yml skips
      the whole xiraid_classic role under that flag, so nothing here would put xiRAID
      back, and every storage step after this one needs xicli. That flag is usually
      left behind by an earlier existing-arrays run, in the operator overlay
      playbooks/group_vars/all/20-local.yml - clear it there (or drop the
      -e xiraid_skip_install=true) so xiraid_classic installs xiRAID, then re-run.
      To keep skipping the install, install xiRAID by hand first.
  when:
    - xiraid_skip_install | default(false) | bool
    - (xinas_xicli_check.rc | default(1)) != 0
  tags: [preflight, xiraid]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [packages]

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags: [packages]

- name: Install chrony package
  ansible.builtin.apt:
    name: "{{ chrony_package_name }}"
    state: present
  tags: [ntp]

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  tags: [timezone]

- name: Enable and start chrony (NTP)
  ansible.builtin.service:
    name: "{{ chrony_service_name }}"
    enabled: yes
    state: started
  when: "'chrony' in common_packages"
  tags: [ntp]

- name: Hold current Ubuntu kernel (prevent accidental upgrades)
  ansible.builtin.dpkg_selections:
    name: linux-image-generic
    selection: hold
  tags: [kernel]

- name: Deploy unattended‑upgrades configuration
  ansible.builtin.template:
    src: unattended-upgrades.conf.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
  notify: Restart unattended-upgrades
  tags: [security]

# xiNAS <= 3.10.2 wrote its sysctl keys into the shared /etc/sysctl.conf (the
# module's default sysctl_file). `reload: yes` runs `sysctl -p <sysctl_file>`,
# which re-applies *every* key in that file and fails the task on any one of
# them -- so perf_tuning's sunrpc.tcp_max_slot_table_entries line aborted this
# role on any host that had not loaded the sunrpc module. xiNAS now owns a
# drop-in per role; strip the legacy entries first so an upgraded host that is
# already in the broken state self-heals on the next provision.
- name: Remove legacy xiNAS sysctl keys from the shared /etc/sysctl.conf
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^\s*net\.core\.rmem_max\s*='
    - '^\s*net\.core\.wmem_max\s*='
    - '^\s*net\.core\.netdev_max_backlog\s*='
    - '^\s*net\.core\.somaxconn\s*='
    - '^\s*net\.ipv4\.tcp_rmem\s*='
    - '^\s*net\.ipv4\.tcp_wmem\s*='
    - '^\s*vm\.swappiness\s*='
    - '^\s*sunrpc\.tcp_max_slot_table_entries\s*='
  failed_when: false
  tags: [sysctl]

# 80- so the baseline loads before perf_tuning's 90- drop-ins in
# `sysctl --system` order and the perf values win at boot.
- name: Apply sysctl parameters
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/80-xinas-common.conf
    reload: yes
  loop: "{{ common_sysctl | dict2items }}"
  notify: Reload sysctl
  tags: [sysctl]


- name: Ensure keys directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../keys"
    state: directory
    mode: "0700"
  when: xinas_hostname | length == 0
  tags: [hostname]

- name: Retrieve xiRAID hardware key
  ansible.builtin.command: ./hwkey
  args:
    chdir: "{{ playbook_dir }}/.."
  register: hwkey_result
  changed_when: false
  failed_when: false
  when: xinas_hostname | length == 0
  tags: [hostname]

- name: Cache hardware key for future use
  ansible.builtin.copy:
    content: "{{ hwkey_result.stdout | trim }}"
    dest: "{{ playbook_dir }}/../keys/hwkey"
    mode: "0600"
  when:
    - xinas_hostname | length == 0
    - hwkey_result.rc | default(1) == 0
    - hwkey_result.stdout | default('') | trim | length > 0
  tags: [hostname]

- name: Fall back to cached hardware key
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../keys/hwkey"
  register: hwkey_cached
  when:
    - xinas_hostname | length == 0
    - hwkey_result.rc | default(1) != 0
  failed_when: hwkey_cached is failed
  tags: [hostname]

- name: Set hwkey fact from cache
  ansible.builtin.set_fact:
    hwkey_result:
      stdout: "{{ hwkey_cached.content | b64decode | trim }}"
      rc: 0
  when:
    - xinas_hostname | length == 0
    - hwkey_result.rc | default(1) != 0
    - hwkey_cached is not failed
  tags: [hostname]

- name: Set default hostname fact
  ansible.builtin.set_fact:
    xinas_hostname: "xiNAS-{{ hwkey_result.stdout | trim | upper }}"
  when:
    - xinas_hostname | length == 0
    - hwkey_result.stdout | default('') | trim | length > 0
  tags: [hostname]

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ xinas_hostname }}"
  tags: [hostname]
