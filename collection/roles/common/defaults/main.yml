# =============================================================
# Role: common
# Directory: collection/roles/common/
# =============================================================
#
# -------------------------------------------------------------
# defaults/main.yml
# -------------------------------------------------------------
common_timezone: "Europe/Amsterdam"
common_packages:
  - curl
  - vim
  - htop
  - chrony                # NTP daemon; change to ntp if preferred
  - unattended-upgrades
  - ca-certificates
  - quota                 # Disk quota tools for user quota management
# Let unattended-upgrades reboot the node on its own when an update leaves
# /var/run/reboot-required. Off by default: a reboot the node starts by itself
# drops every NFS client. See docs/Installer/spec.md §3.1 "Unattended upgrades".
common_unattended_reboot: false
# Quoted 24-hour "HH:MM" for that reboot ("" = right after the daily run, a
# time already past that day = the next day). Checked only while the reboot is on.
common_unattended_reboot_time: ""
chrony_service_name: chrony
chrony_package_name: chrony
common_sysctl:
  net.core.rmem_max: 268435456
  net.core.wmem_max: 268435456
  vm.swappiness: 10
# Hostname for the node. If empty, the role constructs 'xiNAS-HWKEY'.
xinas_hostname: ""
# Fail the play before the first apt call when the CPU does not report the
# `avx` flag: xiRAID's kernel-module package refuses to install without it.
# Skipped automatically on the existing-RAID path (xiraid_skip_install=true).
# See docs/Installer/spec.md §3.1.
xinas_require_avx: true
# File the AVX preflight reads the `flags` line from. Override only to
# exercise the check against a fixture.
xinas_cpuinfo_path: /proc/cpuinfo
# Kernel hold (docs/Installer/spec.md §3.1 "Kernel held"): every installed
# package matching the first pattern is held, except per-version image
# packages (the second pattern) and linux-image-unsigned-*. That holds the
# flavour metapackages — linux-image-generic, linux-image-virtual, HWE and
# -edge variants — whichever the host carries.
common_kernel_hold_pattern: '^linux-image-[a-z][a-z0-9.+-]*$'
common_kernel_version_pattern: '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+'
