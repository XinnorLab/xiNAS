---
# Automatic IP pool allocation
net_ip_pool_enabled: true
net_ip_pool_start: "10.10.1.1"
net_ip_pool_end: "10.10.255.1"
net_ip_pool_prefix: 24

# Interface detection
net_detect_infiniband: true
net_detect_mlx5: true

# Manual IP overrides
net_manual_ips: {}

# MTU (0 = auto-detect: 4092 for InfiniBand, 9000 for RoCE/Ethernet)
net_mtu: 0

# Netplan template to render. Role-relative by default; configure_network.sh
# manual mode points this at an absolute path under .xinas-local/ so it never
# writes the tracked role template. Ansible's template lookup accepts both.
net_netplan_template: netplan.yaml.j2
