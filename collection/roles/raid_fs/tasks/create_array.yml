- name: Build device list string
  ansible.builtin.set_fact:
    _devlist: "{{ item.devices | join(' ') }}"
  tags: [raid_fs, raid]

- name: Calculate data disk count (for RAID5/6 stripe-width)
  ansible.builtin.set_fact:
    _sw: "{{ (item.devices | length | int) - (item.parity_disks | default(0) | int) }}"
  tags: [raid_fs, raid]

# xiRAID preallocates a large contiguous kernel mempool per array. On
# RAM-constrained hosts a full page cache makes __get_free_pages() fail, so
# reclaim clean cache and compact memory first — this makes the create
# deterministic (verified: identical create fails with a full cache, succeeds
# after drop_caches + compact_memory).
- name: Reclaim page cache and compact memory before creating {{ item.name }}
  ansible.builtin.shell: |
    set -e
    sync
    echo 3 > /proc/sys/vm/drop_caches
    echo 1 > /proc/sys/vm/compact_memory 2>/dev/null || true
  changed_when: false
  tags: [raid_fs, raid]

- name: Read MemAvailable after reclaim (for {{ item.name }})
  ansible.builtin.command: awk '/^MemAvailable:/ {print $2}' /proc/meminfo
  register: _mem_avail_kb
  changed_when: false
  tags: [raid_fs, raid]

- name: Fail early if free memory is below the xiRAID mempool floor ({{ item.name }})
  ansible.builtin.fail:
    msg: >-
      Only {{ _mem_avail_kb.stdout | int // 1024 }} MiB free after reclaim, but
      creating array '{{ item.name }}' needs >= {{ raid_create_min_free_mb | default(2560) }} MiB
      for the xiRAID mempool (memory_prealloc). Proceeding would fail with a
      kernel '__get_free_pages() failed … RAID creation failed' error. Add RAM,
      reduce the disk count for this array, or lower its memory_prealloc_mb.
  when: (_mem_avail_kb.stdout | int // 1024) < (raid_create_min_free_mb | default(2560) | int)
  tags: [raid_fs, raid]

# TRIM/discard is decided per array, not per node: a log array on TRIM-capable
# namespaces still gets TRIM when a data-array member does not support it. A
# member reporting 0 (or missing the attribute) cannot discard. Both xiRAID knobs
# are create-only, so this is the only chance to set them — see raid-spec §7.5.
- name: Probe member discard support for {{ item.name }}
  ansible.builtin.shell: |
    set -u
    for dev in {{ _devlist }}; do
      max=$(cat "/sys/block/$(basename "$dev")/queue/discard_max_bytes" 2>/dev/null || echo 0)
      # RZAT: deallocated blocks must read back as zeroes. On NVMe that is the
      # namespace's DLFEAT field, low 3 bits == 1. The kernel's old
      # discard_zeroes_data attribute was removed in 4.12, so sysfs cannot
      # answer this on the supported Ubuntu kernels.
      dlfeat=$(nvme id-ns "$dev" 2>/dev/null \
               | awk -F: '/dlfeat/ {gsub(/[^0-9]/, "", $2); print $2; exit}')
      if [ "${max:-0}" -eq 0 ] 2>/dev/null; then
        echo "$dev (no discard support)"
      elif [ -z "${dlfeat:-}" ] || [ $((dlfeat & 7)) -ne 1 ]; then
        echo "$dev (no RZAT)"
      fi
    done
  register: _trim_probe
  changed_when: false
  when: (xiraid_trim_mode | default('auto')) != 'off'
  tags: [raid_fs, raid]

- name: Decide TRIM for {{ item.name }}
  ansible.builtin.set_fact:
    _array_trim: >-
      {{ (xiraid_trim_mode | default('auto')) != 'off'
         and (_xicli_trim_supported | default(false) | bool)
         and ((xiraid_trim_mode | default('auto')) == 'on'
              or ((_trim_probe.stdout_lines | default([])) | length) == 0) }}
  tags: [raid_fs, raid]

- name: Report the TRIM decision for {{ item.name }}
  ansible.builtin.debug:
    msg: >-
      Array '{{ item.name }}': TRIM {{ 'ENABLED' if (_array_trim | bool) else 'disabled' }}
      {{ '(' + xiraid_trim_create_args + ')' if (_array_trim | bool) else '' }}
      {{ '- members not eligible: '
         + (_trim_probe.stdout_lines | default([]) | join('; '))
         if ((_trim_probe.stdout_lines | default([])) | length) > 0 else '' }}
      {{ '- xicli does not advertise the TRIM flags'
         if not (_xicli_trim_supported | default(false) | bool)
            and (xiraid_trim_mode | default('auto')) != 'off' else '' }}
  tags: [raid_fs, raid]

- name: Create array {{ item.name }}
  ansible.builtin.command: >-
    xicli raid create -n {{ item.name }} -l {{ item.level }}
    -d {{ _devlist }} -ss {{ item.strip_size_kb }}
    {% if item.spare_pool is defined %}-sp {{ item.spare_pool }}{% endif %}
    {% if xiraid_force_metadata | bool %}--force_metadata{% endif %}
    {% if _array_trim | bool %}{{ xiraid_trim_create_args }}{% endif %}
  register: raid_create
  changed_when: raid_create.rc == 0
  failed_when:
    - raid_create.rc != 0
    - raid_create.stderr is not search('already exists')
  tags: [raid_fs, raid]

- name: Wait for xiRAID block device /dev/xi_{{ item.name }}
  ansible.builtin.wait_for:
    path: "/dev/xi_{{ item.name }}"
    timeout: 120
  tags: [raid_fs, raid]

# `xicli raid create` does not zero the payload, and TRIM is skipped whenever a
# member fails the eligibility probes above — so the head of a brand-new array can
# still expose a signature left on the member disks by a previous install. blkid
# reports it as a real filesystem and create_fs.yml's FOREIGN gate then refuses to
# format an array this run created seconds ago (seen on a virtio bench: every
# member "no RZAT", the new data array's head carrying xfs_external_log).
# Only reachable from the create branch, so the only thing here is residue.
#
# `udevadm settle` first: wait_for returns the moment the node appears, while
# udev may still be probing it, and wipefs on a device udev holds open fails
# with EBUSY.
- name: Wipe stale signatures from the newly created /dev/xi_{{ item.name }}
  ansible.builtin.shell: |
    set -e
    udevadm settle
    wipefs -a /dev/xi_{{ item.name }}
  args:
    executable: /bin/bash
  changed_when: false
  tags: [raid_fs, raid]
