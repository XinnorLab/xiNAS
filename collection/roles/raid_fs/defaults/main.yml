# Default values for the raid_fs role
#
# When nvme_auto_namespace is enabled (default), the nvme_namespace role
# will auto-detect NVMe drives and generate xiraid_arrays and xfs_filesystems.
#
# For manual configuration, set nvme_auto_namespace: false and define
# xiraid_arrays and xfs_filesystems explicitly in your preset.

xiraid_license_path: "/tmp/license"

# Whether to pass `--force_metadata` when creating arrays
# Set to `false` if metadata should not be overwritten
xiraid_force_metadata: true

# TRIM/discard for NEW arrays (raid-spec §7.5). xiRAID's `--discard` defaults to
# 0, and enabling it requires EVERY member to support Deterministic Read Zero
# after TRIM (RZAT) — see the xiRAID Classic 4.4 command reference.
#   auto - enable iff every member of that array reports discard support AND RZAT
#          (decided per array)
#   on   - pass the flags regardless of what the members report
#   off  - never pass them
xiraid_trim_mode: auto

# The literal flags appended to `xicli raid create` when TRIM is enabled. Kept as
# a variable so a future xiRAID spelling is a one-line override; the role probes
# `xicli raid create --help` and drops them all when the installed CLI does not
# advertise every flag named here, since an unknown argument fails the create.
#
# `--drive_trim` is deliberately absent. It TRIMs the disks before creation, and
# xiRAID already enables it by default when RZAT holds AND no disk carries
# metadata — that second condition is what stops a TRIM from destroying data that
# is still recoverable. Forcing `--drive_trim 1` here would override it.
xiraid_trim_create_args: "--discard 1"

# DEPRECATED / internal — do NOT use to reformat. The supported control is
# `xinas_storage_reset`. Kept only so older inventories don't error; pinned to the
# safe side. `xfs_force_mkfs: true` set alone no longer reformats a healthy array.
xfs_force_mkfs: false

# Operator control for destroying and rebuilding storage. Default false = converge
# (a re-run never touches an existing healthy array). Set true (with an interactive
# YES, or nvme_skip_cleanup_confirmation=true for automation) to wipe + rebuild.
xinas_storage_reset: false

# Before creating each array, xiRAID preallocates a per-array kernel mempool
# (~memory_prealloc_mb, 2048 MB by default) via __get_free_pages(). On
# RAM-constrained hosts a full page cache makes that *contiguous* allocation
# fail with a cryptic "__get_free_pages() failed … RAID creation failed" kernel
# error. raid_fs reclaims page cache + compacts memory before each create; if
# free memory is still below this floor it fails early with an actionable
# message instead. Raise/lower to match your array's mempool size.
raid_create_min_free_mb: 2560

# xiraid_arrays and xfs_filesystems are typically generated by nvme_namespace role
# If nvme_auto_namespace is disabled, you must define them manually in your preset.
# Example:
#
# xiraid_arrays:
#   - name: data
#     level: 5
#     strip_size_kb: 128
#     devices:
#       - /dev/nvme1n2
#       - /dev/nvme2n2
#       - /dev/nvme3n2
#     parity_disks: 1
#
#   - name: log
#     level: 10
#     strip_size_kb: 16
#     devices:
#       - /dev/nvme1n1
#       - /dev/nvme2n1
#       - /dev/nvme3n1
#       - /dev/nvme4n1
#
# xfs_filesystems:
#   - label: nfsdata
#     data_device: "/dev/xi_data"
#     log_device: "/dev/xi_log"
#     # su_kb and sw are auto-calculated from data array geometry
#     log_size: 1G
#     sector_size: 4k
#     mountpoint: /mnt/data
#     mount_opts: "logdev=/dev/xi_log,noatime,nodiratime,logbsize=256k,largeio,inode64,swalloc,allocsize=131072k,uquota"
