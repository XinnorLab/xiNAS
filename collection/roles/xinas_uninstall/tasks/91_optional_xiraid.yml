---
# Optional phase 91 — remove the xiRAID package, repo, and DKMS module.
# Gated by uninstall_remove_xiraid in tasks/main.yml.

# The exporter .deb installs `xiraid_exporter.service` (underscore); older
# builds shipped the hyphenated unit. Sweep both — a name that does not exist
# is tolerated by failed_when: false, so teardown never depends on guessing.
- name: "XiRAID | stop and disable xiraid-exporter"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - xiraid_exporter.service
    - xiraid-exporter.service
  register: _xiraid_exp_stop
  failed_when: false
  changed_when: _xiraid_exp_stop.changed | default(false)

# xiRAID's own version-lock service `apt-mark hold`s the packages it owns, and
# apt refuses to remove a held package:
#   E: Held packages were changed and -y was used without --allow-change-held-packages
# The apt module's `allow_change_held_packages` would cover that in one line and
# must NOT be used: it was added in ansible-core 2.13, only reached the removal
# path in 2.15, and Ubuntu 22.04 ships ansible 2.10.8 — exactly what
# prepare_system.sh installs — where it is a fatal "Unsupported parameters for
# (ansible.builtin.apt) module" that aborts the teardown at its last stage.
# Clearing the hold explicitly works on every version the installer produces.
# Spec: docs/Installer/uninstall-spec.md §3.1.
- name: "XiRAID | read the apt hold list"
  ansible.builtin.command: apt-mark showhold
  register: _apt_holds
  changed_when: false

# Scoped to the intersection with the purge list: unholding only what is
# actually held keeps the task idempotent and never touches a package outside
# xinas_xiraid_apt_purge.
- name: "XiRAID | unhold the held xiRAID packages"
  ansible.builtin.command: "apt-mark unhold {{ _xiraid_held | join(' ') }}"
  vars:
    _xiraid_held: "{{ xinas_xiraid_apt_purge | intersect(_apt_holds.stdout_lines | default([])) }}"
  when: _xiraid_held | length > 0
  changed_when: true

- name: "XiRAID | purge xiraid packages"
  ansible.builtin.apt:
    name: "{{ xinas_xiraid_apt_purge }}"
    state: absent
    purge: true
    autoremove: false
  register: _apt_xiraid
  failed_when:
    - _apt_xiraid.failed | default(false)
    - "'is not installed' not in (_apt_xiraid.msg | default(''))"

- name: "XiRAID | also purge xiraid-repo metadata package"
  ansible.builtin.shell: |
    set +e
    dpkg -l | awk '/^ii.*xiraid-repo/ {print $2}' | xargs -r apt-get purge -y
    exit 0
  args:
    executable: /bin/bash
  changed_when: false

- name: "XiRAID | dkms remove kernel module"
  ansible.builtin.shell: |
    set +e
    dkms status 2>/dev/null | awk -F'[,/ ]' '/^xiraid/ {print $1}' | sort -u | while read mod; do
      dkms remove "$mod" --all 2>/dev/null || true
    done
    exit 0
  args:
    executable: /bin/bash
  changed_when: false

- name: "XiRAID | remove /etc/xiraid"
  ansible.builtin.file:
    path: /etc/xiraid
    state: absent

- name: "XiRAID | remove Xinnor APT sources"
  ansible.builtin.shell: |
    set +e
    grep -rl 'pkg\.xinnor\.io' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r rm -f
    exit 0
  args:
    executable: /bin/bash
  changed_when: false

- name: "XiRAID | record removal"
  ansible.builtin.set_fact:
    uninstall_summary: >-
      {{
        uninstall_summary | combine({
          'removed': uninstall_summary.removed + [
            ['xiRAID package', 'xiraid-core, xiraid-exporter, xiraid-appimage, xiraid-kmod purged; /etc/xiraid removed; Xinnor APT repo removed; DKMS module unregistered']
          ],
          'reboot': true
        })
      }}
