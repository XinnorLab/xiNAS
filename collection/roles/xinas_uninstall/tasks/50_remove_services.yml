---
# Phase E — remove xiNAS systemd unit files. The services were stopped in
# phase A; here we delete the unit files and the runtime directories
# systemd would otherwise keep around.

- name: "Services | stop + disable xiNAS units (clears enable symlinks)"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - xinas-agent.service
    - xinas-api.service
    - xinas-mcp.service
    - xinas-nfs-helper.service
    - xinas-perf-runtime.service
  failed_when: false

- name: "Services | delete xiNAS unit files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/xinas-agent.service
    - /etc/systemd/system/xinas-api.service
    - /etc/systemd/system/xinas-mcp.service
    - /etc/systemd/system/xinas-nfs-helper.service
    - /etc/systemd/system/xinas-perf-runtime.service

- name: "Services | delete xiNAS runtime directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /run/xinas-nfs-helper
    - /run/xinas                 # api/agent sockets (finding #33)
    - /usr/lib/tmpfiles.d/xinas-api.conf

- name: "Services | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true

# A unit that was in a `failed` sub-state when its fragment was removed leaves
# a lingering failed record that survives unit-file deletion + daemon-reload —
# only `systemctl reset-failed` or a reboot clears it. Without this, a reinstall
# on the SAME boot fails at the api role's "Enable and start xinas-api" with
# "Unit xinas-api.service ... Device or resource busy" (EBUSY). Clear the
# records here so uninstall -> reinstall-without-reboot is clean. Harmless +
# idempotent: reset-failed on a unit with no failed state is a no-op.
- name: "Services | clear lingering failed unit records (reinstall-without-reboot)"
  ansible.builtin.command:
    cmd: "systemctl reset-failed {{ item }}"
  loop:
    - xinas-agent.service
    - xinas-api.service
    - xinas-mcp.service
    - xinas-nfs-helper.service
    - xinas-perf-runtime.service
  changed_when: false
  failed_when: false

- name: "Services | record removal"
  ansible.builtin.set_fact:
    uninstall_summary: >-
      {{
        uninstall_summary | combine({
          'removed': uninstall_summary.removed + [
            ['Service units', 'xinas-agent.service, xinas-api.service, xinas-mcp.service, xinas-nfs-helper.service, xinas-perf-runtime.service']
          ]
        })
      }}
