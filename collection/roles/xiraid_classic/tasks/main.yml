---
- name: Ensure kernel headers present (xiRAID DKMS needs them)
  ansible.builtin.apt:
    name: "linux-headers-{{ ansible_kernel }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [xiraid, deps]

- name: Remove any existing xiRAID repo package before download
  ansible.builtin.file:
    path: "/tmp/{{ xiraid_repo_pkg }}"
    state: absent
  tags: [xiraid, cleanup]

- name: Download xiRAID repo package
  tags: [xiraid, download]
  block:
    - name: Download xiRAID repo package (get_url)
      ansible.builtin.get_url:
        url: "{{ xiraid_repo_pkg_url }}"
        dest: "/tmp/{{ xiraid_repo_pkg }}"
        mode: '0644'
        force: no
      register: xiraid_repo_dl
      retries: 5
      delay: 10
      until: xiraid_repo_dl is succeeded

  rescue:
    # wget is the deliberate fallback path for when get_url itself has
    # already failed; converting it to get_url would defeat the rescue.
    - name: Download xiRAID repo package (wget fallback)  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "wget -q -O /tmp/{{ xiraid_repo_pkg }} {{ xiraid_repo_pkg_url }}"
      register: xiraid_repo_dl
      retries: 5
      delay: 10
      until: xiraid_repo_dl.rc == 0

- name: Install xiRAID repo package
  ansible.builtin.apt:
    deb: "/tmp/{{ xiraid_repo_pkg }}"
    state: present
  when: xiraid_repo_dl.changed
  register: xiraid_repo_added
  tags: [xiraid, repo]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if (xiraid_repo_added is defined and xiraid_repo_added is changed) else 3600 }}"
  tags: [xiraid, install]

- name: Ensure xiRAID packages are installed
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ xiraid_packages }}"
  register: xiraid_pkgs
  tags: [xiraid, install]

- name: Ensure /etc/xiraid config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/xiraid
    - /etc/xiraid/raids
    - /etc/xiraid/pools
  tags: [xiraid, install]

- name: Accept xiRAID EULA
  ansible.builtin.command: xicli settings eula modify -s accepted
  when: xiraid_accept_eula | bool
  changed_when: false
  tags: [xiraid, eula]

# Optional verification section
- name: Verify xiRAID kernel module loaded
  ansible.builtin.shell: "lsmod | grep -q xiraid"
  changed_when: false
  register: mod_check
  failed_when: mod_check.rc != 0
  tags: [xiraid, verify]

- name: Show xiRAID version
  ansible.builtin.command: "xicli -v"
  changed_when: false
  tags: [xiraid, verify]

- name: Reboot to complete xiRAID installation (if requested)
  ansible.builtin.reboot:
    reboot_timeout: 1200
    msg: "Reboot by xiraid_classic role after install"
  when: xiraid_pkgs is changed and xiraid_auto_reboot | bool
  tags: [xiraid, reboot]

# Daemon preflight — deliberately the last thing the role does, after any
# reboot, so the state it proves is the final one. Nothing above proves the
# daemon is up: the module check reads lsmod and `xicli -v` is the CLI's
# version action ("... and exit"), and whether the EULA command needs the
# daemon is undocumented. nvme_namespace's storage-state probe does need it, and a daemon that never came up used to surface there, one
# role later, as "Storage state = UNKNOWN". Converge the target here — it is
# the unit Xinnor manages xiRAID through (4.4.0 IG/UG: `systemctl stop |
# restart xiraid.target`) — and prove the CLI can read the array list, so
# the failure names the daemon. An rc of 0 with an empty reply is the normal
# fresh-box answer; nothing here inspects or touches arrays.
# Contract: docs/Installer/spec.md §3.4.
- name: Verify the xiRAID daemon answers before any storage role runs
  tags: [xiraid, verify]
  block:
    - name: Ensure xiraid.target is running
      ansible.builtin.systemd:
        name: xiraid.target
        state: started

    - name: Probe the xiRAID daemon through the CLI (read-only)
      ansible.builtin.command: xicli raid show -f json
      register: xiraid_daemon_probe
      changed_when: false
      retries: 5
      delay: 2
      until: xiraid_daemon_probe.rc == 0

  rescue:
    - name: Fail because the xiRAID daemon does not answer
      ansible.builtin.fail:
        msg: >-
          xiRAID is installed but its daemon does not answer.
          Step '{{ ansible_failed_task.name }}' failed:
          {{ ansible_failed_result.msg | default('') }}
          {{ ansible_failed_result.stderr | default('') }}
          The storage roles read the array list through 'xicli raid show', so the
          play cannot continue. Inspect the daemon with 'systemctl status xiraid.target'
          and 'journalctl -u xiraid* -b', fix the cause, and re-run.
