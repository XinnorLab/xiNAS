# Default values for the nvme_namespace role
#
# This role automatically detects non-system NVMe drives, rebuilds namespaces,
# and generates RAID configuration for the raid_fs role.

# Enable/disable automatic namespace management
nvme_auto_namespace: true

# Drive detection mode:
#   "nvme" - Detect NVMe controllers only (bare metal with NVMe drives)
#   "all"  - Detect all block devices (VMs with virtio/SCSI drives)
# In "all" mode, namespace rebuild is skipped and whole drives are used directly
nvme_detect_mode: "nvme"

# Number of drives to assign to the log array (used in "all" mode)
# First N non-OS drives become log devices, remaining become data devices
nvme_log_drive_count: 2

# DEPRECATED / internal — namespace reuse vs. rebuild is now decided by
# xinas_storage_state (see tasks/detect_storage_state.yml, added in a later task),
# NOT by this knob. Retained only to avoid "undefined variable" on old inventories.
nvme_use_existing_namespaces: false

# Operator control for destroying and rebuilding storage (mirrors raid_fs default).
xinas_storage_reset: false

# Size of the small namespace (MB) - used for XFS log device
nvme_small_ns_size_mb: 500

# RAID levels for auto-generated arrays
nvme_raid_data_level: 5       # RAID 5 for large namespaces (data array)
nvme_raid_log_level: 10       # RAID 10 for small namespaces (log array)

# Strip sizes for RAID arrays (KB)
nvme_raid_data_strip_kb: 128
nvme_raid_log_strip_kb: 16

# Namespace format settings
nvme_namespace_block_size: 4096       # Block size in bytes (512, 4096)
nvme_namespace_shared: false          # Shared namespace (nmic=1) — keep false on non-HA single-controller drives; nvme create-ns rejects -m 1 there

# Safety settings
nvme_abort_if_no_system_drive: true   # Abort if system drive cannot be detected
nvme_skip_failed_devices: true        # Continue if individual device fails

# Storage cleanup settings
nvme_cleanup_existing_storage: true   # Detect and remove LVM, MD RAID, ZFS on data drives
nvme_skip_cleanup_confirmation: false  # Skip confirmation prompt (DANGEROUS - set true for automation)

# Minimum member counts for RAID creation, keyed by RAID level.
#
# These are the counts the xiRAID *engine* enforces, not textbook RAID math —
# `xicli raid create` rejects a 3-drive RAID 5 with "To create RAID level '5',
# a minimum of '4' disks are required." Read off the engine's own rejection
# messages on xiRAID Classic 4.4 (`xicli raid create --help` does not document
# them), so re-confirm these numbers when the engine version moves.
#
# docs/Storage/raid-management-spec.md §4 owns the table; the TUI Create Array
# wizard (_RAID_MIN_DRIVES in xinas_menu/screens/raid.py) and the control path
# (LEVEL_CONSTRAINTS in xiNAS-MCP/src/lib/xiraid/schema.ts) carry the same
# values. A level absent from this map falls back to nvme_raid_min_devices_default.
#
# Replaces the former nvme_min_devices_for_raid5 / nvme_min_devices_for_raid10
# scalars, which is how RAID 5 ended up with a 3-drive floor the engine rejects.
nvme_raid_min_devices:
  0: 2
  1: 2
  5: 4
  6: 4
  10: 4                               # RAID 10 additionally rounds down to an even count
  50: 8
  60: 8
nvme_raid_min_devices_default: 2
