---
# Detect existing NVMe namespaces on data drives.
# Converge path: included only when xinas_storage_state == MATCH and
# xinas_storage_reset is not set (see raid-spec.md §4.2). The legacy
# nvme_use_existing_namespaces knob no longer drives this include.

- name: Initialize namespace device lists
  ansible.builtin.set_fact:
    nvme_small_ns_devices: []
    nvme_large_ns_devices: []
    nvme_failed_devices: []

# Detect all existing namespaces on data drives
- name: Detect existing namespaces on data drives
  ansible.builtin.shell: |
    controller="{{ item }}"
    # List all namespaces on this controller
    ls -1 /dev/$(basename "$controller")n* 2>/dev/null | sort -V || true
  args:
    executable: /bin/bash
  register: existing_ns_result
  loop: "{{ nvme_data_drives }}"
  changed_when: false

# Build device lists from existing namespaces
# Assume: n1 = small (log), n2+ = large (data)
- name: Build namespace device lists from existing namespaces
  ansible.builtin.set_fact:
    nvme_small_ns_devices: >-
      {{ nvme_small_ns_devices | default([]) +
         (item.stdout_lines | select('match', '.*/nvme[0-9]+n1$') | list) }}
    nvme_large_ns_devices: >-
      {{ nvme_large_ns_devices | default([]) +
         (item.stdout_lines | select('match', '.*/nvme[0-9]+n[2-9]$') | list) +
         (item.stdout_lines | select('match', '.*/nvme[0-9]+n[0-9][0-9]+$') | list) }}
  loop: "{{ existing_ns_result.results }}"
  when: item.stdout_lines | length > 0

# Shown before the single-namespace check below so the operator sees the
# per-tier device evidence in the failure path too, not only on success.
- name: Display detected existing namespaces
  ansible.builtin.debug:
    msg: |
      ========== Existing Namespace Detection ==========
      Small namespaces (n1) detected: {{ nvme_small_ns_devices | length }}
        {{ nvme_small_ns_devices | join('\n        ') | default('none') }}

      Large namespaces (n2+) detected: {{ nvme_large_ns_devices | length }}
        {{ nvme_large_ns_devices | join('\n        ') | default('none') }}
      ==================================================

# No n2+ namespaces found on any data drive: this is a single-namespace-per-
# drive layout. Existing-namespace reuse only supports the n1 (log) + n2
# (data) two-namespace layout — a converge can only reach this task when
# xinas_storage_state == MATCH, which itself requires the 'data' xiRAID array
# online and /dev/xi_data probing as XFS with the configured label (see
# detect_storage_state.yml); that array is built from n2 devices, so a
# healthy converge always finds n2+ and never trips this fail. Fail loudly
# instead of silently reassigning n1 to data, which used to mask this exact
# situation behind a later, generic "insufficient devices" error. See
# raid-spec.md §4.2.
- name: Fail on single-namespace layout (existing-namespace reuse unsupported)
  ansible.builtin.fail:
    msg: >-
      Existing-namespace reuse requires the n1 (log) + n2 (data) two-namespace
      layout on every data drive; found {{ nvme_small_ns_devices | length }}
      n1 device(s) and 0 n2+ device(s), which is a single-namespace layout
      that cannot be reused. Re-run with xinas_storage_reset=true to wipe and
      rebuild the expected two-namespace layout (destroys data; requires an
      interactive YES confirmation, or nvme_skip_cleanup_confirmation=true for
      automation), or provision the n1+n2 layout manually before re-running.
  when:
    - nvme_large_ns_devices | length == 0
    - nvme_small_ns_devices | length > 0
