---
# Detect and remove existing storage configurations (LVM, MD RAID, ZFS) on data drives
# This runs before namespace operations to ensure clean drives
#
# All device selection goes through the boundary-safe is_data_member helper
# (files/disk_match.sh): a candidate PV / MD component / ZFS member is a target
# only if it sits on a DATA drive and NOT on any protected OS disk. This closes
# the string-prefix hole where a data controller /dev/nvme1 matched an OS disk
# /dev/nvme10. See docs/Installer/raid-spec.md §3.

- name: Initialize cleanup tracking
  ansible.builtin.set_fact:
    nvme_found_lvm_pvs: []
    nvme_found_lvm_vgs: []
    nvme_found_md_arrays: []
    nvme_found_zpools: []
    nvme_cleanup_required: false

- name: Stage the boundary-safe disk-match helper
  ansible.builtin.copy:
    src: disk_match.sh
    dest: /tmp/xinas_disk_match.sh
    mode: "0644"
  changed_when: false

# ============ DETECT LVM ============
- name: Check for LVM physical volumes on data drives
  ansible.builtin.shell: |
    source /tmp/xinas_disk_match.sh || { echo "xinas_disk_match.sh helper missing; skipping sweep" >&2; exit 0; }
    DATA_DRIVES="{{ nvme_data_drives | join(' ') }}"
    SYSTEM_DISKS="{{ nvme_system_drives | default([]) | join(' ') }}"
    SYSTEM_CTRLS="{{ nvme_system_controllers | default([]) | join(' ') }}"
    pvs --noheadings -o pv_name,vg_name 2>/dev/null | while read -r pv vg; do
      if is_data_member "$pv"; then
        echo "${pv}|${vg}"
      fi
    done
  args:
    executable: /bin/bash
  register: lvm_pv_check
  changed_when: false
  failed_when: false

- name: Parse LVM physical volumes
  ansible.builtin.set_fact:
    nvme_found_lvm_pvs: "{{ lvm_pv_check.stdout_lines | default([]) }}"
  when: lvm_pv_check.stdout_lines | default([]) | length > 0

- name: Extract unique VGs from PVs
  ansible.builtin.set_fact:
    nvme_found_lvm_vgs: "{{ nvme_found_lvm_pvs | map('regex_replace', '^.*\\|', '') | select('ne', '') | unique | list }}"
  when: nvme_found_lvm_pvs | length > 0

# ============ DETECT MD RAID ============
- name: Check for MD RAID arrays using data drives
  ansible.builtin.shell: |
    source /tmp/xinas_disk_match.sh || { echo "xinas_disk_match.sh helper missing; skipping sweep" >&2; exit 0; }
    DATA_DRIVES="{{ nvme_data_drives | join(' ') }}"
    SYSTEM_DISKS="{{ nvme_system_drives | default([]) | join(' ') }}"
    SYSTEM_CTRLS="{{ nvme_system_controllers | default([]) | join(' ') }}"
    for md in /dev/md*; do
      [ -b "$md" ] || continue
      # Get component devices
      components=$(mdadm --detail "$md" 2>/dev/null | grep -E '^\s+/dev/' | awk '{print $NF}')
      for comp in $components; do
        if is_data_member "$comp"; then
          echo "$md"
          break
        fi
      done
    done 2>/dev/null | sort -u
  args:
    executable: /bin/bash
  register: md_array_check
  changed_when: false
  failed_when: false

- name: Parse MD RAID arrays
  ansible.builtin.set_fact:
    nvme_found_md_arrays: "{{ md_array_check.stdout_lines | default([]) }}"
  when: md_array_check.stdout_lines | default([]) | length > 0

# ============ DETECT ZFS ============
- name: Check if ZFS is available
  ansible.builtin.command: which zpool
  register: zpool_available
  changed_when: false
  failed_when: false

- name: Check for ZFS pools using data drives
  ansible.builtin.shell: |
    source /tmp/xinas_disk_match.sh || { echo "xinas_disk_match.sh helper missing; skipping sweep" >&2; exit 0; }
    DATA_DRIVES="{{ nvme_data_drives | join(' ') }}"
    SYSTEM_DISKS="{{ nvme_system_drives | default([]) | join(' ') }}"
    SYSTEM_CTRLS="{{ nvme_system_controllers | default([]) | join(' ') }}"
    zpool list -H -o name 2>/dev/null | while read -r pool; do
      # Resolve vdevs to real full paths (-L follows symlinks, -P prints full
      # paths) and keep the /dev/* entries. Device-type agnostic: nvme*, sd*,
      # vd* (the xinnorVM device type) and by-id vdevs all resolve to their
      # real /dev node — a name-prefix grep would miss everything but nvme/sd.
      devices=$(zpool status -LP "$pool" 2>/dev/null | awk '$1 ~ /^\/dev\// { print $1 }')
      for dev in $devices; do
        if is_data_member "$dev"; then
          echo "$pool"
          break
        fi
      done
    done 2>/dev/null | sort -u
  args:
    executable: /bin/bash
  register: zpool_check
  changed_when: false
  failed_when: false
  when: zpool_available.rc == 0

- name: Parse ZFS pools
  ansible.builtin.set_fact:
    nvme_found_zpools: "{{ zpool_check.stdout_lines | default([]) }}"
  when:
    - zpool_available.rc | default(1) == 0
    - zpool_check.stdout_lines | default([]) | length > 0

# ============ DETERMINE IF CLEANUP NEEDED ============
- name: Check if cleanup is required
  ansible.builtin.set_fact:
    nvme_cleanup_required: >-
      {{ (nvme_found_lvm_vgs | length > 0) or
         (nvme_found_md_arrays | length > 0) or
         (nvme_found_zpools | length > 0) }}

# ============ DISPLAY FINDINGS ============
- name: Display detected storage configurations
  ansible.builtin.debug:
    msg: |
      ╔══════════════════════════════════════════════════════════════════════╗
      ║  ⚠️  EXISTING STORAGE CONFIGURATIONS DETECTED                        ║
      ╠══════════════════════════════════════════════════════════════════════╣
      {% if nvme_found_lvm_vgs | length > 0 %}
      ║  LVM Volume Groups:                                                  ║
      {% for vg in nvme_found_lvm_vgs %}
      ║    • {{ vg | regex_replace('(.{60}).*', '\1...') }}{{ ' ' * (58 - (vg | length if vg | length < 60 else 60)) }}║
      {% endfor %}
      {% endif %}
      {% if nvme_found_md_arrays | length > 0 %}
      ║  MD RAID Arrays:                                                     ║
      {% for md in nvme_found_md_arrays %}
      ║    • {{ md }}{{ ' ' * (62 - md | length) }}║
      {% endfor %}
      {% endif %}
      {% if nvme_found_zpools | length > 0 %}
      ║  ZFS Pools:                                                          ║
      {% for pool in nvme_found_zpools %}
      ║    • {{ pool }}{{ ' ' * (62 - pool | length) }}║
      {% endfor %}
      {% endif %}
      ╠══════════════════════════════════════════════════════════════════════╣
      ║  These will be DESTROYED to prepare drives for xiRAID.               ║
      ║  ALL DATA ON THESE STORAGE CONFIGURATIONS WILL BE LOST!              ║
      ║  Partition tables/signatures will also be wiped on ALL {{ nvme_data_drives | length }} data drive(s):
      ║    {{ nvme_data_drives | join(', ') }}
      ╚══════════════════════════════════════════════════════════════════════╝
  when: nvme_cleanup_required | bool

- name: No cleanup required
  ansible.builtin.debug:
    msg: "No existing LVM, MD RAID, or ZFS configurations found on data drives."
  when: not (nvme_cleanup_required | bool)

# ============ CONFIRMATION PROMPT ============
- name: Prompt for cleanup confirmation
  ansible.builtin.pause:
    prompt: |

      ╔══════════════════════════════════════════════════════════════════════╗
      ║  ⚠️  WARNING: DATA DESTRUCTION                                       ║
      ╠══════════════════════════════════════════════════════════════════════╣
      ║  The following will be permanently destroyed:                        ║
      ║    • {{ nvme_found_lvm_vgs | length }} LVM volume group(s)                                        ║
      ║    • {{ nvme_found_md_arrays | length }} MD RAID array(s)                                           ║
      ║    • {{ nvme_found_zpools | length }} ZFS pool(s)                                                 ║
      ║  Partition tables/signatures will be wiped on ALL {{ nvme_data_drives | length }} data drive(s):
      ║    {{ nvme_data_drives | join(', ') }}
      ╠══════════════════════════════════════════════════════════════════════╣
      ║  Type 'YES' to proceed, or press Ctrl+C to abort                     ║
      ╚══════════════════════════════════════════════════════════════════════╝

      Confirm destruction (YES/no)
  register: cleanup_confirmation
  when:
    - nvme_cleanup_required | bool
    - not (nvme_skip_cleanup_confirmation | default(false) | bool)

- name: Verify confirmation
  ansible.builtin.fail:
    msg: "Cleanup cancelled by user. Aborting to protect existing data."
  when:
    - nvme_cleanup_required | bool
    - not (nvme_skip_cleanup_confirmation | default(false) | bool)
    - cleanup_confirmation.user_input | default('') | upper != 'YES'

# ============ REMOVE ZFS POOLS ============
- name: Destroy ZFS pools
  ansible.builtin.command: "zpool destroy -f {{ item }}"
  loop: "{{ nvme_found_zpools }}"
  when:
    - nvme_found_zpools | length > 0
    - nvme_cleanup_required | bool
  register: zpool_destroy
  failed_when: false

- name: Report ZFS pool destruction
  ansible.builtin.debug:
    msg: "Destroyed ZFS pool: {{ item.item }} (rc={{ item.rc }})"
  loop: "{{ zpool_destroy.results | default([]) }}"
  when: zpool_destroy.results is defined

# ============ REMOVE MD RAID ARRAYS ============
- name: Stop MD RAID arrays
  ansible.builtin.command: "mdadm --stop {{ item }}"
  loop: "{{ nvme_found_md_arrays }}"
  when:
    - nvme_found_md_arrays | length > 0
    - nvme_cleanup_required | bool
  register: md_stop
  failed_when: false

- name: Zero MD superblocks on data drives
  ansible.builtin.shell: |
    source /tmp/xinas_disk_match.sh || { echo "xinas_disk_match.sh helper missing; skipping sweep" >&2; exit 0; }
    DATA_DRIVES="{{ nvme_data_drives | join(' ') }}"
    SYSTEM_DISKS="{{ nvme_system_drives | default([]) | join(' ') }}"
    SYSTEM_CTRLS="{{ nvme_system_controllers | default([]) | join(' ') }}"
    # Enumerate real block devices and act only on those that resolve to a data
    # drive — never glob ${drive}* (which would reach /dev/nvme10 from nvme1).
    lsblk -rnpo NAME,TYPE 2>/dev/null | awk '$2 == "part" || $2 == "disk" { print $1 }' | while IFS= read -r part; do
      is_data_member "$part" || continue
      [ -b "$part" ] && mdadm --zero-superblock "$part" 2>/dev/null || true
    done
  args:
    executable: /bin/bash
  when:
    - nvme_found_md_arrays | length > 0
    - nvme_cleanup_required | bool
  changed_when: false
  failed_when: false

# ============ REMOVE LVM ============
- name: Deactivate LVM volume groups
  ansible.builtin.command: "vgchange -an {{ item }}"
  loop: "{{ nvme_found_lvm_vgs }}"
  when:
    - nvme_found_lvm_vgs | length > 0
    - nvme_cleanup_required | bool
  register: vg_deactivate
  failed_when: false

- name: Remove LVM volume groups
  ansible.builtin.command: "vgremove -f {{ item }}"
  loop: "{{ nvme_found_lvm_vgs }}"
  when:
    - nvme_found_lvm_vgs | length > 0
    - nvme_cleanup_required | bool
  register: vg_remove
  failed_when: false

- name: Remove LVM physical volumes on data drives
  ansible.builtin.shell: |
    source /tmp/xinas_disk_match.sh || { echo "xinas_disk_match.sh helper missing; skipping sweep" >&2; exit 0; }
    DATA_DRIVES="{{ nvme_data_drives | join(' ') }}"
    SYSTEM_DISKS="{{ nvme_system_drives | default([]) | join(' ') }}"
    SYSTEM_CTRLS="{{ nvme_system_controllers | default([]) | join(' ') }}"
    lsblk -rnpo NAME,TYPE 2>/dev/null | awk '$2 == "part" || $2 == "disk" { print $1 }' | while IFS= read -r part; do
      is_data_member "$part" || continue
      [ -b "$part" ] && pvremove -f "$part" 2>/dev/null || true
    done
  args:
    executable: /bin/bash
  when:
    - nvme_found_lvm_pvs | length > 0
    - nvme_cleanup_required | bool
  changed_when: false
  failed_when: false

# ============ WIPE PARTITION TABLES ============
# In the default NVMe mode nvme_data_drives holds controller CHAR devices
# (/dev/nvme0, /dev/nvme1, ...); wipefs/dd/blockdev/partprobe are block-device
# operations and silently no-op on those. Enumerate real whole-disk block
# devices via lsblk and act only on the ones is_data_member resolves to a data
# drive: a controller entry thus reaches its namespace block devices
# (/dev/nvme0n1, ...), a whole-disk entry (/dev/vdb) matches itself, and
# anything on a protected OS disk stays vetoed. partprobe runs in the same
# loop so the kernel re-read targets exactly the devices that were wiped.
- name: Wipe partition tables on data drives
  ansible.builtin.shell: |
    source /tmp/xinas_disk_match.sh || { echo "xinas_disk_match.sh helper missing; skipping sweep" >&2; exit 0; }
    DATA_DRIVES="{{ nvme_data_drives | join(' ') }}"
    SYSTEM_DISKS="{{ nvme_system_drives | default([]) | join(' ') }}"
    SYSTEM_CTRLS="{{ nvme_system_controllers | default([]) | join(' ') }}"
    lsblk -rnpo NAME,TYPE 2>/dev/null | awk '$2 == "disk" { print $1 }' | while IFS= read -r dev; do
      is_data_member "$dev" || continue
      [ -b "$dev" ] || continue
      # Wipe GPT and MBR signatures
      wipefs -a "$dev" 2>/dev/null || true
      # Clear first MB (MBR + primary GPT header)
      dd if=/dev/zero of="$dev" bs=1M count=1 2>/dev/null || true
      # Clear last MB (GPT backup header). Capture the size defensively: if
      # the device vanished after the -b check, an inline $(( $(blockdev ...)
      # / 2048 - 1 )) is a FATAL arithmetic error that kills the whole loop —
      # the remaining drives would silently get no wipe/partprobe.
      sz=$(blockdev --getsz "$dev" 2>/dev/null || echo 0)
      case "$sz" in (''|*[!0-9]*) sz=0;; esac
      if [ "$sz" -gt 2048 ]; then
        dd if=/dev/zero of="$dev" bs=1M seek=$((sz / 2048 - 1)) count=1 2>/dev/null || true
      fi
      # Inform the kernel of the partition-table change
      partprobe "$dev" 2>/dev/null || true
    done
  args:
    executable: /bin/bash
  when: nvme_cleanup_required | bool
  changed_when: false
  failed_when: false

# ============ SUMMARY ============
- name: Cleanup summary
  ansible.builtin.debug:
    msg: |
      ╔══════════════════════════════════════════════════════════════════════╗
      ║  ✓ STORAGE CLEANUP COMPLETE                                          ║
      ╠══════════════════════════════════════════════════════════════════════╣
      ║  Removed:                                                            ║
      ║    • {{ nvme_found_lvm_vgs | length }} LVM volume group(s)                                        ║
      ║    • {{ nvme_found_md_arrays | length }} MD RAID array(s)                                           ║
      ║    • {{ nvme_found_zpools | length }} ZFS pool(s)                                                 ║
      ║                                                                      ║
      ║  Data drives are now clean and ready for xiRAID configuration.       ║
      ╚══════════════════════════════════════════════════════════════════════╝
  when: nvme_cleanup_required | bool
