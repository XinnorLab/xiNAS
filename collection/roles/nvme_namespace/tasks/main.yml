---
# Main entry point for nvme_namespace role
#
# This role detects non-system drives, optionally rebuilds NVMe namespaces,
# and generates RAID configuration for the raid_fs role.
#
# Two detection modes:
#   "nvme" (default) - NVMe controllers only, creates a small (NSID 1) and a
#                      large (NSID 2) namespace per drive; block devices are
#                      resolved by serial + NSID, never by the nvmeXnY name
#   "all"            - All block devices (VMs), uses whole drives directly

- name: Check if automatic namespace management is enabled
  ansible.builtin.debug:
    msg: |
      Automatic namespace management is DISABLED.
      Set nvme_auto_namespace: true to enable.
      Using manual RAID configuration from presets.
  when: not nvme_auto_namespace | bool

- name: Storage-state preflight (both modes)
  when: nvme_auto_namespace | bool
  block:
    - name: Detect current storage state
      ansible.builtin.include_tasks: detect_storage_state.yml

    - name: Fail fast when the storage state could not be determined (UNKNOWN)
      ansible.builtin.fail:
        msg: >-
          Could not determine what is on this node (state=UNKNOWN): a read-only probe
          failed, so an existing array is indistinguishable from a fresh box. Refusing
          to provision. {{ xinas_storage_probe_hint | default('') }}
      when:
        - (xinas_storage_state | default('UNKNOWN')) == 'UNKNOWN'
        - not (xinas_storage_reset | default(false) | bool)

    - name: Fail fast on an existing xiNAS layout whose arrays are not online
      ansible.builtin.fail:
        msg: >-
          The expected xiNAS arrays exist but are not online
          (states={{ xinas_storage_array_states | default({}) }}). Refusing to
          touch the storage. Repair the array — or let a rebuild finish — and
          re-run; a healthy array converges. Do NOT set xinas_storage_reset to
          get past this: it would destroy the data on a recoverable array.
      when:
        - (xinas_storage_state | default('UNKNOWN')) == 'FOREIGN'
        - xinas_storage_arrays_unhealthy | default(false) | bool
        - not (xinas_storage_reset | default(false) | bool)

    - name: Fail fast on unexpected existing storage (FOREIGN)
      ansible.builtin.fail:
        msg: >-
          Existing storage does not match the expected xiNAS layout (state=FOREIGN).
          Refusing to touch it. Set xinas_storage_reset=true to wipe and rebuild, or
          clean the drives manually. To keep these arrays and reformat only the
          filesystem, re-run the wizard and confirm the force-format prompt
          (xinas_fs_force_format=true).
      when:
        - (xinas_storage_state | default('UNKNOWN')) == 'FOREIGN'
        - not (xinas_storage_reset | default(false) | bool)
        - not (xinas_fs_force_format | default(false) | bool)

    - name: Confirm reset before any destructive operation
      ansible.builtin.include_tasks: storage_reset_confirm.yml
      when: xinas_storage_reset | default(false) | bool

# ═══════════════════════════════════════════════════════════════════════════════
# Mode: "all" - Detect all block devices (VMs with virtio/SCSI drives)
# Uses whole drives directly, no namespace management
# ═══════════════════════════════════════════════════════════════════════════════

- name: Run all-drive detection (VM mode)
  when:
    - nvme_auto_namespace | bool
    - nvme_detect_mode | default('nvme') == 'all'
  block:
    - name: Detect all non-OS block devices
      ansible.builtin.include_tasks: detect_all_drives.yml

    - name: Abort if system drive not found
      ansible.builtin.fail:
        msg: |
          CRITICAL: Could not detect the OS system drive.
          Aborting to prevent accidental data loss on the OS drive.
          (The root filesystem did not resolve to a physical disk — expected for
          diskless / iSCSI / unresolved-ZFS roots.)
          If this is intentional, set nvme_abort_if_no_system_drive: false
      when:
        - nvme_abort_if_no_system_drive | bool
        - (nvme_system_drives is not defined or nvme_system_drives | length == 0)
          or not (nvme_system_root_resolved | default(false))

    - name: Check for available data drives
      ansible.builtin.debug:
        msg: |
          No data drives found. All detected drives appear to be system drives.
      when: nvme_data_drives | length == 0

    - name: Cleanup existing storage configurations
      ansible.builtin.include_tasks: cleanup_storage.yml
      when:
        - nvme_data_drives | length > 0
        - nvme_cleanup_existing_storage | default(true) | bool
        - (xinas_storage_reset | default(false) | bool)
          or (xinas_storage_state | default('UNKNOWN')) == 'EMPTY'

    - name: Generate RAID configuration
      ansible.builtin.include_tasks: generate_raid_config.yml
      when:
        - nvme_data_drives | length > 0
        - nvme_small_ns_devices is defined
        - nvme_large_ns_devices is defined
        - nvme_small_ns_devices | length > 0
        - nvme_large_ns_devices | length > 0

    - name: Display final summary (VM mode)
      ansible.builtin.debug:
        msg: |
          ============ Drive Detection Complete (VM Mode) ============
          System drives (protected): {{ nvme_system_drives | join(', ') }}
          Data drives found: {{ nvme_data_drives | length }}

          Drive assignment:
            Log drives (first {{ nvme_log_drive_count }}): {{ nvme_small_ns_devices | default([]) | join(', ') }}
            Data drives (remaining): {{ nvme_large_ns_devices | default([]) | join(', ') }}

          RAID configuration generated for raid_fs role:
            Data array: RAID {{ nvme_raid_data_level }} with {{ nvme_large_ns_devices | default([]) | length }} devices
            Log array: RAID {{ nvme_raid_log_level }} with {{ nvme_small_ns_devices | default([]) | length }} devices
          ===========================================================
      when: nvme_data_drives | length > 0

# ═══════════════════════════════════════════════════════════════════════════════
# Mode: "nvme" - NVMe controller detection with namespace management (default)
# ═══════════════════════════════════════════════════════════════════════════════

- name: Run NVMe namespace management
  when:
    - nvme_auto_namespace | bool
    - nvme_detect_mode | default('nvme') == 'nvme'
  block:
    # Phase 1: Detect system and data drives
    - name: Detect system and data drives
      ansible.builtin.include_tasks: detect_drives.yml

    # Phase 2: Abort if system drive not found (safety check) — MUST run before
    # any cleanup so a failed OS-disk detection never reaches vgremove/wipefs.
    - name: Abort if system drive not found
      ansible.builtin.fail:
        msg: |
          CRITICAL: Could not detect the OS system drive.
          Aborting to prevent accidental data loss on the OS drive.
          (The root filesystem did not resolve to a physical disk — expected for
          diskless / iSCSI / unresolved-ZFS roots.)
          If this is intentional, set nvme_abort_if_no_system_drive: false
      when:
        - nvme_abort_if_no_system_drive | bool
        - (nvme_system_drives is not defined or nvme_system_drives | length == 0)
          or not (nvme_system_root_resolved | default(false))

    # Phase 3: Cleanup existing storage (LVM, MD, ZFS) on data drives
    - name: Cleanup existing storage configurations
      ansible.builtin.include_tasks: cleanup_storage.yml
      when:
        - nvme_data_drives | length > 0
        - nvme_cleanup_existing_storage | default(true) | bool
        - (xinas_storage_reset | default(false) | bool)
          or (xinas_storage_state | default('UNKNOWN')) == 'EMPTY'

    # Phase 4: Check if there are any data drives to process
    - name: Check for available data drives
      ansible.builtin.debug:
        msg: |
          No NVMe data drives found for namespace operations.
          All detected NVMe drives appear to be system drives.
      when: nvme_data_drives | length == 0

    # Phase 5: MATCH → converge (reuse existing namespaces); EMPTY/reset → rebuild.
    - name: Use existing namespaces (converge)
      ansible.builtin.include_tasks: detect_existing_namespaces.yml
      when:
        - nvme_data_drives | length > 0
        - (xinas_storage_state | default('UNKNOWN')) == 'MATCH'
        - not (xinas_storage_reset | default(false) | bool)

    - name: Collect NVMe topology for namespace rebuild
      ansible.builtin.include_tasks: collect_topology.yml
      when:
        - nvme_data_drives | length > 0
        - (xinas_storage_reset | default(false) | bool)
          or (xinas_storage_state | default('UNKNOWN')) == 'EMPTY'

    # Phase 6: Rebuild namespaces (fresh install or explicit reset)
    - name: Rebuild namespaces on data drives
      ansible.builtin.include_tasks: rebuild_namespaces.yml
      when:
        - nvme_data_drives | length > 0
        - (xinas_storage_reset | default(false) | bool)
          or (xinas_storage_state | default('UNKNOWN')) == 'EMPTY'

    # Phase 7: Generate RAID configuration (only if namespaces were created)
    - name: Generate RAID configuration
      ansible.builtin.include_tasks: generate_raid_config.yml
      when:
        - nvme_data_drives | length > 0
        - nvme_small_ns_devices is defined
        - nvme_large_ns_devices is defined
        - nvme_small_ns_devices | length > 0
        - nvme_large_ns_devices | length > 0

    # Phase 8: Summary report
    - name: Display final summary
      ansible.builtin.debug:
        msg: |
          ============ NVMe Namespace Management Complete ============
          System drives (protected): {{ nvme_system_drives | join(', ') }}
          Data drives processed: {{ nvme_data_drives | length }}

          Namespace creation:
            Small namespaces (NSID 1, {{ nvme_small_ns_size_mb }}MB): {{ nvme_small_ns_devices | default([]) | length }}
            Large namespaces (NSID 2, remaining): {{ nvme_large_ns_devices | default([]) | length }}

          {% if nvme_failed_devices | default([]) | length > 0 %}
          FAILED DEVICES: {{ nvme_failed_devices | join(', ') }}
          {% endif %}

          RAID configuration generated for raid_fs role:
            Data array: RAID {{ nvme_raid_data_level }} with {{ nvme_large_ns_devices | default([]) | length }} devices
            Log array: RAID {{ nvme_raid_log_level }} with {{ nvme_small_ns_devices | default([]) | length }} devices
          ===========================================================
      when: nvme_data_drives | length > 0

# ═══════════════════════════════════════════════════════════════════════════════
# Fallback: "nvme" mode found no data drives.
# Either a VM (virtio/SCSI, no NVMe controllers) or a misconfigured bare-metal
# host. Re-probe all block devices, then auto-continue in whole-disk mode on a
# VM or fail with an actionable message.
# ═══════════════════════════════════════════════════════════════════════════════

- name: Fallback when NVMe detection found no data drives
  when:
    - nvme_auto_namespace | bool
    - nvme_detect_mode | default('nvme') == 'nvme'
    - nvme_data_drives | default([]) | length == 0
  block:
    - name: Re-probe all block devices for non-NVMe candidates
      ansible.builtin.include_tasks: detect_all_drives.yml

    - name: Abort if system drive not found (fallback)
      ansible.builtin.fail:
        msg: |
          CRITICAL: Could not detect the OS system drive during VM fallback.
          Aborting to prevent accidental data loss on the OS drive.
          (The root filesystem did not resolve to a physical disk — expected for
          diskless / iSCSI / unresolved-ZFS roots.)
          If this is intentional, set nvme_abort_if_no_system_drive: false
      when:
        - nvme_abort_if_no_system_drive | bool
        - (nvme_system_drives is not defined or nvme_system_drives | length == 0)
          or not (nvme_system_root_resolved | default(false))

    - name: Fail when no data drives exist at all
      ansible.builtin.fail:
        msg: |
          No data drives found (no NVMe namespaces and no non-OS block devices).
          Attach data disks before deploying.
      when: nvme_data_drives | default([]) | length == 0

    - name: Detect virtualization
      ansible.builtin.command: systemd-detect-virt
      register: nvme_virt_check
      changed_when: false
      failed_when: false

    - name: Fail-fast on bare metal with non-NVMe disks present
      ansible.builtin.fail:
        msg: |
          Detected {{ nvme_data_drives | length }} non-NVMe disk(s)
          ({{ nvme_data_drives | join(', ') }}) but 0 NVMe data drives, and this
          host is not virtualized.

          If these are your intended data drives, re-run with the xinnorVM preset
          or set nvme_detect_mode: all.
          If you expected NVMe drives, verify the NVMe controllers are present and
          not held by the OS.
      when: (nvme_virt_check.stdout | default('') | trim) in ['', 'none']

    - name: Auto-continue in whole-disk mode (VM detected)
      when: (nvme_virt_check.stdout | default('') | trim) not in ['', 'none']
      block:
        - name: Announce VM auto-fallback
          ansible.builtin.debug:
            msg: |
              WARNING: No NVMe data drives found, but virtualization was detected
              ({{ nvme_virt_check.stdout | trim }}). Auto-selecting whole-disk (VM)
              detection — all {{ nvme_data_drives | length }} non-OS block
              device(s) will be consumed for RAID, exactly as the xinnorVM preset
              would. Re-run with an explicit preset to override.

        - name: Force RAID1 log level for the VM fallback
          ansible.builtin.set_fact:
            nvme_raid_log_level: 1

        - name: Cleanup existing storage configurations (fallback)
          ansible.builtin.include_tasks: cleanup_storage.yml
          when:
            - nvme_data_drives | length > 0
            - nvme_cleanup_existing_storage | default(true) | bool
            - (xinas_storage_reset | default(false) | bool)
              or (xinas_storage_state | default('UNKNOWN')) == 'EMPTY'

        - name: Generate RAID configuration (fallback)
          ansible.builtin.include_tasks: generate_raid_config.yml
          when: nvme_data_drives | length > 0
