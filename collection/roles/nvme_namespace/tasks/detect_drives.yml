---
# Detect system drives and enumerate NVMe data drives
#
# System-drive detection resolves each OS mount (/, /boot, /boot/efi) down to
# its underlying *physical* disk(s), walking through any device-mapper, LVM, or
# MD layer (see resolve_system_disks.yml). A guided-LVM / dm-crypt / MD-root
# install exposes the root fs as /dev/mapper/... or /dev/mdX, which must be
# traced back to the NVMe controller that hosts it — otherwise that controller
# is misclassified as a data drive and wiped. See raid-spec.md §2.

# Step 1: Resolve the physical disks backing the OS mounts (-> nvme_system_drives)
- name: Resolve system disks
  ansible.builtin.include_tasks: resolve_system_disks.yml

# Step 2: Get all NVMe controllers (base devices, not namespaces)
- name: List all NVMe controllers
  ansible.builtin.shell: |
    ls -1d /dev/nvme[0-9]* 2>/dev/null | grep -E '^/dev/nvme[0-9]+$' || true
  register: nvme_controllers_raw
  changed_when: false

- name: Parse NVMe controller list
  ansible.builtin.set_fact:
    nvme_all_controllers: "{{ nvme_controllers_raw.stdout_lines | default([]) }}"

# Step 3: Collapse system NVMe namespaces to their controller path
# A non-NVMe OS disk (sda/vda) yields an empty set here — that is a legitimate
# SATA-root + NVMe-data layout, not a failure.
- name: Identify system NVMe controllers
  ansible.builtin.set_fact:
    nvme_system_controllers: >-
      {{ nvme_system_drives
         | select('match', '^/dev/nvme')
         | map('regex_replace', 'n[0-9]+$', '')
         | unique
         | list }}

# Step 4: Everything that is not a system controller is a data drive
- name: Set data drives fact (excluding system drives)
  ansible.builtin.set_fact:
    nvme_data_drives: >-
      {{ nvme_all_controllers
         | reject('in', nvme_system_controllers)
         | list }}

# Step 5: Defense in depth — refuse to proceed if a protected controller leaked
# into the data set (guards against a future regression in the reject logic).
- name: Assert no system controller was classified as a data drive
  ansible.builtin.assert:
    that:
      - "nvme_data_drives | select('in', nvme_system_controllers) | list | length == 0"
    fail_msg: >-
      SAFETY ABORT: system NVMe controller(s)
      {{ nvme_data_drives | select('in', nvme_system_controllers) | list | join(', ') }}
      were about to be treated as data drives. Refusing to continue to avoid
      wiping the OS disk.
    success_msg: "System controllers correctly excluded from data drives."

# Step 6: Display detection results
- name: Display detected drives
  ansible.builtin.debug:
    msg: |
      ========== NVMe Drive Detection ==========
      System disks (PROTECTED): {{ nvme_system_drives | join(', ') | default('none') }}
        System controllers:     {{ nvme_system_controllers | join(', ') | default('none') }}

      Data drives (available for namespace operations):
        {{ nvme_data_drives | join('\n        ') | default('none found') }}

      Total data drives: {{ nvme_data_drives | length }}
      ===========================================
