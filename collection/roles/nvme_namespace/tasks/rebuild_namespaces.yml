---
# Rebuild NVMe namespaces on data drives
# Creates, per controller: a small namespace (500MB, the XFS log member) and a
# large namespace (remaining capacity, the data member). Their block devices
# are resolved by controller serial + NSID (files/nvme_ns_device.sh) — the
# nvmeXnY name is the kernel's head instance, not the NSID, and shifts after a
# delete/create cycle (new NSID 1 came up as nvme10n2 on xinas-box).
# See docs/Installer/raid-spec.md §4.3 and §4.5.

# Initialize tracking variables
- name: Initialize failed devices list
  ansible.builtin.set_fact:
    nvme_failed_devices: []
    nvme_small_ns_ids: {}
    nvme_large_ns_ids: {}

- name: Stage the NSID-to-device resolver
  ansible.builtin.copy:
    src: nvme_ns_device.sh
    dest: /tmp/xinas_nvme_ns_device.sh
    mode: "0755"
  changed_when: false

# Delete existing namespaces on each data drive
- name: Delete existing namespaces
  ansible.builtin.shell: |
    set -e
    controller="{{ item.controller }}"
    failed=0

    # Get controller ID for detach
    cntlid=$(nvme id-ctrl "$controller" 2>/dev/null | awk '/cntlid/{print $3}')
    cntlid=${cntlid:-0}
    # Remove 0x prefix if present
    cntlid=$(echo "$cntlid" | sed 's/^0x//')
    # Convert hex to decimal
    cntlid=$((16#$cntlid))

    # Get list of existing namespace IDs (use -a to include unattached namespaces)
    # Output format is "[   0]:0x1" - extract hex NSID after colon and convert to decimal
    ns_list=$(nvme list-ns "$controller" -a 2>/dev/null | awk -F: '{gsub(/^0x/,"",$2); if($2 ~ /^[0-9a-fA-F]+$/) printf "%d\n", strtonum("0x"$2)}' || true)

    for nsid in $ns_list; do
      echo "Detaching and deleting namespace $nsid on $controller (cntlid=$cntlid)"
      # Detach using actual controller ID
      nvme detach-ns "$controller" -n "$nsid" -c "$cntlid" 2>/dev/null || true
      # Delete the namespace
      if ! nvme delete-ns "$controller" -n "$nsid" 2>&1; then
        echo "Warning: Failed to delete namespace $nsid on $controller"
        failed=1
      fi
    done

    exit $failed
  args:
    executable: /bin/bash
  register: ns_delete_result
  loop: "{{ nvme_topology }}"
  changed_when: ns_delete_result.rc == 0
  failed_when: false

# Track failed deletions
- name: Track failed namespace deletions
  ansible.builtin.set_fact:
    nvme_failed_devices: "{{ nvme_failed_devices + [item.item.controller] }}"
  loop: "{{ ns_delete_result.results }}"
  when:
    - item.rc is defined
    - item.rc != 0

- name: Fail on namespace deletion errors
  ansible.builtin.fail:
    msg: "Failed to delete namespaces on: {{ nvme_failed_devices | join(', ') }}"
  when:
    - nvme_failed_devices | length > 0
    - not nvme_skip_failed_devices | bool

# Create small namespace (500MB) on each drive
- name: Create small namespace, size MB {{ nvme_small_ns_size_mb }}
  ansible.builtin.shell: |
    set -e
    controller="{{ item.controller }}"
    block_size="{{ nvme_namespace_block_size }}"
    size_mb="{{ nvme_small_ns_size_mb }}"
    shared="{{ nvme_namespace_shared | bool | lower }}"

    # Calculate block count using configured block size
    blocks=$(( size_mb * 1024 * 1024 / block_size ))

    # Determine LBA format index for desired block size
    # Parse available formats and find matching lbads
    target_lbads=9  # default 512 bytes (2^9)
    case "$block_size" in
      4096) target_lbads=12 ;;  # 2^12 = 4096
      512)  target_lbads=9 ;;   # 2^9 = 512
    esac

    # Find flbas index with matching lbads (no metadata)
    flbas=$(nvme id-ns "$controller" -n 0xffffffff 2>/dev/null | \
            grep -E "^lbaf\s+[0-9]+" | \
            grep "ms:0" | \
            grep "lbads:${target_lbads}" | \
            head -1 | \
            awk '{print $2}' | tr -d ':')

    if [ -z "$flbas" ]; then
      echo "Warning: Could not find LBA format for ${block_size} bytes, using format 0"
      flbas=0
    fi

    # Build nmic flag for shared namespace
    nmic_flag=""
    if [ "$shared" = "true" ]; then
      nmic_flag="-m 1"
    fi

    echo "Creating small namespace on $controller: $blocks blocks (${size_mb}MB, BS=${block_size}, flbas=${flbas}, shared=${shared})"

    # Create namespace with size and capacity equal
    nvme create-ns "$controller" -s "$blocks" -c "$blocks" -f "$flbas" -d 0 $nmic_flag

    # Get the new namespace ID (should be 1) - use -a to see unattached namespaces
    # Output format is "[   0]:0x1" - extract hex NSID and convert to decimal
    nsid=$(nvme list-ns "$controller" -a 2>/dev/null | tail -1 | awk -F: '{gsub(/^0x/,"",$2); printf "%d", strtonum("0x"$2)}')

    if [ -z "$nsid" ]; then
      echo "Error: Failed to get namespace ID after creation"
      exit 1
    fi

    # Get controller ID for attach
    cntlid=$(nvme id-ctrl "$controller" 2>/dev/null | awk '/cntlid/{print $3}')
    cntlid=${cntlid:-0}

    echo "Attaching namespace $nsid to controller (cntlid=$cntlid)"
    nvme attach-ns "$controller" -n "$nsid" -c "$cntlid"

    echo "Successfully created small namespace NSID $nsid on $controller"
    echo "created_nsid=$nsid"
  args:
    executable: /bin/bash
  register: small_ns_result
  loop: "{{ nvme_topology }}"
  when: item.controller not in nvme_failed_devices
  changed_when: small_ns_result.rc == 0
  failed_when: false

# Track failed small namespace creations
- name: Track failed small namespace creations
  ansible.builtin.set_fact:
    nvme_failed_devices: "{{ nvme_failed_devices + [item.item.controller] }}"
  loop: "{{ small_ns_result.results }}"
  when:
    - item.skipped is not defined or not item.skipped
    - item.rc is defined and item.rc != 0

# Remember the NSID each create-ns returned, per controller: the wait step
# below looks the block device up by it, never by name (raid-spec.md §4.5).
- name: Record the NSID each small namespace was created with
  ansible.builtin.set_fact:
    nvme_small_ns_ids: >-
      {{ nvme_small_ns_ids | combine({item.item.controller:
           (item.stdout_lines | select('match', '^created_nsid=[0-9]+$')
            | map('regex_replace', '^created_nsid=', '') | first)}) }}
  loop: "{{ small_ns_result.results }}"
  when:
    - item.skipped is not defined or not item.skipped
    - item.rc is defined and item.rc == 0
    - item.stdout_lines | default([]) | select('match', '^created_nsid=[0-9]+$') | list | length > 0

# Create large namespace (remaining capacity) on each drive
- name: Create large namespace (remaining capacity)
  ansible.builtin.shell: |
    set -e
    controller="{{ item.controller }}"
    block_size="{{ nvme_namespace_block_size }}"
    shared="{{ nvme_namespace_shared | bool | lower }}"

    # Get unallocated capacity
    unalloc=$(nvme id-ctrl "$controller" 2>/dev/null | grep -E '^\s*unvmcap\s*:' | awk -F: '{print $2}' | tr -d ' ')

    if [ -z "$unalloc" ] || [ "$unalloc" = "0" ]; then
      # Calculate from total capacity minus allocated
      total_cap=$(nvme id-ctrl "$controller" 2>/dev/null | grep -E '^\s*tnvmcap\s*:' | awk -F: '{print $2}' | tr -d ' ')
      # Get size of existing namespaces
      alloc=0
      for ns in $(nvme list-ns "$controller" -a 2>/dev/null | awk -F: '{gsub(/^0x/,"",$2); if($2 ~ /^[0-9a-fA-F]+$/) printf "%d\n", strtonum("0x"$2)}'); do
        ns_size=$(nvme id-ns "${controller}n${ns}" 2>/dev/null | grep -E '^\s*nsze\s*:' | awk -F: '{print $2}' | tr -d ' ')
        alloc=$((alloc + ns_size * block_size))
      done
      unalloc=$((total_cap - alloc))
    fi

    if [ "$unalloc" -le 1048576 ]; then
      echo "Warning: Insufficient unallocated capacity ($unalloc bytes) on $controller"
      exit 0
    fi

    # Determine LBA format index for desired block size
    target_lbads=9  # default 512 bytes (2^9)
    case "$block_size" in
      4096) target_lbads=12 ;;  # 2^12 = 4096
      512)  target_lbads=9 ;;   # 2^9 = 512
    esac

    # Find flbas index with matching lbads (no metadata)
    flbas=$(nvme id-ns "$controller" -n 0xffffffff 2>/dev/null | \
            grep -E "^lbaf\s+[0-9]+" | \
            grep "ms:0" | \
            grep "lbads:${target_lbads}" | \
            head -1 | \
            awk '{print $2}' | tr -d ':')

    if [ -z "$flbas" ]; then
      echo "Warning: Could not find LBA format for ${block_size} bytes, using format 0"
      flbas=0
    fi

    # Build nmic flag for shared namespace
    nmic_flag=""
    if [ "$shared" = "true" ]; then
      nmic_flag="-m 1"
    fi

    # Leave 1MB buffer, calculate blocks
    blocks=$(( (unalloc - 1048576) / block_size ))

    echo "Creating large namespace on $controller: $blocks blocks ($(( blocks * block_size / 1000000000 ))GB, BS=${block_size}, flbas=${flbas}, shared=${shared})"

    # Create namespace
    nvme create-ns "$controller" -s "$blocks" -c "$blocks" -f "$flbas" -d 0 $nmic_flag

    # Get the new namespace ID (should be 2) - use -a to see unattached namespaces
    # Output format is "[   0]:0x1" - extract hex NSID and convert to decimal
    nsid=$(nvme list-ns "$controller" -a 2>/dev/null | tail -1 | awk -F: '{gsub(/^0x/,"",$2); printf "%d", strtonum("0x"$2)}')

    if [ -z "$nsid" ]; then
      echo "Error: Failed to get namespace ID after creation"
      exit 1
    fi

    # Get controller ID for attach
    cntlid=$(nvme id-ctrl "$controller" 2>/dev/null | awk '/cntlid/{print $3}')
    cntlid=${cntlid:-0}

    echo "Attaching namespace $nsid to controller (cntlid=$cntlid)"
    nvme attach-ns "$controller" -n "$nsid" -c "$cntlid"

    echo "Successfully created large namespace NSID $nsid on $controller"
    echo "created_nsid=$nsid"
  args:
    executable: /bin/bash
  register: large_ns_result
  loop: "{{ nvme_topology }}"
  when: item.controller not in nvme_failed_devices
  changed_when: large_ns_result.rc == 0
  failed_when: false

# Track failed large namespace creations
- name: Track failed large namespace creations
  ansible.builtin.set_fact:
    nvme_failed_devices: "{{ nvme_failed_devices + [item.item.controller] }}"
  loop: "{{ large_ns_result.results }}"
  when:
    - item.skipped is not defined or not item.skipped
    - item.rc is defined and item.rc != 0

- name: Record the NSID each large namespace was created with
  ansible.builtin.set_fact:
    nvme_large_ns_ids: >-
      {{ nvme_large_ns_ids | combine({item.item.controller:
           (item.stdout_lines | select('match', '^created_nsid=[0-9]+$')
            | map('regex_replace', '^created_nsid=', '') | first)}) }}
  loop: "{{ large_ns_result.results }}"
  when:
    - item.skipped is not defined or not item.skipped
    - item.rc is defined and item.rc == 0
    - item.stdout_lines | default([]) | select('match', '^created_nsid=[0-9]+$') | list | length > 0

# Rescan NVMe subsystem to detect new namespaces
- name: Rescan NVMe controllers
  ansible.builtin.shell: |
    # Try nvme reset first, fall back to echo 1 to rescan
    nvme reset {{ item.controller }} 2>/dev/null || \
      echo 1 > /sys/class/nvme/{{ item.controller | basename }}/rescan 2>/dev/null || \
      true
  loop: "{{ nvme_topology }}"
  when: item.controller not in nvme_failed_devices
  changed_when: false
  failed_when: false

# Wait for the block devices — by identity (controller serial + NSID), never by
# name. The Y in nvmeXnY is the kernel's namespace-head instance, not the NSID:
# after the delete/create cycle above the new NSID 1 can come up as nvme10n2
# and NSID 2 as nvme10n3 (every data controller of xinas-box, 2026-09-03).
# files/nvme_ns_device.sh does the same sysfs lookup xiRAID uses for its own
# members ("<serial>_<nsid>"). See raid-spec.md §4.5.
- name: Wait for the small namespace block devices (by NSID)
  ansible.builtin.command:
    argv:
      - /bin/bash
      - /tmp/xinas_nvme_ns_device.sh
      - wait
      - "{{ item.controller }}"
      - "{{ nvme_small_ns_ids[item.controller] | default('') }}"
      - "30"
  register: small_ns_wait
  loop: "{{ nvme_topology }}"
  when:
    - item.controller not in nvme_failed_devices
    - item.controller in nvme_small_ns_ids
  changed_when: false
  failed_when: false

# A device that never came up is a per-drive failure like a delete or create
# failure. So is an item skipped here because create returned no NSID (the
# large step exits 0 without one on a drive with no unallocated capacity).
- name: Track controllers whose small namespace never came up
  ansible.builtin.set_fact:
    nvme_failed_devices: "{{ nvme_failed_devices + [item.item.controller] }}"
  loop: "{{ small_ns_wait.results }}"
  when:
    - item.item.controller not in nvme_failed_devices
    - (item.skipped | default(false)) or (item.rc | default(1)) != 0

- name: Wait for the large namespace block devices (by NSID)
  ansible.builtin.command:
    argv:
      - /bin/bash
      - /tmp/xinas_nvme_ns_device.sh
      - wait
      - "{{ item.controller }}"
      - "{{ nvme_large_ns_ids[item.controller] | default('') }}"
      - "30"
  register: large_ns_wait
  loop: "{{ nvme_topology }}"
  when:
    - item.controller not in nvme_failed_devices
    - item.controller in nvme_large_ns_ids
  changed_when: false
  failed_when: false

- name: Track controllers whose large namespace never came up
  ansible.builtin.set_fact:
    nvme_failed_devices: "{{ nvme_failed_devices + [item.item.controller] }}"
  loop: "{{ large_ns_wait.results }}"
  when:
    - item.item.controller not in nvme_failed_devices
    - (item.skipped | default(false)) or (item.rc | default(1)) != 0

# Same gate as the delete step: tolerated per drive with nvme_skip_failed_devices,
# fatal otherwise (this also catches create failures, which only ever track).
- name: Fail on namespace devices that never came up
  ansible.builtin.fail:
    msg: >-
      Namespace rebuild failed on: {{ nvme_failed_devices | join(', ') }}
      (nvme_skip_failed_devices=false). Block devices are matched by controller
      serial + NSID from sysfs; the wait output above lists the namespaces each
      controller actually exposes.
  when:
    - nvme_failed_devices | length > 0
    - not nvme_skip_failed_devices | bool

# Build device lists for RAID configuration — the paths the resolver printed.
- name: Build small namespace device list
  ansible.builtin.set_fact:
    nvme_small_ns_devices: >-
      {{ small_ns_wait.results
         | selectattr('rc', 'defined')
         | selectattr('rc', 'equalto', 0)
         | map(attribute='stdout')
         | map('trim')
         | select('match', '^/dev/')
         | list }}

- name: Build large namespace device list
  ansible.builtin.set_fact:
    nvme_large_ns_devices: >-
      {{ large_ns_wait.results
         | selectattr('rc', 'defined')
         | selectattr('rc', 'equalto', 0)
         | map(attribute='stdout')
         | map('trim')
         | select('match', '^/dev/')
         | list }}

- name: Display namespace rebuild results
  ansible.builtin.debug:
    msg: |
      ========== Namespace Rebuild Results ==========
      Small (log) namespaces resolved: {{ nvme_small_ns_devices | length }}
        {{ nvme_small_ns_devices | join('\n        ') | default('none', true) }}

      Large (data) namespaces resolved: {{ nvme_large_ns_devices | length }}
        {{ nvme_large_ns_devices | join('\n        ') | default('none', true) }}

      Failed devices: {{ nvme_failed_devices | join(', ') | default('none', true) }}
      (block devices matched by controller serial + NSID, not by the nvmeXnY name)
      ===============================================

# An empty tier is not the "individual device" failure nvme_skip_failed_devices
# tolerates — nothing downstream can work. Fail here, with the evidence, instead
# of letting main.yml skip generate_raid_config.yml (gated on both lists being
# non-empty) and raid_fs abort three roles later with "xiraid_arrays is not
# defined". See raid-spec.md §4.3 Step 6.
- name: Fail when the rebuild produced no usable namespace devices
  ansible.builtin.fail:
    msg: >-
      The namespace rebuild finished with {{ nvme_small_ns_devices | length }} small (log)
      and {{ nvme_large_ns_devices | length }} large (data) namespace device(s) across
      {{ nvme_topology | length }} data controller(s); failed controllers:
      {{ nvme_failed_devices | join(', ') | default('none', true) }}.
      Block devices are matched by controller serial + NSID
      (/sys/class/nvme/<ctrl>/serial, /sys/block/nvme*/device/serial, /sys/block/nvme*/nsid),
      not by the nvmeXnY name — check `nvme list-ns <ctrl> -a` and those sysfs files on
      the failed controllers, and the wait-task output above. Stopping here: raid_fs
      would otherwise abort later with "xiraid_arrays is not defined".
  when: nvme_small_ns_devices | length == 0 or nvme_large_ns_devices | length == 0
