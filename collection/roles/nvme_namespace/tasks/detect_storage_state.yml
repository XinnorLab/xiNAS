---
# Read-only storage-identity detection. Sets xinas_storage_state to one of:
#   MATCH   - every expected xiRAID array online AND the data volume is XFS with the wanted label
#   EMPTY   - both probes ANSWERED, and what they answered was "nothing here"
#   FOREIGN - some xiRAID/fs signature exists but does not match the expected layout
#   UNKNOWN - a probe could not answer; the box is not provably empty
#
# EMPTY is what authorizes namespace deletion and mkfs (raid-spec §11), so it is
# only ever reached from SUCCESSFUL negative probes. This matters because a
# failed probe looks exactly like a factory-fresh node: with xiRAID down (daemon
# stopped, kernel module not loaded, xicli absent) `xicli raid show` exits
# non-zero AND /dev/xi_data does not exist, so an unguarded classifier reads a
# live, data-bearing array as EMPTY and wipes it on a routine re-run. Both probes
# therefore record whether they answered at all, and UNKNOWN outranks every other
# state — including FOREIGN, which would claim knowledge of an array list we do
# not have.
#
# "Online" is read out of the daemon's own per-array `state` words — it is not
# inferred from the array merely existing. A degraded, offline, initializing or
# state-less expected array is therefore NOT a MATCH; with arrays present it
# lands in FOREIGN, which fails fast without touching anything. §4.2 of
# docs/Installer/raid-spec.md leans on that: a genuine MATCH implies a healthy
# `data` array, and that array is built from the large (NSID 2) namespaces.
#
# The expected layout is read from the preset, not hard-coded (raid-spec §11):
# the array names come from `xiraid_arrays`, the probed volume from
# `xfs_filesystems[0].data_device`. raid_fs builds whatever those name, so a
# manual preset (nvme_auto_namespace: false) calling its arrays `vol0`+`journal`
# must converge on them, not be told its own layout is FOREIGN — the only way
# past that failure is a reset, which drive-cleans the array it built. In the
# auto path detection runs before generate_raid_config.yml has produced
# `xiraid_arrays`, so an empty/undefined list falls back to the auto layout:
# `data`+`log` on /dev/xi_data, exactly what that task generates.
#
# Idempotent and side-effect-free: safe to run before any decision, at either role.
# raid_fs reuses this via include_role (guarded on xinas_storage_state undefined).

- name: Determine the expected layout
  ansible.builtin.set_fact:
    xfs_label_wanted: "{{ (xfs_filesystems | default([{}]) | first).label | default('nfsdata') }}"
    _ssd_data_device: >-
      {{ (xfs_filesystems | default([{}]) | first).data_device | default('/dev/xi_data') }}
    # The arrays that must be present and online. Empty/undefined `xiraid_arrays`
    # is the auto path (see header) and means the auto layout.
    _ssd_expected_arrays: >-
      {{ (xiraid_arrays | map(attribute='name') | list)
         if ((xiraid_arrays | default([]) | length) > 0) else ['data', 'log'] }}
    # Per-array state words that count as "online". Same allowlist the TUI
    # health engine's raid_status check applies (xinas_menu/health/engine.py).
    _ssd_online_states:
      - online
      - initialized

- name: Probe existing xiRAID arrays (read-only)
  ansible.builtin.command: xicli raid show -f json
  register: _ssd_raid_show
  changed_when: false
  failed_when: false

- name: Record whether the xiRAID probe answered
  ansible.builtin.set_fact:
    # rc 0 means the daemon replied, so an empty reply genuinely means "no
    # arrays". Any other rc means the array list could not be read at all.
    _ssd_raid_probe_ok: "{{ (_ssd_raid_show.rc | default(1)) == 0 }}"

- name: Parse xiRAID array output (native dict/list, empty dict on failure)
  ansible.builtin.set_fact:
    _ssd_parsed: >-
      {{ (_ssd_raid_show.stdout | from_json)
         if ((_ssd_raid_show.rc | default(1)) == 0 and (_ssd_raid_show.stdout | default('') | trim | length > 0))
         else {} }}

- name: Normalize xiRAID array names to a real list
  ansible.builtin.set_fact:
    _ssd_array_names: >-
      {{ (_ssd_parsed.keys() | list) if (_ssd_parsed is mapping)
         else ((_ssd_parsed | map(attribute='name') | list)
               if (_ssd_parsed is iterable and _ssd_parsed is not string) else []) }}
    # Per-array records, positionally aligned with _ssd_array_names. Both
    # shapes carry the state words at the record's top level: the mapping shape
    # (name -> record) is what xicli emits, the list-of-records shape is what
    # some releases / the fake transport emit.
    _ssd_array_records: >-
      {{ (_ssd_parsed.values() | list) if (_ssd_parsed is mapping)
         else ((_ssd_parsed | list)
               if (_ssd_parsed is iterable and _ssd_parsed is not string) else []) }}

- name: Map each array name to the state words xiRAID reported for it
  ansible.builtin.set_fact:
    _ssd_array_states: >-
      {{ dict(_ssd_array_names
              | zip(_ssd_array_records | map(attribute='state', default=[]) | list)) }}

- name: Collect the state words of the expected arrays
  ansible.builtin.set_fact:
    _ssd_arrays_present: >-
      {{ (_ssd_expected_arrays | reject('in', _ssd_array_names) | list | length) == 0 }}
    # One entry per expected array that exists, each the raw `state` value —
    # the list spelling (["online", "initialized"]), the bare-string spelling
    # ("online"), or [] when the record carried none. `default([], true)`
    # folds null / "" into [] so they fail the "reported a word" check below.
    _ssd_expected_states: >-
      {{ _ssd_array_states.items()
         | selectattr(0, 'in', _ssd_expected_arrays)
         | map(attribute=1) | map('default', [], true) | list }}

- name: Decide whether the expected arrays are online
  ansible.builtin.set_fact:
    # Fail closed: every expected array must exist, must have reported at least
    # one state word, and every word must be in the allowlist. flatten tolerates
    # the bare-string spelling next to the list spelling.
    _ssd_arrays_online: >-
      {{ (_ssd_arrays_present | bool)
         and ((_ssd_expected_states | select('eq', []) | list | length) == 0)
         and ((_ssd_expected_states | flatten | map('string') | map('lower')
               | reject('in', _ssd_online_states) | list | length) == 0) }}

- name: Export why an existing layout may not be a MATCH
  ansible.builtin.set_fact:
    # Both expected arrays are there, but at least one is not online: a
    # repairable condition, NOT a foreign layout to wipe. The FOREIGN failure
    # in nvme_namespace/raid_fs keys off this to give the right remedy —
    # "repair / let the rebuild finish", not "set xinas_storage_reset".
    xinas_storage_arrays_unhealthy: >-
      {{ (_ssd_arrays_present | bool) and (not (_ssd_arrays_online | bool)) }}
    xinas_storage_array_states: "{{ _ssd_array_states }}"

- name: Check whether the xiRAID data volume exists
  ansible.builtin.stat:
    path: "{{ _ssd_data_device }}"
  register: _ssd_volume

- name: Probe filesystem type on the data volume (read-only)
  ansible.builtin.command: blkid -s TYPE -o value {{ _ssd_data_device }}
  register: _ssd_fstype
  changed_when: false
  failed_when: false

- name: Probe filesystem label on the data volume (read-only)
  ansible.builtin.command: blkid -s LABEL -o value {{ _ssd_data_device }}
  register: _ssd_fslabel
  changed_when: false
  failed_when: false

- name: Record whether the filesystem probe answered
  ansible.builtin.set_fact:
    # No volume ⇒ conclusively no filesystem, whatever blkid made of the missing
    # path. Otherwise only blkid's "found" (0) and "nothing found" (2) are
    # answers; any other rc (usage error, I/O error, blkid missing) leaves the
    # volume's content unknown.
    _ssd_fs_probe_ok: >-
      {{ (not (_ssd_volume.stat.exists | default(false)))
         or ((_ssd_fstype.rc | default(1)) in [0, 2]) }}

- name: Record whether the xiRAID CLI is missing entirely
  ansible.builtin.set_fact:
    # rc=2 has two meanings and two different remedies: xicli exited 2, or
    # xicli does not exist. Ansible's command module reports the latter as
    # rc=2 with empty stdout/stderr and "[Errno 2] No such file or directory:
    # b'xicli'" in msg - indistinguishable on rc alone. raid-spec.md §11.
    xinas_storage_probe_missing_xicli: >-
      {{ (not (_ssd_raid_probe_ok | bool))
         and ('No such file or directory' in (_ssd_raid_show.msg | default('') | string)) }}

- name: Compose the reason a probe could not answer
  ansible.builtin.set_fact:
    # Written once here and quoted verbatim by the UNKNOWN failures in both
    # roles, so the diagnosis and its remedy never drift apart. Empty when both
    # probes answered. Every string literal stays on one line on purpose: a
    # literal broken across lines keeps the newline and the YAML indentation
    # inside the rendered message, because the fold happens outside the Jinja
    # string, not inside it.
    xinas_storage_probe_hint: >-
      {{
        ("xiRAID is not installed on this host: 'xicli' is not on PATH"
         ~ (", and this run was told not to install it (xiraid_skip_install=true) - clear that flag in playbooks/group_vars/all/20-local.yml so xiraid_classic installs xiRAID, then re-run."
            if (xiraid_skip_install | default(false) | bool)
            else " - install xiRAID and re-run.")
         ~ " Setting xinas_storage_reset does NOT help here: drive-clean and array creation both go through the same missing binary.")
        if (xinas_storage_probe_missing_xicli | bool)
        else (("'xicli raid show' failed (rc=" ~ (_ssd_raid_show.rc | default('?')) ~ "): "
               ~ ((_ssd_raid_show.stderr | default('') | trim)
                  or (_ssd_raid_show.msg | default('') | trim) or 'no output')
               ~ ". Is xiraid-core running? (systemctl status xiraid.target, modprobe xiraid). Bring it up and re-run, or set xinas_storage_reset=true to wipe and rebuild regardless.")
              if (not (_ssd_raid_probe_ok | bool))
              else (("blkid could not read " ~ _ssd_data_device ~ " (rc=" ~ (_ssd_fstype.rc | default('?')) ~ "). "
                     ~ "Fix the volume and re-run, or set xinas_storage_reset=true to wipe and rebuild regardless.")
                    if (not (_ssd_fs_probe_ok | bool)) else ''))
      }}

- name: Classify storage state
  ansible.builtin.set_fact:
    xinas_storage_state: >-
      {{
        'UNKNOWN'
        if (not (_ssd_raid_probe_ok | bool) or not (_ssd_fs_probe_ok | bool))
        else ('MATCH'
              if ((_ssd_arrays_online | bool)
                  and ((_ssd_fstype.stdout | default('') | trim) == 'xfs')
                  and ((_ssd_fslabel.stdout | default('') | trim) == xfs_label_wanted))
              else ('EMPTY'
                    if ((_ssd_array_names | length) == 0
                        and ((_ssd_fstype.stdout | default('') | trim) | length) == 0)
                    else 'FOREIGN'))
      }}

- name: Report storage state
  ansible.builtin.debug:
    msg: >-
      Storage state = {{ xinas_storage_state }}
      (expected={{ _ssd_expected_arrays }}, arrays={{ _ssd_array_states }},
      online={{ _ssd_arrays_online }}, volume={{ _ssd_data_device }},
      raid_probe_ok={{ _ssd_raid_probe_ok }}, fs_probe_ok={{ _ssd_fs_probe_ok }},
      fstype='{{ _ssd_fstype.stdout | default('') | trim }}',
      label='{{ _ssd_fslabel.stdout | default('') | trim }}', wanted='{{ xfs_label_wanted }}')

- name: Explain an undeterminable storage state
  ansible.builtin.debug:
    msg: >-
      Storage state could not be determined: {{ xinas_storage_probe_hint }}
      Refusing to treat this as a fresh box. Nothing has been modified.
  when: xinas_storage_state == 'UNKNOWN'
