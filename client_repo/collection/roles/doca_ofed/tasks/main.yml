- name: Detect Mellanox/NVIDIA NIC (PCI vendor 15b3)
  ansible.builtin.shell: |
    set -o pipefail
    if command -v lspci >/dev/null 2>&1; then
      lspci -d 15b3: -nn | grep -q . && exit 0
    fi
    for v in /sys/bus/pci/devices/*/vendor; do
      [ -r "$v" ] && grep -qi '0x15b3' "$v" && exit 0
    done
    exit 1
  args:
    executable: /bin/bash
  register: mlx_nic_check
  changed_when: false
  failed_when: false
  check_mode: no
  # deps/install too: every later task is gated on mlx_nic_check, so a run
  # limited to those tags must still define it (client-setup-spec.md §5.2).
  tags: [ofed, detect, deps, install]

- name: Report no Mellanox NIC — skipping DOCA OFED
  ansible.builtin.debug:
    msg: "No Mellanox/NVIDIA NIC detected (PCI vendor 15b3) — DOCA OFED install skipped."
  when: mlx_nic_check.rc != 0
  tags: [ofed, detect]

- name: Ensure build dependencies are present
  ansible.builtin.apt:
    name:
      - dkms
      - build-essential
      - linux-headers-{{ ansible_kernel }}
      - libelf-dev
    state: present
  when: mlx_nic_check.rc == 0
  tags: [ofed, deps]

# DOCA-Host's DKMS mlx5_ib needs the in-tree macsec module, which Ubuntu ships
# in linux-modules-extra-<kernel> — not pulled in by the virtual kernel
# metapackage (cloud images). Same contract as the server role
# (docs/Installer/spec.md §3.2), gated on the NIC like every task here
# (docs/Client/client-setup-spec.md §5.2).
- name: List the kernels that need the macsec module (running + installed)
  ansible.builtin.shell: |
    set -o pipefail
    {
      echo "{{ ansible_kernel }}"
      # dpkg-query exits 1 when nothing matches (a custom kernel); that host
      # still gets its running kernel checked, so the status is not fatal.
      { dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 'linux-image-*' 2>/dev/null || true; } \
        | awk '$1 ~ /^[ih]i/ && $2 !~ /-dbgsym$/ {print $2}' \
        | sed -nE 's/^linux-image-(unsigned-)?([0-9]+\.[0-9]+\.[0-9]+-[0-9]+.*)$/\2/p'
    } | sort -u
  args:
    executable: /bin/bash
  register: doca_ofed_kernels
  changed_when: false
  when: mlx_nic_check.rc == 0
  tags: [ofed, deps, install]

- name: Check the macsec module for each kernel
  ansible.builtin.command: "modinfo -k {{ item }} -n macsec"
  loop: "{{ doca_ofed_kernels.stdout_lines | default([]) }}"
  register: doca_ofed_macsec_before
  changed_when: false
  failed_when: false
  when: mlx_nic_check.rc == 0
  tags: [ofed, deps, install]

- name: Look up linux-modules-extra for kernels without macsec
  ansible.builtin.shell: >-
    set -o pipefail;
    apt-cache policy linux-modules-extra-{{ item.item }}
    | awk '/Candidate:/ {print $2}'
  args:
    executable: /bin/bash
  loop: "{{ doca_ofed_macsec_before.results | default([]) | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: doca_ofed_extra_candidates
  changed_when: false
  when: mlx_nic_check.rc == 0
  tags: [ofed, deps, install]

- name: Install linux-modules-extra for kernels without macsec
  ansible.builtin.apt:
    name: "linux-modules-extra-{{ item.item.item }}"
    state: present
  loop: "{{ doca_ofed_extra_candidates.results | default([]) | rejectattr('stdout', 'in', ['', '(none)']) | list }}"
  loop_control:
    label: "{{ item.item.item }}"
  when: mlx_nic_check.rc == 0
  tags: [ofed, deps, install]

- name: Re-check the macsec module for each kernel
  ansible.builtin.command: "modinfo -k {{ item }} -n macsec"
  loop: "{{ doca_ofed_kernels.stdout_lines | default([]) }}"
  register: doca_ofed_macsec_after
  changed_when: false
  failed_when: false
  when: mlx_nic_check.rc == 0
  tags: [ofed, deps, install]

- name: Stop before DOCA when a kernel has no macsec module
  ansible.builtin.fail:
    msg: >-
      Kernel(s) {{ doca_ofed_macsec_after.results | selectattr('rc', 'ne', 0)
      | map(attribute='item') | join(', ') }} still have no macsec module,
      which DOCA-Host's mlx5_ib needs: either apt has no
      linux-modules-extra-<kernel> candidate for them, or that package did not
      provide the module. Install the kernel's extra modules (or a kernel that
      provides macsec), then re-run. This check runs before the DOCA packages
      are installed or upgraded. See docs/Client/client-setup-spec.md §5.2.
  when:
    - mlx_nic_check.rc == 0
    - doca_ofed_macsec_after.results | selectattr('rc', 'ne', 0) | list | length > 0
  tags: [ofed, deps, install]

# NVIDIA rotated the DOCA-Host signing key (2026-01 -> 70454E6B…DC726C5E41B9CC50),
# published per component as doca_keyring.gpg (already a binary keyring). The
# legacy base-path GPG-KEY-Mellanox.pub no longer carries it, so the old
# `apt_key url=.../GPG-KEY-Mellanox.pub` produced `NO_PUBKEY DC726C5E41B9CC50` and
# `apt update` failed the entire install. Drop the keyring straight into
# trusted.gpg.d (force: true so a future rotation self-heals) — the path verified
# end-to-end on DOCA hardware. Also clears the deprecated apt_key module.
# (Mirrors the server-side doca_ofed role.)
- name: Install NVIDIA DOCA repository signing key
  ansible.builtin.get_url:
    url: "{{ doca_repo_base }}/{{ doca_repo_component }}/doca_keyring.gpg"
    dest: /etc/apt/trusted.gpg.d/mellanox-doca.gpg
    mode: '0644'
    force: true
  when: mlx_nic_check.rc == 0
  tags: [ofed, repo]

# Pinned to one release directory and written whole, so a stale `latest` line
# from an earlier install is retired rather than kept beside the pinned one
# (apt refused the alias when NVIDIA re-pointed it on 2026-08-20). Mirrors the
# server-side doca_ofed role; contract: docs/Installer/spec.md §3.2 and §8.5.
- name: Write the DOCA-OFED APT source (pinned release, file owned whole)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mellanox-doca.list
    content: |
      # Managed by xiNAS (doca_ofed role): one pinned DOCA-Host release. Do not edit.
      deb {{ doca_repo_base }}/{{ doca_repo_component }} /
    owner: root
    group: root
    mode: '0644'
  register: repo_added
  when: mlx_nic_check.rc == 0
  tags: [ofed, repo]

- name: Update APT cache (if repo added)
  ansible.builtin.apt:
    update_cache: yes
  when:
    - mlx_nic_check.rc == 0
    - repo_added is changed
  tags: [ofed, repo]

- name: Install DOCA-OFED packages
  ansible.builtin.apt:
    name: "{{ doca_pkgs }}"
    state: present
    update_cache: yes
  register: ofed_pkgs
  notify: restart openibd
  when: mlx_nic_check.rc == 0
  tags: [ofed, install]

- name: Reboot if kernel modules built and reboot requested
  ansible.builtin.reboot:
    msg: "Reboot after DOCA-OFED install (role doca_ofed)"
    reboot_timeout: 1200
  when:
    - mlx_nic_check.rc == 0
    - ofed_pkgs is changed
    - doca_ofed_auto_reboot | bool
  tags: [ofed, reboot]
