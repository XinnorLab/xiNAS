doca_distro_series: "ubuntu24.04"
# One release directory of the DOCA repo, never NVIDIA's moving `latest` alias:
# when that alias re-pointed (2026-08-20, 3.4.0 -> 3.5.0) apt refused to follow
# it and every installed host's `apt-get update` failed with exit 100. Keep in
# step with the server-side role (collection/roles/doca_ofed) and bump both at
# once. Contract: docs/Installer/spec.md §3.2.
doca_version: "3.4.0"
doca_repo_base: "https://linux.mellanox.com/public/repo/doca"
doca_repo_component: "{{ doca_version }}/{{ doca_distro_series }}/x86_64"

doca_pkgs:
  - doca-all           # DOCA-Host "Everything" profile (drivers, userspace, tools)
  - mlnx-fw-updater    # NIC firmware updater

doca_ofed_auto_reboot: false
