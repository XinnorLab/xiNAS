  # MCP transport gate (ADR-0010): tool calls arriving via the MCP
  # transport replay through these same routes with client_type=mcp.
  # Reads and mode=plan always pass; mode=apply requires
  # mcp.allow_apply=true in the api config (default false — the WS12
  # exit criterion). Exemptions with rationale: POST /support-bundle
  # (read-style diagnostic) and POST /tasks/{id}/cancel (emergency
  # stop cannot apply new state). REST callers are never gated here.
  # S15 (ADR-0010 amendment): once the gate allows mode=apply, the MCP
  # dispatcher additionally requires a human confirmation (an MCP
  # 2026-07-28 Multi Round-Trip Request) bound to the plan, and the task
  # engine verifies + consumes it inside the apply transaction for
  # client_type=mcp only. The same two exemptions apply. Operators act on
  # the records through /mcp/confirmations below; see
  # docs/control-path/s15-mcp-mrtr-confirmation-spec.md.
  /health:
    get:
      tags: [health]
      operationId: runHealthCheck
      summary: Run a health profile and return the report.
      description: |
        Profiles nest (standard ⊇ quick, deep ⊇ standard; ADR-0009).
        quick is KV-derived and always answers; standard/deep add
        agent-probe-backed checks which degrade with EXECUTOR_UNAVAILABLE
        evidence when the agent is unreachable.

        `deep` performs active probes — a probe-file write and read-back
        on every mounted managed filesystem and a PID1 loopback mount of
        the first desired export — and therefore requires the `operator`
        role (`PERMISSION_DENIED` otherwise); `quick` and `standard` are
        viewer reads. Over MCP, `profile=deep` additionally requires
        `mcp.allow_apply: true`. For a single confirmed active probe
        prefer `POST /health/probe` (S19). Since S19 the report carries
        `coverage_status` and `collection` (how each probe section was
        collected), and every check's `evidence.collection`. With a
        `run_id` from `GET /health/context` the report's digest is recorded
        in that run's ledger and `run_id` is echoed in the result; an
        unknown or expired run is accepted with a `RUN_UNKNOWN` warning
        (S19 §6.3).
      parameters:
        - in: query
          name: profile
          schema: { type: string, enum: [quick, standard, deep], default: quick }
        - in: query
          name: run_id
          schema: { type: string }
          description: An S19 run id from `GET /health/context` (optional).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/HealthReport' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '500': { $ref: '#/components/responses/Internal' }

  /health/context:
    get:
      tags: [health]
      operationId: getHealthContext
      summary: Start or re-read an agentic health-check run (S19 §6).
      description: |
        The validated run context the `xinas_health_check` MCP prompt
        starts from. Reads the state store, the heartbeat tracker's last
        snapshot and the static catalog only — never the agent — so it
        answers when the agent is down and says so in
        `collectors.heartbeat`. Mints a `run_id` into the api's in-memory
        run ledger (TTL `mcp.health_prompt.limits.run_ttl_seconds`) or
        re-reads a run this principal started; an unknown, expired or
        foreign `run_id` yields a new run plus a `RUN_UNKNOWN` warning.
        `permitted` restates what the catalog rank, the client type and
        `mcp.allow_apply` already enforce; nothing here is a grant.
        `declared_absent` lists only components the inventory proves
        absent. Viewer rank. `UNSUPPORTED` when
        `mcp.health_prompt.enabled` is false.
      parameters:
        - in: query
          name: run_id
          schema: { type: string }
          description: Re-read this run instead of minting a new one.
        - in: query
          name: targets
          schema: { type: string }
          description: |
            Comma-separated resource ids (at most 32, each
            `^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$`) to resolve against every
            observed and desired kind.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/HealthContext' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '422': { $ref: '#/components/responses/Unsupported' }
        '500': { $ref: '#/components/responses/Internal' }

  /health/catalog:
    get:
      tags: [health]
      operationId: getHealthCatalog
      summary: The versioned agentic check catalog (S19 §10).
      description: |
        Static data served verbatim: one row per check the prompt asks the
        model to cover (HC-01..HC-12), its producers, outcome and severity
        maps, side effects, cost, and `no_source: true` on rows that have
        no producer today so a client renders "Not checked" from the
        catalog. Viewer rank.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/AgenticCheckCatalog' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '500': { $ref: '#/components/responses/Internal' }

  /health/baseline:
    get:
      tags: [health]
      operationId: runHealthBaseline
      summary: Run the Python baseline engine for one profile (S19 §8).
      description: |
        The agent runs `python3 -m xinas_menu.health <profile> <log_dir>
        --json --no-save` as a capped, sandboxed, read-only subprocess
        (the profile must resolve inside the profiles directory) and the
        engine's JSON report is returned verbatim. The timeout is
        `min(profile.timeout_seconds, mcp.health_prompt.baseline.timeout_s[profile])`
        (60/180/300 s for quick/standard/deep; a custom profile gets the
        standard cap). With `max_age_s > 0` the last successful result of
        that profile is served if it is younger (`from_cache: true`, the
        original `collected_at`). Never fails because the agent is down:
        `collection.status` and `error.code` (`EXECUTOR_UNAVAILABLE`,
        `TIMEOUT`, `EXIT_<n>`, `PARSE`, `MODULE_ABSENT`, `ENOENT`, …) say
        what happened and `report` is null. A `run_id` records the result
        digest in the run ledger (`RUN_UNKNOWN` warning otherwise).
        Viewer rank. `UNSUPPORTED` when `mcp.health_prompt.enabled` is
        false. Coverage differs from `GET /health`; neither substitutes
        for the other.
      parameters:
        - in: query
          name: profile
          schema: { type: string, default: standard }
          description: A profile name from the startup catalog (`INVALID_ARGUMENT` names the known ones otherwise).
        - in: query
          name: max_age_s
          schema: { type: integer, minimum: 0, maximum: 3600, default: 0 }
        - in: query
          name: run_id
          schema: { type: string }
      responses:
        '200':
          description: The engine ran, was served from cache, or could not run (see `collection.status`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/HealthBaselineResult' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '422': { $ref: '#/components/responses/Unsupported' }
        '500': { $ref: '#/components/responses/Internal' }

  /health/report-schema:
    get:
      tags: [health]
      operationId: getHealthReportSchema
      summary: The agentic report contract (S19 §11.1).
      description: |
        The JSON Schema (2020-12, `report_schema_version` "1") an agentic
        health report must conform to, served verbatim. `POST
        /health/report/validate` checks a report against it. Viewer rank.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: object
                        description: A JSON Schema document (draft 2020-12).
                        additionalProperties: true
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '500': { $ref: '#/components/responses/Internal' }

  /health/report/validate:
    post:
      tags: [health]
      operationId: validateHealthReport
      summary: Validate an agentic health report (S19 §11.2–§11.4).
      description: |
        A pure computation over the report in the body, nothing stored
        (DATA-06): schema errors against `GET /health/report-schema`;
        reference errors (every `evidence_refs` entry must be an
        `evidence_manifest` id, every check id a catalog row);
        the deterministic verdict — `health_status` and `coverage_status`
        computed from the catalog's rows that are mandatory for the
        declared scope (a `not_applicable` row must cite a declared-absent
        component or a scope exclusion in its reason, else it counts as
        `unknown`), which the report's own values must match; and raw-report
        integrity against the run ledger: every `raw_reports` entry from a
        ledger-writing tool (`health.check`, `health.baseline`,
        `health.probe.run`) must re-hash to its `digest` and match a ledger
        row for the same tool and arguments (`verified`), else `mismatch`;
        an unknown or expired `run.run_id` is `unverifiable` (plus a
        `RUN_UNKNOWN` warning) and does not invalidate the report.
        `valid` is true iff there are no schema, reference or status errors
        and integrity is not `mismatch`. Viewer rank; over MCP it is a
        `direct` tool that needs no `mcp.allow_apply` and no confirmation.
        The body is subject to the api-wide 1 MB JSON limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The report (see `GET /health/report-schema`).
              additionalProperties: true
      responses:
        '200':
          description: 'The verdict (a report that fails validation is still a 200 with `valid: false`).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/AgenticReportValidation' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '500': { $ref: '#/components/responses/Internal' }

  /health/probe:
    post:
      tags: [health]
      operationId: runHealthProbe
      summary: Run ONE confirmed active health probe (S19 §9).
      description: |
        `fs_io` writes, fsyncs, reads back and unlinks a 4 KiB file under
        `<mountpoint>/.xinas-health` of the given Filesystem; `nfs_loopback`
        NFS-mounts the given Share from the node itself, lists it and
        unmounts. Every artifact is per run (unique name, exclusive create,
        per-run mountpoint); `cleanup` reports whether it was removed. The
        result proves only the operation performed — not client
        connectivity, not RDMA transport, not durability beyond fsync
        (`proves` says so verbatim).

        REST: `operator` role, no confirmation. MCP (`client_type=mcp`):
        additionally `mcp.allow_apply: true` and a pending form
        confirmation bound to this principal, tool and arguments, which
        the route consumes before the probe runs (`PRECONDITION_FAILED`
        with `reason: confirmation_required | confirmation_binding |
        confirmation_not_approved` otherwise). One probe at a time per
        node (`CONFLICT`, `reason: PROBE_IN_PROGRESS`). With a `run_id`
        from `GET /health/context` the probe counts against that run's
        `probes_per_run` budget — checked before any confirmation is
        consumed and before the agent is asked (`PRECONDITION_FAILED`,
        `reason: probe_budget_exhausted`) — and its result digest is
        recorded in the run ledger; an unknown or expired run is accepted
        with a `RUN_UNKNOWN` warning (S19 §6.3, §9.5).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthProbeRunRequest' }
      responses:
        '200':
          description: The probe ran (its own `ok` says whether it passed).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/HealthProbeRunResult' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # Tasks
  # =========================================================================
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks (most recent first).
      parameters:
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string }
        - $ref: '#/components/parameters/QueryLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Task' }
        '500': { $ref: '#/components/responses/Internal' }

  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get a single task with stage details.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /tasks/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Request task cancellation (honored at safe checkpoints).
      description: |
        Cooperative (ADR-0012): a queued task is cancelled immediately; a
        running task stops at its next safe stage boundary and rolls its
        partial work back. `409 CONFLICT` reasons: `not_cancellable`
        (terminal or plan-only), `dispatch_in_flight` (retry shortly),
        `agent_not_found` (the executor has no such task), and
        `irreversible_stage_started` (S16 — the executor passed its point
        of no return, e.g. `fs.create` after `mkfs` began; `details.stage`
        names it and the task completes on its own).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /tasks/{id}/watch:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tasks]
      operationId: watchTask
      summary: Stream task progress as Server-Sent Events.
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /tasks/{id}/wait:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tasks]
      operationId: waitTask
      summary: Block until the task changes, or the timeout expires.
      description: |
        Bounded long-poll for clients with no server-push channel — above all
        MCP, whose transport runs in JSON response mode. Returns as soon as the
        task's `last_event_sequence` passes `since_revision`, or the task is
        terminal, or `timeout_s` elapses.

        Concurrency is capped (4 waiters per task, 32 per process). Over the
        cap the call returns immediately with the current task and a
        `WAIT_CAPACITY` warning rather than queueing or failing.
      parameters:
        - name: timeout_s
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 60, default: 25 }
        - name: since_revision
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: The task, with its progress rollup.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/TaskWaitResult' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =========================================================================
  # Internal (agent → api) — not part of the public client surface
  # =========================================================================
  /internal/v1/task_progress:
    post:
      tags: [tasks]
      operationId: pushTaskProgress
      summary: Agent→api task progress push (internal; mirrors /internal/v1/observed).
      description: |
        Internal route, **not** for client use. The xinas-agent pushes task
        progress facts here as a typed event; the api is the sole writer of
        the durable `task_stages` / `tasks` rows (per ADR-0002 and
        s2-task-envelope-spec §6). This route **replaces** the removed
        `task.stage_report` api→agent RPC.

        Auth mirrors `/internal/v1/observed`: gated by `requireInternalAgent`
        and accepts only the internal-agent bearer token (the agent principal).
        Unix-peer-cred promotion does not apply to internal routes.

        Idempotent: `sequence` is per-task monotonic; an event with
        `sequence ≤` the task's high-water mark is a 200 no-op.
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskProgressEvent' }
      responses:
        '200':
          description: Event applied (or accepted as an idempotent no-op).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # Events / audit
  # =========================================================================
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List events (most recent first).
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: severity
          schema: { type: string }
        - in: query
          name: feed
          description: "S17: restrict to one operational-event feed."
          schema:
            type: string
            enum: [raid, raid/progress, storage, nfs, nfs/sessions, system]
        - in: query
          name: after
          description: "S17: an opaque feed cursor (requires `feed`); rows after it, ascending."
          schema: { type: string }
        - in: query
          name: limit
          description: "S17: page size, 1-500 (default 100)."
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Event' }
        '500': { $ref: '#/components/responses/Internal' }

  /audit:
    get:
      tags: [audit]
      operationId: queryAudit
      summary: Query audit entries (read-only).
      description: |
        S9 (ADR-0011): tail filters (kind/principal/client_type/since/
        until/limit, newest-first, limit default 100 cap 1000) over the
        audit log, or ONE exact lookup (request_id|operation_id|task_id)
        resolved via the audit index with an outbox fallback for rows
        not yet drained.
      parameters:
        - in: query
          name: request_id
          schema: { type: string }
        - in: query
          name: operation_id
          schema: { type: string }
        - in: query
          name: task_id
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string }
        - in: query
          name: principal
          schema: { type: string }
        - in: query
          name: client_type
          schema: { type: string }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: OK (result is AuditEntry[], newest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # Config history / drift / rollback
  # =========================================================================
  /config-history/snapshots:
    get:
      tags: [config-history]
      operationId: listConfigSnapshots
      summary: List configuration snapshots.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/ConfigSnapshot' }
        '500': { $ref: '#/components/responses/Internal' }

  /config-history/snapshots/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [config-history]
      operationId: getConfigSnapshot
      summary: Get a single configuration snapshot.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/ConfigSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /config-history/diff:
    get:
      tags: [config-history]
      operationId: diffConfigSnapshots
      summary: Diff between two snapshots.
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string }
        - in: query
          name: to
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /config-history/rollback:
    post:
      tags: [config-history]
      operationId: planConfigRollback
      summary: Plan a rollback to a snapshot (plan/apply).
      requestBody:
        description: >-
          Plan or apply request. spec = { to: "baseline" | "<snapshot-id>",
          reason: string, adopt?: boolean }. ADR-0013, ADR-0015.
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutatingRequest'
                - type: object
                  properties:
                    spec:
                      type: object
                      properties:
                        to:
                          type: string
                          description: >-
                            Target snapshot id or the literal "baseline".
                        reason:
                          type: string
                          description: Audit reason for the rollback.
                        adopt:
                          type: boolean
                          default: false
                          description: >-
                            Adopt the restored config as the new desired state (durable). Targeted
                            restores only; replaces desired within the captured domains. ADR-0015.
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unsupported' }
        '500': { $ref: '#/components/responses/Internal' }

  /config-history/drift:
    get:
      tags: [config-history]
      operationId: getDriftReport
      summary: Get current drift report.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # Support bundle
  # =========================================================================
  /support-bundle:
    post:
      tags: [support]
      operationId: createSupportBundle
      summary: Generate a support bundle (returns a task).
      responses:
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '500': { $ref: '#/components/responses/Internal' }

  /support-bundle/{task_id}:
    parameters:
      - $ref: '#/components/parameters/PathTaskId'
    get:
      tags: [support]
      operationId: downloadSupportBundle
      summary: Download a finished support bundle.
      responses:
        '200':
          description: gzip stream.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # Users / Groups (observed state from E8 collector)
  # =========================================================================
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List all observed local and NSS-resolved users.
      description: >
        Returns all User objects observed by the E8 users collector.
        Filter by source to narrow to local (/etc/passwd) or NSS-resolved entries.
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [local, nss, all]
            default: all
        - $ref: '#/components/parameters/QueryLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{uid}:
    get:
      tags: [users]
      operationId: getUser
      summary: Get a single user by numeric uid.
      description: Returns the User object for the given numeric uid, or 404 if not found.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups:
    get:
      tags: [groups]
      operationId: listGroups
      summary: List all observed local and NSS-resolved groups.
      description: >
        Returns all Group objects observed by the E8 users collector.
        Filter by source to narrow to local (/etc/group) or NSS-resolved entries.
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [local, nss, all]
            default: all
        - $ref: '#/components/parameters/QueryLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Group' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /groups/{gid}:
    get:
      tags: [groups]
      operationId: getGroup
      summary: Get a single group by numeric gid.
      description: Returns the Group object for the given numeric gid, or 404 if not found.
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Group' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /nfs-idmap:
    get:
      tags: [nfs]
      operationId: getNfsIdmap
      summary: Get the observed NFS idmap daemon configuration (singleton).
      description: >
        Returns the singleton NfsIdmap object reflecting the current rpc.idmapd
        configuration and daemon state. Observed-state segment is `nfs_idmap`;
        public route is `/nfs-idmap` per ADR-0003.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/NfsIdmap' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [nfs]
      operationId: setNfsIdmap
      summary: Set the NFS idmapd domain (plan/apply).
      description: |
        Two-phase like every mutating operation. `mode=plan` carries the new
        domain — `{ mode: plan, domain }` (or nested as `spec: { domain }`),
        a DNS domain containing a `.` — and returns a `Plan`. NfsIdmap is
        observed-only (no desired row), so the plan's
        `state_revision_expected` is the observed `nfs_idmap/snapshot`
        revision (0 on a fresh install); echo it back as `expected_revision`
        on apply. `mode=apply` requires `plan_id`, `expected_revision`, and
        `idempotency_key`.
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # MCP apply confirmations (S15, ADR-0010 amendment)
  # =========================================================================
  # Operator-facing view of the approval records behind MCP mode=apply.
  # Admin only. The matching catalog entries carry mcp_exposed: false, so
  # none of these is ever an MCP tool — a model cannot approve its own
  # request. The approval page (GET /mcp/approvals/{id}, HTML, outside
  # /api/v1) is a thin client of these routes.
  /mcp/confirmations:
    get:
      tags: [mcp]
      operationId: listMcpConfirmations
      summary: List MCP apply confirmations (admin).
      description: |
        Newest first. `status` and `principal` filter; `limit` defaults to
        100 and is capped at 1000. Records carry no plan document here —
        fetch one by id for the plan and the human-facing summary.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, declined, cancelled, expired, consumed]
        - in: query
          name: principal
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: OK (result is McpConfirmation[], newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/McpConfirmation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }

  /mcp/confirmations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [mcp]
      operationId: getMcpConfirmation
      summary: Get one MCP apply confirmation with its stored plan (admin).
      description: |
        Returns the record plus `plan` (the public projection of the plan
        document persisted at plan time — exactly what the requester saw)
        and `summary` (the generated human-facing text). Emits the
        `mcp.confirmation.viewed` audit event.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/McpConfirmation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /mcp/confirmations/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [mcp]
      operationId: approveMcpConfirmation
      summary: Approve a pending URL-mode confirmation (admin, out of band).
      description: |
        Guarded transition `pending → approved`. The approver must satisfy
        `mcp.confirmation.approver_policy` (default `distinct_principal`:
        role admin and a principal different from the requester's). A UDS
        peer-trust decision is break-glass: refused unless
        `mcp.confirmation.allow_uds_approval: true` (default false) and
        then audited as `break_glass_used` — otherwise `CONFLICT` with
        `details.reason: approver_policy`. The plan must also have been
        created by the requesting MCP principal (S15 §5.3). A
        record that is not `pending` answers `CONFLICT` `not_pending`; a
        `mode: form` record answers `CONFLICT` `form_mode` (form acceptance
        comes from the MCP client, not from here). Destructive records
        require `acknowledge: "DATA MAY BE PERMANENTLY LOST"`;
        rollback-unsupported records that are not destructive require
        `"ROLLBACK IS NOT SUPPORTED"` (`INVALID_ARGUMENT` naming the
        expected phrase otherwise). Approval does not extend the record's
        TTL and creates no task: the MCP client's retry consumes the
        record inside the apply transaction.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpConfirmationDecision' }
      responses:
        '200':
          description: OK (the updated record)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/McpConfirmation' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /mcp/confirmations/{id}/decline:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [mcp]
      operationId: declineMcpConfirmation
      summary: Decline a pending or approved confirmation (admin).
      description: |
        Guarded transition `pending | approved → declined`. Same approver
        policy as approve. A record already terminal answers `CONFLICT`
        `not_pending`. The MCP client's next retry receives
        `CONFIRMATION_DECLINED`; nothing is mutated.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpConfirmationDecision' }
      responses:
        '200':
          description: OK (the updated record)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/McpConfirmation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }

  /metrics:
    get:
      tags: [system]
      operationId: getMetrics
      summary: Prometheus text exposition of api-internal counters (S15).
      description: |
        `text/plain; version=0.0.4`. Today the series are the
        `xinas_mcp_confirmation*` counters, gauge and histogram defined in
        `s15-mcp-mrtr-confirmation-spec.md` §12.2; no label ever carries a
        principal, an id, a token or a `requestState`. Not an envelope —
        this is the one non-JSON, non-stream read in the API.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
