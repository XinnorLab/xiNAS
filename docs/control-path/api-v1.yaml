openapi: 3.1.0
info:
  title: xiNAS Control API
  version: 1.0.0-phase0
  summary: Phase 0 single-node Control Path API.
  description: |
    Local versioned Control API for xiNAS Phase 0.

    Phase 0 is **single-node** and **does not provide HA**. HA-shaped fields
    in objects like `NfsProfile`, `Cluster`, and `ServiceIP` exist as
    preparatory scaffolding for Phase 1+; writes to non-default values return
    `UNSUPPORTED`.

    All mutating endpoints follow the **plan/apply** contract:

    1. Call with `mode=plan` to receive a deterministic plan, blast radius,
       blockers, warnings, and `plan_id`.
    2. Call again with `mode=apply`, the `plan_id`, the `expected_revision`,
       and an `idempotency_key`. The server creates a durable task and
       returns its `task_id`.

    The same business logic backs both the REST transport described here and
    the MCP transport (per ADR-0001). Authorization is identical across
    transports for reads and plans; MCP applies a post-RBAC gate that
    denies mutating tools unless `mcp.allow_apply: true` is configured.

    **MCP apply confirmation (S15, ADR-0010 amendment).** After the
    `mcp.allow_apply` gate, every MCP `mode=apply` additionally requires a
    human confirmation carried by an MCP `2026-07-28` Multi Round-Trip
    Request; destructive plans are approved out of band through the
    `/mcp/confirmations` routes. `ApplyRequest` is unchanged — no
    confirmation field exists in this contract, and none may be added to a
    public request body. The MCP dispatcher forwards the confirmation id on
    the loopback-only header `X-Xinas-Confirmation`, which — like
    `X-Xinas-Forwarded-Principal`, `X-Xinas-Forwarded-Role` and
    `X-Xinas-Client-Type` — is honored only when the request carries the
    api's ephemeral in-process loopback bearer and is ignored (and logged)
    from every external caller. REST, `xinasctl` and TUI applies are not
    affected. Contract: `docs/control-path/s15-mcp-mrtr-confirmation-spec.md`.

  license:
    name: Proprietary
    identifier: LicenseRef-Xinnor-Internal
  contact:
    name: xiNAS Engineering

servers:
  - url: http+unix:///run/xinas/api.sock/api/v1
    description: Loopback Unix socket (default; preferred for local clients).
  - url: https://localhost:8443/api/v1
    description: Localhost TCP. Used by MCP/automation when explicitly enabled.

tags:
  - name: system
    description: Cluster mode, capabilities, time, controller identity.
  - name: inventory
    description: Hardware inventory snapshot.
  - name: storage
    description: Disks, xiRAID arrays, filesystems.
  - name: nfs
    description: Shares, NFS profile, export groups, session visibility.
  - name: network
    description: Interfaces, RDMA, netplan rendering, service IPs.
  - name: tasks
    description: Durable task lifecycle, plan/apply binding.
  - name: events
    description: Time-ordered events.
  - name: audit
    description: Append-only audit query API (read-only).
  - name: config-history
    description: Snapshots, diffs, rollback planning.
  - name: support
    description: Support bundle generation.
  - name: health
    description: Health profiles and check results.
  - name: users
    description: Observed local and NSS-resolved user accounts.
  - name: groups
    description: Observed local and NSS-resolved groups.
  - name: mcp
    description: >-
      MCP apply confirmations (S15): the approval records behind MCP
      `mode=apply`, for operators. Admin only; never exposed as MCP tools.

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerToken: []
  - unixPeerCreds: []

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Local token. Mapped to a principal and role.
    unixPeerCreds:
      type: apiKey
      in: header
      name: X-Xinas-Peer-Cred
      description: |
        Resolved automatically from SO_PEERCRED when the connection is over a
        local Unix socket. Clients do not set this header; the server derives
        it from the socket peer.

  # -------------------------------------------------------------------------
  # Common
  # -------------------------------------------------------------------------
  schemas:
    Envelope:
      type: object
      description: |
        Common response wrapper. Every API response carries this envelope.
      required:
        - request_id
        - correlation_id
        - state_revision
        - result
      properties:
        request_id:
          type: string
          format: uuid
          description: Per-request UUID; echoed in audit and logs.
        correlation_id:
          type: string
          description: Client-provided or server-generated trace ID.
        operation_id:
          type: string
          description: Present when the call produced or referenced a task.
        state_revision:
          type: integer
          format: int64
          description: Highest object revision seen by this response.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          default: []
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          default: []
        links:
          type: object
          additionalProperties:
            type: string
            format: uri-reference
          description: Hypermedia links (e.g., `self`, `next`, `task`).
        result:
          description: Endpoint-specific result.

    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: AGENT_DEGRADED
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        remediation:
          type: string
          description: Human-readable remediation hint.

    ErrorCode:
      type: string
      enum:
        - INVALID_ARGUMENT
        - NOT_FOUND
        - PRECONDITION_FAILED
        - PERMISSION_DENIED
        - CONFLICT
        - TIMEOUT
        - UNSUPPORTED
        - INTERNAL
      description: Stable, machine-readable error code per reqs §1.

    Metadata:
      type: object
      required: [revision, created_at, modified_at, owner, source, validation_status]
      properties:
        revision:
          type: integer
          format: int64
          description: Monotonic, per-object.
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        owner:
          type: string
          description: Principal that last wrote this object.
        source:
          type: string
          description: Origin (e.g., `ansible:nfs_server`, `api:user:admin`).
        validation_status:
          type: string
          enum: [valid, drift, invalid, pending]

    # -----------------------------------------------------------------------
    # Mutating operation contract (plan/apply)
    # -----------------------------------------------------------------------
    PlanRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          const: plan
        spec:
          description: Object spec under change (kind-specific).
        idempotency_key:
          type: string
          description: Reserved for future use in plan mode.

    Plan:
      type: object
      required:
        - plan_id
        - state_revision_expected
        - affected_resources
        - risk_level
        - client_impact
        - blockers
        - warnings
        - diff
        - rollback_model
      properties:
        plan_id:
          type: string
          format: uuid
        state_revision_expected:
          type: integer
          format: int64
        observed_revision_expected:
          type: [integer, "null"]
          description: |
            Observed-state revision the plan was computed against. On apply,
            an observed snapshot stale beyond the plan's freshness rule yields
            `CONFLICT` with `details.reason: plan_stale` (per the S2 task
            engine). Null when the plan does not depend on observed state.
        observed_at:
          type: [string, "null"]
          format: date-time
          description: |
            Timestamp of the observed snapshot the plan was computed against.
            Companion to `observed_revision_expected` for plan-freshness checks.
        plan_hash:
          type: string
          description: sha256 of canonical plan body.
        affected_resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
        risk_level:
          type: string
          enum: [non_disruptive, changing_access, destructive, unsupported_rollback]
        client_impact:
          type: string
          description: Plain-language description of impact on NFS clients.
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        diff:
          type: object
          additionalProperties: true
          description: Kind-specific diff (managed-file before/after, object diff).
        rollback_model:
          type: string
          enum: [non_disruptive, changing_access, destructive, unsupported]
          description: |
            The risk class of undoing this operation. This enum is the
            only vocabulary: S15 normalized the providers that emitted
            `reversible` / `executor_managed` and the plan engine refuses
            any value outside it (S15 spec §3.2).

    Blocker:
      type: object
      required: [code, message, evidence]
      properties:
        code:
          type: string
          example: ACTIVE_NFS_SESSIONS
        message:
          type: string
        evidence:
          type: object
          additionalProperties: true
        related_resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'

    ApplyRequest:
      type: object
      required: [mode, plan_id, expected_revision, idempotency_key]
      properties:
        mode:
          type: string
          const: apply
        plan_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          format: int64
        idempotency_key:
          type: string
        dangerous:
          type: boolean
          default: false
          description: Required `true` for destructive operations.

    MutatingRequest:
      description: |
        Every mutating operation accepts this body shape. Use `mode=plan` to
        receive a `Plan` (and `plan_id`); follow up with `mode=apply` carrying
        the `plan_id`, `expected_revision`, and `idempotency_key`.
      oneOf:
        - $ref: '#/components/schemas/PlanRequest'
        - $ref: '#/components/schemas/ApplyRequest'
      discriminator:
        propertyName: mode
        mapping:
          plan: '#/components/schemas/PlanRequest'
          apply: '#/components/schemas/ApplyRequest'

    PlanResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/Plan'

    TaskAcceptedResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/Task'

    ResourceRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum:
            - Cluster
            - Node
            - Controller
            - Disk
            - XiraidArray
            - Filesystem
            - Share
            - NfsProfile
            - NetworkInterface
            - ServiceIP
            - ExportGroup
            - Task
            - Event
            - Policy
            - HealthCheck
            - ConfigSnapshot
            - Pool
        id:
          type: string
        revision:
          type: integer
          format: int64

    # -----------------------------------------------------------------------
    # Object kinds — full schemas
    # -----------------------------------------------------------------------
    Cluster:
      type: object
      description: Singleton; Phase 0 always `mode=single_node`.
      required: [kind, id, metadata, spec, status]
      properties:
        kind:
          type: string
          const: Cluster
        id:
          type: string
          const: default
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          type: object
          required: [display_name]
          properties:
            display_name:
              type: string
            locality:
              type: string
              description: Operator-assigned site/rack tag.
        status:
          type: object
          required: [mode, capabilities, member_node_ids]
          properties:
            mode:
              type: string
              enum: [single_node]
              description: HA modes (active_passive, active_active) are Phase 1+.
            capabilities:
              type: object
              properties:
                ha:
                  type: string
                  enum: [not_enabled]
                quorum:
                  type: string
                  enum: [not_enabled]
                witness:
                  type: string
                  enum: [not_enabled]
                nfs.v3_locking_managed:
                  type: boolean
                  default: false
                nfs.recovery_state_managed:
                  type: boolean
                  default: false
                mcp.allow_apply:
                  type: boolean
            member_node_ids:
              type: array
              items:
                type: string
                format: uuid

    Node:
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind:
          type: string
          const: Node
        id:
          type: string
          format: uuid
          description: Persisted `controller_id` (per ADR-0001/0002).
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          type: object
          required: [hostname]
          properties:
            hostname:
              type: string
            roles:
              type: array
              items:
                type: string
                enum: [api, agent, nfs_helper, mcp, history]
        status:
          type: object
          required: [agent_state, observation_age_seconds]
          properties:
            agent_state:
              type: string
              enum: [healthy, degraded, offline]
            agent_last_heartbeat:
              type: string
              format: date-time
            observation_age_seconds:
              type: integer
            uptime_seconds:
              type: integer
            kernel:
              type: string
            ubuntu_release:
              type: string
            installed_versions:
              type: object
              additionalProperties:
                type: string
            agent:
              type: object
              required: [state, version]
              description: "Agent-health surface populated by the HeartbeatTracker."
              properties:
                state:
                  type: string
                  enum: [healthy, degraded, offline]
                last_heartbeat_at:
                  type: [string, "null"]
                  format: date-time
                last_observed_push_at:
                  type: [string, "null"]
                  format: date-time
                version:
                  type: string
                collectors:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Per-collector state: running | stubbed | error: <reason>"

    SystemdUnit:
      type: object
      required: [kind, id, metadata, status]
      description: "Observed systemd unit state collected by the E7 collector. Stored in the state-store only; no public REST path in this release."
      properties:
        kind:
          type: string
          const: SystemdUnit
        id:
          type: string
          description: "Unit name including suffix, e.g. nfs-server.service or srv-share01.mount."
        metadata:
          $ref: '#/components/schemas/Metadata'
        status:
          type: object
          required: [load_state, active_state, sub_state, observed_at]
          properties:
            load_state:
              type: string
              description: "loaded | not-found | error | masked"
            active_state:
              type: string
              description: "active | reloading | inactive | failed | activating | deactivating"
            sub_state:
              type: string
            unit_file_state:
              type: string
              description: "enabled | disabled | static | masked | ..."
            observed_at:
              type: string
              format: date-time

    Disk:
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind: { type: string, const: Disk }
        id: { type: string, description: "Stable ID: serial+namespace." }
        metadata: { $ref: '#/components/schemas/Metadata' }
        spec:
          type: object
          properties:
            user_label:
              type: string
        status:
          type: object
          required: [device_path, serial, model, capacity_bytes, safe_for_use, observed_at]
          properties:
            device_path: { type: string }
            serial: { type: string }
            model: { type: string }
            firmware: { type: string }
            capacity_bytes: { type: integer, format: int64 }
            namespace: { type: integer }
            numa_node: { type: integer }
            health:
              type: object
              properties:
                ok: { type: boolean }
                wear_pct: { type: integer }
                temperature_c: { type: integer }
            xiraid_membership:
              type: [object, "null"]
              properties:
                array_id: { type: string }
                role: { type: string, enum: [data, parity, spare] }
            system_disk:
              type: boolean
              description: "Any descendant partition mounted at /, /boot, or /boot/efi."
            mounted:
              type: boolean
              description: "Any non-null mountpoint on the disk or a descendant."
            safe_for_use: { type: boolean }
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

    XiraidArray:
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind: { type: string, const: XiraidArray }
        id: { type: string }
        metadata: { $ref: '#/components/schemas/Metadata' }
        spec:
          type: object
          required: [name, level, member_disk_ids]
          properties:
            name:
              type: string
              pattern: "^[A-Za-z0-9_]{1,28}$"
              description: >-
                xiRAID Classic 4.4 engine rule for `xicli raid create -n`: at most 28
                characters, Latin letters/digits/underscore only (no hyphens). The names
                `power` and `uevent` are additionally rejected by the plan validator
                (they collide with sysfs attributes under /sys/block/xi_<name>/), and a
                name that differs from an existing array's name only by trailing digits
                is warned about — partitions of /dev/xi_test surface as /dev/xi_test1.
                Tightened from ^[A-Za-z0-9_-]{1,63}$, which advertised names the engine
                always rejected; see docs/Storage/raid-management-spec.md §4 "Step — name".
            level:
              type: string
              enum: [raid0, raid1, raid5, raid6, raid7, raid10, raid50, raid60, raid70, "n+m"]
            strip_size_kib: { type: [integer, "null"] }
            block_size: { type: [integer, "null"], description: "512 or 4096 when known; null when not yet probed." }
            group_size:
              type: [integer, "null"]
              description: "Drives per group. Required for raid50/60/70; 4-32 (6-32 for raid70); member count must divide evenly."
            synd_cnt:
              type: [integer, "null"]
              description: "Syndrome count (the m of n+m). Required for level n+m; 4-32."
            force_metadata:
              type: boolean
              default: false
              description: "Create-only: overwrite stale xiRAID metadata on member disks."
            member_disk_ids:
              type: array
              items: { type: string }
            spare_disk_ids:
              type: array
              items: { type: string }
              description: >-
                OBSERVED ONLY. The spare pool's member drives joined to control-path
                Disk ids (raid_show sparepool -> pool_show drives). Rejected on POST
                and PATCH: create the pool via POST /api/v1/pools, then send
                spec.spare_pool with its name.
            spare_pool:
              type: [string, "null"]
              description: >-
                Name of an EXISTING spare pool (POST /api/v1/pools). Writable on
                create and modify; null on PATCH detaches the pool without
                deleting it. The control path never creates a pool from an array
                request — an inactive target pool is activated on attach and
                deactivated again if the operation rolls back. Mirrors
                status.spare_pool in observed rows.
            tuning:
              type: object
              description: "ADR-0006 approved Phase-0 create surface. null/absent = use the xiRAID default (omitted from the gRPC call)."
              properties:
                init_prio: { type: [integer, "null"] }
                recon_prio: { type: [integer, "null"] }
                restripe_prio: { type: [integer, "null"] }
                resync_enabled: { type: [boolean, "null"] }
                sched_enabled: { type: [boolean, "null"] }
                merge_read_enabled: { type: [boolean, "null"] }
                merge_write_enabled: { type: [boolean, "null"] }
                merge_read_max: { type: [integer, "null"] }
                merge_read_wait: { type: [integer, "null"] }
                merge_write_max: { type: [integer, "null"] }
                merge_write_wait: { type: [integer, "null"] }
                memory_limit: { type: [integer, "null"] }
                request_limit: { type: [integer, "null"] }
                memory_prealloc: { type: [integer, "null"] }
                adaptive_merge: { type: [boolean, "null"] }
                cpu_allowed: { type: [string, "null"] }
                max_sectors_kb: { type: [integer, "null"] }
                sdc_prio: { type: [integer, "null"] }
                single_run: { type: [boolean, "null"] }
                discard:
                  type: [boolean, "null"]
                  description: "Create surface `raid create --discard`. Observed from the daemon's `discard_allowed` — whether the array is CONFIGURED to accept discards, which is not the same as processing them (see status.discard_active)."
                drive_trim:
                  type: [boolean, "null"]
                  description: "Create surface `raid create --drive_trim`: TRIMs the member disks BEFORE the array is created. Never observed — it is an action, not array state, and raid_show reports no such field."
        status:
          type: object
          required: [state, volume_path, observed_at]
          properties:
            state:
              type: string
              enum: [optimal, degraded, rebuilding, failed, importing, unknown]
            volume_path: { type: string }
            spare_pool:
              type: [string, "null"]
              description: "S9 (ADR-0011): the raw sparepool NAME from raid_show — drives Pool.referenced_by. spare_disk_ids keeps its S4 join semantics."
            chunk_size_kib:
              type: [integer, "null"]
              description: "Observe-only/derived (full-stripe width reported by xiRAID)."
            rebuild_progress_pct: { type: [integer, "null"] }
            check_progress_pct: { type: [integer, "null"] }
            raw_states:
              type: array
              description: "S17: every state word raid_show reported for the array (lower-cased, de-duplicated, order-preserving), including words status.state maps to no bucket or to unknown. Vocabulary: xiRAID Classic 4.4 AG / Showing RAID State."
              items: { type: string }
            init_progress_pct:
              type: [number, "null"]
              description: "S17: raid_show init_progress, 0-100, never merged with reconstruction progress."
            recon_progress_pct:
              type: [number, "null"]
              description: "S17: raid_show recon_progress, 0-100, never merged with initialization progress."
            restripe_progress_pct:
              type: [number, "null"]
              description: "S17: raid_show restripe_progress, 0-100 (retained for Phase 2 consumers)."
            sdc_progress_pct:
              type: [number, "null"]
              description: "S17: raid_show sdc_progress, 0-100 (retained for Phase 2 consumers)."
            usable_capacity_bytes: { type: integer, format: int64 }
            memory_usage_mb:
              type: [integer, "null"]
              description: "Memory the array is currently using, as reported by raid_show. Absent when not observed — distinct from spec.tuning.memory_limit."
            discard_active:
              type: [boolean, "null"]
              description: "raid_show `discard_active`: the array is processing discard requests right now. Distinct from spec.tuning.discard (`discard_allowed`), which is only what it is configured to accept — an array can read allowed=true, active=false. Absent when not observed."
            member_states:
              type: array
              description: >-
                Per-member device state as reported by raid_show, one object
                per array member. Keys: `index` (member index the daemon
                reports, else position), `device` (member in the same
                control-path Disk identity as spec.member_disk_ids), `states`
                (lower-cased state words; [] when the daemon reported none).
              items:
                type: object
                additionalProperties: true
                properties:
                  index: { type: integer }
                  device: { type: string }
                  states:
                    type: array
                    items: { type: string }
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

    Filesystem:
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind: { type: string, const: Filesystem }
        id: { type: string }
        metadata: { $ref: '#/components/schemas/Metadata' }
        spec:
          type: object
          required: [fs_type, backing_device, mountpoint]
          properties:
            fs_type: { type: string, enum: [xfs] }
            backing_device:
              type: string
              description: "MUST be an observed XiraidArray volume_path (ADR-0007)."
            mountpoint: { type: string }
            label:
              type: [string, "null"]
              description: "mkfs.xfs -L; defaults to the escaped mountpoint leaf."
            log_device:
              type: [string, "null"]
              description: "External XFS log device (mkfs -l logdev= + mount Options logdev=). MUST be an observed XiraidArray volume_path when set."
            log_size:
              type: [string, "null"]
              description: "Log size cap (e.g. 1G); clamped at mkfs time to the log device's actual size (the day-1 _effective_log_size formula)."
            sector_size:
              type: [integer, "null"]
              description: "mkfs -s size=; default 4096."
            su_kb:
              type: [integer, "null"]
              description: "Stripe unit override; auto-derived from the backing array's observed geometry when omitted."
            sw:
              type: [integer, "null"]
              description: "Stripe width override; auto-derived (data drives = members - parity) when omitted."
            force:
              type: boolean
              default: false
              description: "Overwrite an existing filesystem on the device (destructive — the apply must carry dangerous: true)."
            mount_options:
              type: array
              items: { type: string }
            quota_mode:
              type: string
              enum: [none, uquota, gquota, pquota]
            owner_policy:
              type: object
              properties:
                uid: { type: integer }
                gid: { type: integer }
                mode: { type: string }
        status:
          type: object
          required: [mounted, uuid, size_bytes, free_bytes, observed_at]
          properties:
            # `mounted` is THE canonical observed mount flag (ADR-0007
            # §Observation normalization; the former duplicate
            # `currently_mounted` was removed from the contract in S5).
            mounted: { type: boolean }
            fs_type: { type: string }
            backing_device:
              type: string
              description: "From the .mount unit's What= (observed)."
            mountpoint:
              type: string
              description: "From the .mount unit's Where= (observed)."
            uuid: { type: string }
            size_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
            label: { type: string }
            effective_mount_options:
              type: array
              items: { type: string }
            mount_options:
              type: array
              items:
                type: string
            mount_unit_name:
              type: string
              description: "Name of the .mount unit, e.g. srv-share01.mount"
            mount_unit_enabled:
              type: boolean
              description: "From `systemctl is-enabled` (B4). Whether the .mount unit is enabled (WantedBy=local-fs.target)."
            mount_unit_state:
              type: string
              enum: [active, inactive, failed, activating, deactivating]
              description: "systemd ActiveState of the .mount unit, from the dbus cross-reference in the Filesystem collector (E4). Distinct from mount_unit_enabled (enablement)."
            owner_uid:
              type: integer
            owner_gid:
              type: integer
            owner_user_name:
              type: [string, "null"]
            owner_group_name:
              type: [string, "null"]
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

    Share:
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind: { type: string, const: Share }
        id: { type: string }
        metadata: { $ref: '#/components/schemas/Metadata' }
        spec:
          type: object
          required: [path, clients, fsid]
          properties:
            path: { type: string }
            export_group_id:
              type: string
              default: default
            clients:
              type: array
              items:
                $ref: '#/components/schemas/ShareClient'
            nfs_versions:
              type: array
              items:
                type: string
                enum: ["3", "4.0", "4.1", "4.2"]
            security_mode:
              type: string
              enum: [sys, krb5, krb5i, krb5p]
              default: sys
            rdma_enabled: { type: boolean, default: true }
            fsid: { type: integer, description: "Stable per-share FSID." }
            sync:
              type: string
              enum: [sync, async]
              default: async
            quota_policy:
              type: object
              properties:
                soft_bytes: { type: integer, format: int64 }
                hard_bytes: { type: integer, format: int64 }
        status:
          type: object
          required: [observed_at]
          properties:
            exported: { type: boolean }
            client_mount_profile:
              $ref: '#/components/schemas/ClientMountProfile'
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/NfsSession'
            effective_options:
              type: string
            exports:
              type: array
              items:
                $ref: '#/components/schemas/ExportRule'
              description: "Per-host export entries observed from /etc/exports.d/ or helper output."
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

    ShareClient:
      type: object
      required: [pattern, options]
      properties:
        pattern: { type: string, description: "Hostname, IP, CIDR, or netgroup." }
        options:
          type: array
          items: { type: string }

    ClientMountProfile:
      type: object
      properties:
        server: { type: string }
        export_path: { type: string }
        recommended_mount_options:
          type: array
          items: { type: string }
        rdma_supported: { type: boolean }
        sample_mount_cmd: { type: string }

    NfsSession:
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind:
          type: string
          const: NfsSession
        id:
          type: string
          description: "Composite: <client_addr>:<export_path>."
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          type: object
          required: [client_addr, export_path]
          properties:
            client_addr:
              type: string
            client_hostname:
              type: string
            export_path:
              type: string
        status:
          type: object
          required: [proto_version, locked_files, observed_at]
          properties:
            proto_version:
              type: string
              enum: [v3, v4, v4.1, v4.2]
            locked_files:
              type: integer
            observed_at:
              type: string
              format: date-time

    NfsIdmap:
      type: object
      required: [kind, metadata, status]
      properties:
        kind:
          type: string
          const: NfsIdmap
        metadata:
          $ref: '#/components/schemas/Metadata'
        status:
          type: object
          required: [conf_present, idmapd_active, method, observed_at]
          properties:
            conf_present:
              type: boolean
            domain:
              type: string
            local_realms:
              type: array
              items:
                type: string
            method:
              type: string
              enum: [nsswitch, static, umich_ldap, unknown]
            idmapd_active:
              type: boolean
            idmapd_unit_state:
              type: string
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

    ExportRule:
      type: object
      required: [host_pattern, options]
      properties:
        host_pattern:
          type: string
          description: "Matches /etc/exports host field (CIDR, hostname, wildcard, netgroup)."
        options:
          type: array
          items:
            type: string
        squash_mode:
          type: string
          enum: [root_squash, no_root_squash, all_squash]
        anon_uid:
          type: integer
        anon_gid:
          type: integer

    NfsProfile:
      description: Per ADR-0005. Singleton `default` in Phase 0.
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind: { type: string, const: NfsProfile }
        id: { type: string, const: default }
        metadata: { $ref: '#/components/schemas/Metadata' }
        spec:
          type: object
          required: [versions, rdma, threads, v3_locking, v4_recovery, service_policy]
          properties:
            versions:
              type: object
              properties:
                v3:   { type: object, properties: { enabled: { type: boolean } } }
                v4_0: { type: object, properties: { enabled: { type: boolean } } }
                v4_1: { type: object, properties: { enabled: { type: boolean } } }
                v4_2: { type: object, properties: { enabled: { type: boolean } } }
            rdma:
              type: object
              properties:
                enabled: { type: boolean }
                port: { type: integer, default: 20049 }
            threads:
              type: object
              properties:
                count: { type: integer, minimum: 8, maximum: 1024 }
            v3_locking:
              type: object
              properties:
                enabled: { type: boolean }
                fixed_rpc_ports:
                  type: object
                  description: |
                    Phase 0: read-only. Non-default writes return `UNSUPPORTED`.
                    HA scaffolding for Phase 1+.
                  properties:
                    nfsd: { type: integer }
                    mountd: { type: integer }
                    lockd_udp: { type: integer }
                    lockd_tcp: { type: integer }
                    statd: { type: integer }
                    statd_outgoing: { type: integer }
                  readOnly: true
            v4_recovery:
              type: object
              properties:
                backend:
                  type: string
                  enum: [nfsdcltrack]
                  readOnly: true
                recovery_root:
                  type: string
                  description: |
                    Phase 0: read-only. HA scaffolding for Phase 1+.
                  readOnly: true
                server_scope:
                  type: string
                  description: |
                    Phase 0: read-only; must remain empty.
                  readOnly: true
            service_policy:
              type: object
              properties:
                on_thread_count_change: { type: string, enum: [reload, restart, none] }
                on_version_change:      { type: string, enum: [reload, restart, none] }
                on_rdma_change:         { type: string, enum: [reload, restart, none] }
                on_v3_settings_change:  { type: string, enum: [reload, restart, none] }
        status:
          type: object
          required: [observed_at]
          properties:
            effective_files:
              type: object
              additionalProperties:
                type: string
                description: sha256 of the file.
            running:
              type: object
              properties:
                thread_count: { type: integer }
                rdma_listening: { type: boolean }
                rdma_port: { type: integer }
                active_versions:
                  type: array
                  items: { type: string }
            warnings:
              type: array
              items: { $ref: '#/components/schemas/Warning' }
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

    NetworkInterface:
      type: object
      description: |
        MERGED read model (ADR-0008): when a desired row exists (managed +
        adopted), `spec` is the desired spec verbatim and metadata.revision
        is the DESIRED row revision (the one mutations bind). Unmanaged or
        not-yet-adopted interfaces carry no `spec`. `spec.pbr_table_id` is
        allocated once at first manage and never renumbered.
      required: [kind, id, metadata, status]
      properties:
        kind: { type: string, const: NetworkInterface }
        id: { type: string, description: "Interface name (e.g., ibp0s4)." }
        metadata: { $ref: '#/components/schemas/Metadata' }
        spec:
          type: object
          properties:
            managed_by_xinas: { type: boolean }
            addresses:
              type: array
              items:
                type: string
                description: CIDR.
            mtu: { type: integer }
            pbr_table_id:
              type: integer
              description: "PBR table in [100,199]; allocated once, immutable (ADR-0008)."
            enabled: { type: boolean, default: true }
        status:
          type: object
          required: [observed_at]
          properties:
            driver: { type: string }
            rdma_capable: { type: boolean }
            link_state: { type: string, enum: [up, down, unknown] }
            rdma_link_state: { type: string, enum: [up, down, unknown] }
            current_addresses:
              type: array
              items: { type: string }
            owning_netplan_file: { type: string }
            duplicates_detected_in:
              type: array
              items: { type: string }
            netplan:
              type: object
              description: "Parsed 99-xinas.yaml stanza for this interface (the adoption source, ADR-0008)."
              properties:
                addresses: { type: array, items: { type: string } }
                mtu: { type: integer }
                pbr_table_id: { type: integer }
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

    ServiceIP:
      type: object
      description: |
        Phase 0 placeholder; Phase 1+ HA moves between nodes. Phase 0 may
        manage IP pool entries; failover semantics are not implemented.
      required: [kind, id, metadata, spec]
      properties:
        kind: { type: string, const: ServiceIP }
        id: { type: string }
        metadata: { $ref: '#/components/schemas/Metadata' }
        spec:
          type: object
          properties:
            address: { type: string }
            interface_id: { type: string }
            export_group_id: { type: string, default: default }
        status:
          type: object
          properties:
            assigned_node_id: { type: string, format: uuid }
            reachable: { type: boolean }

    ExportGroup:
      type: object
      description: |
        Phase 0: singleton `default`. Phase 1+ HA splits shares into groups
        that fail over together.
      required: [kind, id, metadata, spec]
      properties:
        kind: { type: string, const: ExportGroup }
        id: { type: string, const: default }
        metadata: { $ref: '#/components/schemas/Metadata' }
        spec:
          type: object
          properties:
            display_name: { type: string }
            nfs_profile_id: { type: string, default: default }
            service_ip_ids:
              type: array
              items: { type: string }

    Task:
      description: |
        Per ADR-0004. Required fields mirror the `NOT NULL` columns of
        the durable `tasks` table; this keeps the audit/idempotency
        guarantees from leaking at the API boundary.
      type: object
      required:
        - task_id
        - kind
        - state
        - principal
        - client_type
        - request_id
        - correlation_id
        - input_hash
        - risk_level
        - affected_resources
        - created_at
        - updated_at
      properties:
        task_id: { type: string, format: uuid }
        kind: { type: string, example: "share.create" }
        state:
          type: string
          enum: [queued, running, success, failed, cancelled, requires_manual_recovery, plan_only, imported]
        plan_id: { type: [string, "null"], format: uuid }
        idempotency_key: { type: [string, "null"] }
        agent_acceptance_id:
          type: [string, "null"]
          description: |
            Opaque token the agent returns from `task.begin` when it accepts
            and starts executing the task. Stored by the api and used by the
            S2 reconciler to distinguish "begin landed" from "begin never
            took" after a restart (per ADR-0004 / s2-task-envelope-spec §9).
            Null until the agent accepts.
        principal: { type: string }
        client_type:
          type: string
          enum: [rest, mcp, tui, cli, automation, system]
        request_id: { type: string, format: uuid }
        correlation_id: { type: string }
        input_hash: { type: string }
        plan_hash: { type: [string, "null"] }
        result_hash: { type: [string, "null"] }
        state_revision_expected: { type: [integer, "null"], format: int64 }
        state_revision_at_apply: { type: [integer, "null"], format: int64 }
        risk_level:
          type: string
          enum: [non_disruptive, changing_access, destructive, unsupported_rollback]
        affected_resources:
          type: array
          items: { $ref: '#/components/schemas/ResourceRef' }
        snapshot_before: { type: [string, "null"] }
        snapshot_after: { type: [string, "null"] }
        cancel_requested_at: { type: [string, "null"], format: date-time }
        cancel_refused_reason:
          type: [string, "null"]
          description: |
            Why an agent-side cancel was refused while the row stayed
            `running`: `agent_not_found` (the executor has no such task
            in flight) or `irreversible_stage_started` (S16 — the
            operation passed its point of no return, e.g. `fs.create`
            once `mkfs` began; the task finishes or fails on its own and
            is never `cancelled`).
        error_code:
          description: |
            Set on non-success terminal failure states (`failed`,
            `requires_manual_recovery`) — including a cancel whose
            rollback failed (S10, ADR-0012). `cancelled` itself carries
            NO error_code. Type is nullable via the `[string, "null"]`
            union; the enum lists the value set.
          type: [string, "null"]
          enum:
            - FAILED_BEFORE_CHANGE
            - FAILED_PARTIAL_ROLLED_BACK
            - FAILED_MANUAL_RECOVERY_REQUIRED
            - FAILED_STATE_DESYNC
        error_message: { type: [string, "null"] }
        remediation_hint: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        terminal_at: { type: [string, "null"], format: date-time }
        stage_total: { type: [integer, "null"] }
        progress: { $ref: '#/components/schemas/TaskProgress' }
        stages:
          type: array
          items: { $ref: '#/components/schemas/TaskStage' }

    TaskProgress:
      description: |
        Rolled-up view of where a running task is: which stage, how far
        through the executor's stage list, and how long it has been going.
        Present on any task that executes (absent on `plan_only`).

        No completion percentage is reported — `mkfs.xfs` and friends do not
        emit one, so stage plus elapsed time is the honest granularity. No
        output line is reported either: the agent buffers stage output and
        publishes it only when the stage ends, so a running stage has none
        (read finished stages' output from `stages[]`).
      type: object
      required: [phase, completed_stages, elapsed_s]
      properties:
        phase:
          type: string
          enum: [preparing, executing, rolling_back, finalizing, done]
        stage_name: { type: string }
        stage_status:
          type: string
          enum: [pending, running, success, failed, skipped]
        stage_index:
          type: integer
          description: Raw emission index; correlates with an entry in `stages[]`.
        stage_position:
          type: integer
          description: |
            1-based position among EXECUTOR stages. Absent while a synthetic
            stage (snapshot_before/snapshot_after/rollback) is current.
        stage_total:
          type: integer
          description: |
            Executor stage count reported by the agent on `accepted`. Absent
            for tasks created before the field existed — clients must render
            the position without a denominator in that case.
        completed_stages: { type: integer }
        elapsed_s:
          type: integer
          description: Wall-clock since the task was created; frozen at `terminal_at`.
        stage_elapsed_s: { type: integer }

    TaskWaitResult:
      type: object
      required: [changed, waited_s, task]
      properties:
        changed:
          type: boolean
          description: False when the call returned because the timeout expired.
        waited_s: { type: integer }
        task: { $ref: '#/components/schemas/Task' }

    TaskStage:
      type: object
      required: [stage_index, name, status, output_size_bytes]
      properties:
        stage_index: { type: integer }
        name: { type: string }
        status:
          type: string
          enum: [pending, running, success, failed, skipped]
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        output_inline:
          type: [string, "null"]
          description: Present when output size ≤ 64 KiB.
        output_url:
          type: [string, "null"]
          format: uri-reference
          description: Present when output spilled to disk.
        output_size_bytes: { type: integer }
        error_code: { type: [string, "null"] }
        error_message: { type: [string, "null"] }

    TaskProgressEvent:
      description: |
        A single agent→api progress fact pushed via
        `POST /internal/v1/task_progress` (per s2-task-envelope-spec §6). The
        agent reports facts only; the api is the sole writer of `task_stages`
        and `tasks` rows. `sequence` is per-task monotonic — an event with
        `sequence ≤` the task's high-water mark is a 200 no-op (idempotent
        replay). This schema **replaces** the removed `task.stage_report` RPC.
      type: object
      required: [task_id, sequence, event_type]
      properties:
        task_id:
          type: string
          format: uuid
        sequence:
          type: integer
          description: Per-task monotonic sequence number; drives idempotent replay.
        event_type:
          type: string
          enum:
            - accepted
            - stage_started
            - stage_succeeded
            - stage_failed
            - rollback_started
            - rollback_succeeded
            - rollback_failed
            - terminal
        stage_index:
          type: integer
        stage_name:
          type: string
        stage_total:
          type: integer
          description: |
            Executor stage count; sent on the `accepted` event only. The api
            persists it on the task as the denominator for `progress`.
        status:
          type: string
        output_inline:
          type: string
          description: Present when stage output ≤ 64 KiB; larger output spills to disk.
        output_size_bytes:
          type: integer
        error_code:
          type: string
        error_message:
          type: string
        snapshot_id:
          type: string
          description: xinas_history snapshot id captured by the executor (before/after).
        observed_at:
          type: string
          format: date-time

    Event:
      type: object
      required: [event_id, ts, kind, severity]
      properties:
        event_id: { type: string }
        ts: { type: string, format: date-time }
        kind: { type: string }
        severity:
          type: string
          enum: [info, warning, error, critical]
        message: { type: string }
        related_resources:
          type: array
          items: { $ref: '#/components/schemas/ResourceRef' }
        # S17 (docs/control-path/s17-mcp-subscriptions-spec.md §13): additive
        # projection of the operational-event journal. `kind` mirrors `type`,
        # `ts` mirrors `detected_at`, `message` mirrors the event summary.
        feed:
          type: string
          enum: [raid, raid/progress, storage, nfs, nfs/sessions, system]
        sequence: { type: integer, format: int64 }
        type: { type: string }
        subject:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string }
            id: { type: string }
        detected_at: { type: string, format: date-time }
        occurred_at: { type: string, format: date-time }
        time_accuracy:
          type: string
          enum: [source, observed, task]
        source:
          type: object
          properties:
            kind: { type: string }
            component: { type: string }
        cursor:
          type: string
          description: "Opaque feed cursor for this row; pass as `after` (with `feed`) to page forward."
        previous: { type: object, additionalProperties: true }
        current: { type: object, additionalProperties: true }
        operation:
          type: object
          properties:
            kind: { type: string }
            generation: { type: integer }
            progressPct: { type: number }
            bucket: { type: integer }
        threshold:
          type: object
          properties:
            metric: { type: string }
            value: { type: number }
            unit: { type: string }
            enter: { type: number }
            clear: { type: number }
        reason_code: { type: string }
        cause:
          type: object
          properties:
            taskId: { type: string }
            operationId: { type: string }
        details: { type: object, additionalProperties: true }

    HealthReport:
      type: object
      required: [profile, started_at, completed_at, checks, overall]
      properties:
        profile:
          type: string
          enum: [quick, standard, deep]
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        overall:
          type: string
          enum: [ok, warning, degraded, critical]
        coverage_status:
          type: string
          enum: [complete, partial]
          description: |
            S19 §7.3 — `partial` when the agent was unavailable on standard/deep
            or any probe section failed to collect (`error`, `timeout`,
            `permission_denied`); `complete` otherwise. Additive; does not
            change the meaning of `overall`.
        collection:
          type: object
          description: S19 §7.3 — how the probe-backed sections were collected.
          properties:
            agent:
              type: string
              enum: [answered, unavailable, not_needed]
              description: '`not_needed` on quick; `unavailable` when the health.probe RPC failed.'
            sources:
              type: object
              description: One entry per probe section the level expects (license, rdma_links, collectors, nfs_profile_render, probes).
              additionalProperties:
                type: string
                enum: [success, error, timeout, permission_denied, not_supported]
        checks:
          type: array
          items: { $ref: '#/components/schemas/HealthCheck' }
        run_id:
          type: string
          description: Echoed when the caller passed `run_id` (S19 §6.3); absent otherwise.

    HealthCheck:
      type: object
      required: [id, status, symptom, impact, evidence, recommended_action]
      properties:
        id: { type: string }
        category:
          type: string
          enum: [api, agent, state_store, xiraid, filesystem, nfs, network, drift, systemd, tuning]
        status:
          type: string
          enum: [ok, warning, degraded, critical, skipped]
        symptom: { type: string }
        impact: { type: string }
        evidence:
          type: object
          description: |
            Free-form per check. Since S19 every check carries
            `collection: { status, observed_at, code?, message?, source? }`
            (spec §7.2): `status` is the source's collection status, `source:
            kv` marks facts read from the state store, and only
            `not_supported` ever accompanies a `skipped` check.
          additionalProperties: true
        recommended_action: { type: string }
        related_resources:
          type: array
          items: { $ref: '#/components/schemas/ResourceRef' }

    HealthProbeRunRequest:
      type: object
      required: [probe, target]
      additionalProperties: false
      properties:
        probe:
          type: string
          enum: [fs_io, nfs_loopback]
        target:
          type: string
          description: Filesystem id for `fs_io`, Share id for `nfs_loopback`.
        run_id:
          type: string
          description: |
            Optional S19 run id from `GET /health/context`; carried into the
            artifact name and the audit row, counted against the run's
            `probes_per_run` budget, and the result digest is recorded in
            the run ledger.
        timeout_s:
          type: integer
          minimum: 1
          maximum: 60
          default: 20
          description: Bound for the whole probe, enforced on the agent step by step.

    HealthProbeRunResult:
      type: object
      required: [probe, target, path, run_id, ok, started_at, completed_at, artifact, cleanup, proves]
      properties:
        probe:
          type: string
          enum: [fs_io, nfs_loopback]
        target: { type: string }
        path:
          type: string
          description: The mountpoint (`fs_io`) or export path (`nfs_loopback`) the probe used.
        run_id: { type: string, nullable: true }
        ok: { type: boolean }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        artifact:
          type: object
          nullable: true
          description: The exact file or mountpoint this run created.
          properties:
            kind: { type: string, enum: [file, mountpoint] }
            path: { type: string }
        error:
          type: object
          description: Present when `ok` is false.
          properties:
            code: { type: string }
            message: { type: string }
            stage:
              type: string
              enum: [open, dir, create, write, fsync, read, unlink, lock, mount, readdir, umount]
        cleanup:
          type: object
          description: '`failed` is a finding, never swallowed (S19 PROBE-03).'
          properties:
            status: { type: string, enum: [clean, failed, not_needed] }
            detail: { type: string }
        proves:
          type: string
          description: What a passing probe proves, and what it does not (S19 PROBE-04); fixed text per probe kind.
        confirmation_id:
          type: string
          description: The S15 confirmation this MCP call consumed; absent on REST calls.

    HealthContext:
      description: S19 §6.2 — the validated run context of an agentic health check.
      type: object
      required: [run, node, topology, collectors, freshness, baselines, catalog, tools, targets]
      properties:
        run:
          type: object
          required: [run_id, issued_at, expires_at, principal, role, versions, limits, permitted]
          properties:
            run_id: { type: string, format: uuid }
            issued_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            principal: { type: string }
            role: { type: string }
            versions:
              type: object
              description: The versions the run started with; the ledger keeps them even if the api is later restarted with a new template (AC-17).
              properties:
                prompt: { type: string }
                template_sha256: { type: string }
                policy: { type: string }
                catalog: { type: string }
                report_schema: { type: string }
                server: { type: string }
            limits:
              type: object
              description: '`mcp.health_prompt.limits` minus `run_ttl_seconds`; only the two probe counters are enforced by xiNAS (S19 §9.5).'
              additionalProperties: { type: integer }
            permitted:
              type: object
              description: Restates the catalog rank, the client type and `mcp.allow_apply`; never a grant.
              properties:
                deterministic:
                  type: array
                  items: { type: string, enum: [quick, standard, deep] }
                baseline: { type: boolean }
                probe_run: { type: string, enum: [denied, confirmable, allowed] }
                apply: { type: boolean, enum: [false] }
        node:
          type: object
          properties:
            hostname: { type: string }
            controller_id: { type: string }
            xinas_version: { type: string }
            kernel: { type: string, nullable: true }
            xiraid_version: { type: string, nullable: true, description: 'null until a collector observes it.' }
        topology:
          type: object
          description: The KV cross-references that exist today; a missing link is `null`, never inferred.
          properties:
            arrays:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  state: { type: string, nullable: true }
                  revision: { type: integer }
                  observed_at: { type: string, format: date-time }
                  member_disk_ids: { type: array, items: { type: string } }
            filesystems:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  array_id: { type: string, nullable: true }
                  mountpoint: { type: string, nullable: true }
                  mounted: { type: boolean, nullable: true }
                  revision: { type: integer }
                  observed_at: { type: string, format: date-time }
            shares:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  path: { type: string, nullable: true }
                  filesystem_id: { type: string, nullable: true }
            interfaces:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  operstate: { type: string, nullable: true }
                  mtu: { type: integer, nullable: true }
                  revision: { type: integer }
                  observed_at: { type: string, format: date-time }
            declared_absent:
              type: array
              description: Components the inventory proves absent (`nfs`, `raid`); an empty answer after a failed query never lands here (AC-04).
              items: { type: string }
        collectors:
          type: object
          properties:
            heartbeat: { type: string, enum: [healthy, degraded, offline] }
            last_probe:
              type: object
              nullable: true
              description: The api's cached last standard/deep agent probe, if any.
              properties:
                collected_at: { type: string, format: date-time }
                level: { type: string, enum: [standard, deep] }
                collectors:
                  type: object
                  additionalProperties: { type: string }
        freshness:
          type: object
          description: Per observed kind, from the rows' `observed_at` (no universal TTL, DATA-05).
          additionalProperties:
            type: object
            properties:
              rows: { type: integer }
              newest_observed_at: { type: string, format: date-time }
              oldest_observed_at: { type: string, format: date-time }
        baselines:
          type: object
          description: The Python baseline profile catalog listed once at startup (S19 §8.2).
          properties:
            dir: { type: string }
            dir_present: { type: boolean }
            sections_source:
              type: string
              enum: [static, engine]
              description: S19c — `engine` once a `GET /health/baseline` call has obtained the engine's `--sections` list; `static` before that.
            engine_version: { type: string, nullable: true }
            profiles:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  path: { type: string, nullable: true }
                  sha256: { type: string, nullable: true }
                  timeout_seconds: { type: integer, nullable: true }
                  sections_enabled: { type: array, items: { type: string } }
                  sections_without_checker:
                    type: array
                    description: Enabled sections the engine has no checker for (`kerberos` today).
                    items: { type: string }
        catalog:
          type: object
          properties:
            version: { type: string }
            tool: { type: string }
        tools:
          type: array
          description: Catalog entries visible to this role, with any argument escalation.
          items:
            type: object
            properties:
              name: { type: string }
              min_role: { type: string, enum: [viewer, operator, admin] }
              escalation:
                type: object
                properties:
                  arg: { type: string }
                  value: { type: string }
                  min_role: { type: string, enum: [viewer, operator, admin] }
                  requires_mcp_apply: { type: boolean }
        targets:
          type: object
          properties:
            resolved:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  kind: { type: string }
                  source: { type: string, enum: [observed, desired] }
            unknown:
              type: array
              items: { type: string }

    AgenticCheckCatalog:
      description: S19 §10 — the versioned check catalog, served verbatim by `GET /health/catalog`.
      type: object
      required: [version, checks]
      properties:
        version: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/AgenticCheck' }

    AgenticCheck:
      type: object
      required: [id, version, area, goal, applicability, mandatory_for, expected_source, inputs, procedure, criterion, outcome_map, severity_map, side_effects, cost, next_check, no_source]
      properties:
        id: { type: string, description: '`HC-NN.slug`' }
        version: { type: integer }
        area: { type: string }
        goal: { type: string }
        applicability:
          type: object
          properties:
            requires:
              type: array
              description: Keys of `HealthContext.topology`; an absent component makes the row not applicable.
              items: { type: string, enum: [arrays, filesystems, shares, interfaces] }
        mandatory_for:
          type: array
          items: { type: string, enum: [node, service_path] }
        expected_source:
          type: array
          description: CFG-02 resolution order.
          items: { type: string, enum: [local_override, desired, vendor] }
        requires_policy:
          type: string
          enum: [bounded_active]
          description: Present on the active-probe row only.
        inputs:
          type: array
          description: |
            Producers the row may consume: `mcp:health.check` (+ `check_id`,
            `profile`), `baseline` (+ `section`, `check`), `read:<tool>`,
            `resource:<uri>` or `probe:health.probe.run` (+ `probe`), each
            with a `freshness` of `per_call` or `observed_at`.
          items:
            type: object
            required: [source, freshness]
            properties:
              source: { type: string }
              freshness: { type: string, enum: [per_call, observed_at] }
              check_id: { type: string }
              profile: { type: string, enum: [quick, standard, deep] }
              section: { type: string }
              check: { type: string }
              probe: { type: string, enum: [fs_io, nfs_loopback] }
        procedure: { type: string }
        criterion: { type: string, description: Cites profile keys (`expectations.<key>`), never loose numbers. }
        outcome_map:
          type: object
          additionalProperties: { type: string, enum: [pass, warn, fail, unknown, not_applicable] }
        severity_map:
          type: object
          additionalProperties: { type: string, enum: [warning, degraded, critical] }
        side_effects: { type: string, enum: [none, active_probe] }
        cost:
          type: object
          properties:
            timeout_s: { type: integer }
        next_check: { type: string }
        no_source:
          type: boolean
          description: '`true` = listed for honesty; no producer exists today.'

    HealthBaselineResult:
      description: S19 §8.4 — one baseline engine run (or its cached result).
      type: object
      required: [profile, collection, engine, report, error, stderr_tail, run_id]
      properties:
        profile:
          type: object
          properties:
            name: { type: string }
            path: { type: string, nullable: true }
            sha256: { type: string, nullable: true }
            timeout_seconds:
              type: integer
              description: The effective timeout — the profile's own `timeout_seconds` capped per profile.
            sections_without_checker:
              type: array
              description: Enabled sections the engine cannot check; from the engine's `--sections` list once known, else the static copy.
              items: { type: string }
        collection:
          type: object
          properties:
            status: { type: string, enum: [success, error, timeout, not_supported] }
            collected_at: { type: string, format: date-time }
            duration_ms: { type: integer }
            from_cache: { type: boolean }
            age_s: { type: integer, description: Seconds since the api received the cached result; 0 when not from cache. }
        engine:
          type: object
          nullable: true
          properties:
            module: { type: string }
            version: { type: string, nullable: true }
        report:
          type: object
          nullable: true
          description: The engine's JSON verbatim (`metadata`, `overall`, `summary`, `checks[]`); null unless `collection.status` is `success`.
          additionalProperties: true
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
        stderr_tail: { type: string, description: The last 4 KiB of the engine's stderr. }
        run_id: { type: string, nullable: true }

    AgenticReportValidation:
      description: S19 §11.2 — the validator's verdict over one report.
      type: object
      required: [valid, run_id, schema_errors, reference_errors, integrity, computed, status_errors, rewritten_to_unknown, report_digest]
      properties:
        valid: { type: boolean }
        run_id:
          type: string
          nullable: true
          description: The report's `run.run_id`; null when schema errors prevented reading it.
        schema_errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string, description: JSON pointer into the report. }
              message: { type: string }
        reference_errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              ref: { type: string }
              message: { type: string }
        integrity:
          type: object
          properties:
            status: { type: string, enum: [verified, mismatch, unverifiable] }
            checked: { type: integer, description: Raw reports from ledger-writing tools that were checked. }
            mismatches:
              type: array
              items:
                type: object
                properties:
                  raw_report_index: { type: integer }
                  reason: { type: string, enum: [report_rehash_mismatch, not_in_ledger, digest_mismatch] }
                  expected_digest: { type: string, nullable: true }
                  actual_digest: { type: string }
        computed:
          type: object
          nullable: true
          description: The deterministic verdict (S19 §11.3); null when the schema failed.
          properties:
            health_status: { type: string, enum: [ok, warning, degraded, critical, unknown] }
            coverage_status: { type: string, enum: [complete, partial, none] }
        status_errors:
          type: array
          items: { type: string }
        rewritten_to_unknown:
          type: array
          description: Check ids whose `not_applicable` outcome cited no declared-absent component or scope exclusion (REPORT-02).
          items: { type: string }
        report_digest:
          type: string
          description: '`sha256:<hex>` over the canonical JSON of the body; bound into the audit row''s result hash.'

    McpConfirmation:
      description: |
        S15 (ADR-0010 amendment): the durable approval record behind one MCP
        `mode=apply`. Created by the MCP dispatcher before the client is asked
        to confirm; decided in-band by the client (`mode: form`) or by an
        operator on these routes / the approval page (`mode: url`); consumed
        inside the same apply transaction that creates the task. It never
        carries the `requestState` nonce, a bearer, or the loopback token.
        Timestamps are ISO strings.
      type: object
      required:
        - confirmation_id
        - status
        - mode
        - principal
        - role
        - tool_name
        - operation_kind
        - plan_id
        - plan_hash
        - idempotency_key
        - expected_revision
        - risk_level
        - rollback_model
        - arguments_hash
        - plan_document_hash
        - round
        - created_at
        - expires_at
        - correlation_id
        - request_id
        - node_id
      properties:
        confirmation_id:
          type: string
          description: 16 random bytes, base64url (22 chars); the approval-page path segment.
        arguments_hash:
          type: string
          description: sha256 over the canonical `{ name, arguments }` of the MCP call the record is bound to.
        plan_document_hash:
          type: string
          description: sha256 over the canonical persisted plan document at record creation.
        status:
          type: string
          enum: [pending, approved, declined, cancelled, expired, consumed]
        mode:
          type: string
          enum: [form, url]
        principal: { type: string, description: The MCP principal that requested the apply. }
        role:
          type: string
          enum: [viewer, operator, admin]
        tool_name: { type: string, example: shares.update }
        operation_kind: { type: string, example: share.update }
        plan_id: { type: string, format: uuid }
        plan_hash: { type: string }
        idempotency_key: { type: string }
        expected_revision: { type: integer, format: int64 }
        risk_level:
          type: string
          enum: [non_disruptive, changing_access, destructive, unsupported_rollback]
        rollback_model:
          type: string
          enum: [non_disruptive, changing_access, destructive, unsupported]
        round:
          type: integer
          minimum: 1
          maximum: 3
          description: Current MRTR round; at most three per confirmation.
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        approved_at: { type: [string, "null"], format: date-time }
        approved_by: { type: [string, "null"] }
        approval_channel:
          type: [string, "null"]
          enum: [mcp_form, bearer, uds_break_glass, null]
          description: |
            The VERIFIED authentication channel of the deciding request,
            derived from the auth middleware: the MCP client's form accept,
            a REST bearer token, or UDS peer trust (only possible with
            `mcp.confirmation.allow_uds_approval: true`, audited as
            `break_glass_used`). Never taken from a client header.
        approval_interface:
          type: [string, "null"]
          enum: [web, rest, null]
          description: |
            UNTRUSTED, self-reported UI label from the
            `X-Xinas-Approval-Interface` header of the deciding request.
            Informational only; no check reads it.
        declined_at: { type: [string, "null"], format: date-time }
        declined_by: { type: [string, "null"] }
        decision_reason: { type: [string, "null"], maxLength: 512 }
        consumed_at: { type: [string, "null"], format: date-time }
        consumed_task_id: { type: [string, "null"], format: uuid }
        expired_reason:
          type: [string, "null"]
          enum: [ttl, round_limit, plan_stale, revision_changed, restart_sweep, null]
        correlation_id: { type: string }
        request_id: { type: string, format: uuid }
        node_id: { type: string, description: The api's `controller_id`. }
        plan:
          description: |
            Only on `GET /mcp/confirmations/{id}`: the public projection of
            the plan document persisted at plan time — byte-identical to the
            `Plan` the requester received.
          $ref: '#/components/schemas/Plan'
        summary:
          description: Only on `GET /mcp/confirmations/{id}`; the human-facing text the approval page shows.
          type: object
          properties:
            message: { type: string }
            consequences: { type: string }
            rollback_limitation: { type: string }

    McpConfirmationDecision:
      description: |
        Body of `POST /mcp/confirmations/{id}/approve` and `/decline`.
        `acknowledge` is required on approve, exactly and case-sensitively:
        `DATA MAY BE PERMANENTLY LOST` for `risk_level: destructive`
        (whatever the rollback model), `ROLLBACK IS NOT SUPPORTED` for
        `risk_level: unsupported_rollback` or `rollback_model: unsupported`
        records that are not destructive; nothing otherwise. Ignored on
        decline. See the S15 spec §9.2 table.
      type: object
      properties:
        acknowledge: { type: string }
        reason: { type: string, maxLength: 512 }

    AuditEntry:
      type: object
      required: [kind, timestamp, node_id, principal, client_type, request_id]
      properties:
        kind: { type: string, description: "e.g. http.POST./shares; S15 lifecycle events use mcp.confirmation.<event>" }
        timestamp: { type: string, format: date-time }
        node_id: { type: string }
        principal: { type: string }
        client_type: { type: string }
        request_id: { type: string }
        parameters_hash: { type: string }
        result_hash: { type: string }
        operation_id: { type: string }
        task_id: { type: string }
        state_revision: { type: integer }

    Pool:
      type: object
      required: [name, drives, active, referenced_by]
      properties:
        name: { type: string }
        drives:
          type: array
          items: { type: string }
        active: { type: boolean }
        referenced_by:
          type: array
          items: { type: string }
          description: Names of xiRAID arrays whose spare pool is this pool.

    ConfigSnapshot:
      type: object
      required: [snapshot_id, kind, created_at]
      properties:
        snapshot_id: { type: string }
        kind:
          type: string
          enum: [baseline, before, after, imported]
        created_at: { type: string, format: date-time }
        task_id: { type: [string, "null"], format: uuid }
        operation_id: { type: [string, "null"] }
        principal: { type: [string, "null"] }
        client_type:
          type: [string, "null"]
          enum: [rest, mcp, tui, cli, automation, system]
        rollback_classification:
          type: string
          enum: [non_disruptive, changing_access, destroying_data, unsupported]
        files_changed:
          type: array
          items: { type: string }
          description: >-
            S11 (ADR-0013): managed-file names whose checksum changed vs the
            parent snapshot — history/display + restore blast-radius hint, NOT
            the restore set (the runner computes that as current-vs-target).
        restorable:
          type: boolean
          description: >-
            S11 (ADR-0013): true iff the snapshot carries a system_files
            payload (live NFS/network config bytes) that targeted rollback can
            restore. Pre-S11 snapshots are false.
        adoptable:
          type: boolean
          description: >-
            True when the snapshot carries a captured desired-state payload (S12) and
            can be restored with adopt:true. Independent of `restorable`.
        absent_files:
          type: array
          items: { type: string }
          description: >-
            Managed logical files (CHECKSUM_TARGETS names) absent at snapshot capture
            (S13 tombstone set). Empty/omitted for pre-S13 snapshots. ADR-0017.
        # S9 (ADR-0011): typed projections of the xinas_history manifest.
        history_type:
          type: string
          description: Raw xinas_history SnapshotType (baseline|rollback_eligible|ephemeral).
        operation: { type: string }
        source: { type: string }
        diff_summary: { type: string }

    User:
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind:
          type: string
          const: User
        id:
          type: string
          description: "Decimal uid as string."
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          type: object
          required: [name, uid, gid]
          properties:
            name:
              type: string
            uid:
              type: integer
            gid:
              type: integer
            gecos:
              type: string
            home:
              type: string
            shell:
              type: string
        status:
          type: object
          required: [resolvable, source, observed_at]
          properties:
            resolvable:
              type: boolean
            source:
              type: string
              enum: [local, nss]
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

    Group:
      type: object
      required: [kind, id, metadata, spec, status]
      properties:
        kind:
          type: string
          const: Group
        id:
          type: string
          description: "Decimal gid as string."
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          type: object
          required: [name, gid]
          properties:
            name:
              type: string
            gid:
              type: integer
            members:
              type: array
              items:
                type: string
        status:
          type: object
          required: [resolvable, source, observed_at]
          properties:
            resolvable:
              type: boolean
            source:
              type: string
              enum: [local, nss]
            observed_at:
              type: string
              format: date-time
              description: "When the agent's collector observed this entity. Agents stamp this at probe-time; api computes observation_age_seconds = now - observed_at on read."

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    PlanReturned:
      description: Plan returned (mode=plan). No system mutation occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlanResponse' }
    TaskAccepted:
      description: Task accepted (mode=apply). Poll via `/tasks/{id}`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskAcceptedResponse' }
    InvalidArgument:
      description: '`INVALID_ARGUMENT` — request body or query is malformed.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NotFound:
      description: '`NOT_FOUND` — referenced object does not exist.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    PermissionDenied:
      description: '`PERMISSION_DENIED` — RBAC or transport gate refused.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Conflict:
      description: |
        `CONFLICT` — a mutating/task operation could not proceed because of a
        concurrency or freshness conflict. The `error.details.reason`
        discriminator (no new top-level error code is added) is one of:

        - `lease_held` — a required resource lease is held by another task.
          `details.holder_task_id` names the holding task.
        - `irreversible_stage_started` — a cancel arrived after the executor
          passed its point of no return (S16); `details.stage` names the
          stage. The task is not cancellable any more and finishes on its own.
        - `idempotency_key_reused` — the same `idempotency_key`+`principal`
          was reused for a different `input_hash`/`plan_hash`.
        - `plan_stale` — the observed snapshot the plan was computed against
          is stale beyond the plan's freshness rule (see
          `Plan.observed_revision_expected` / `Plan.observed_at`).

        (Stale `expected_revision` on apply is reported as
        `PRECONDITION_FAILED`, not here.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    PreconditionFailed:
      description: |
        `PRECONDITION_FAILED` — stale `expected_revision` or preflight blocker.
        The `error.details.reason` discriminator (no new top-level error code
        is added) is one of:

        - `dangerous_flag_required` — the plan is destructive and the apply
          body did not carry `dangerous: true` (enforced centrally in the
          task engine, reqs §14).
        - `observed_revision_stale` — the apply's `expected_revision` no
          longer matches the resource's current observed revision
          (`details.expected` / `details.current`).
        - `create_expects_revision_zero` — a create apply sent a non-zero
          `expected_revision` (the object must not exist; send `0`).

        Unresolved preflight blockers are reported with `details.blockers`
        (the plan `Blocker` list) and no `reason` discriminator.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Unsupported:
      description: '`UNSUPPORTED` — write to an inert Phase 0 field or unsupported operation.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Internal:
      description: '`INTERNAL` — server-side failure (incl. `EXECUTOR_UNAVAILABLE`, `AUDIT_WRITE_FAILED`).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Unauthorized:
      description: '`UNAUTHENTICATED` — missing or invalid bearer token or peer credentials.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  # -------------------------------------------------------------------------
  # Reusable request bodies
  # -------------------------------------------------------------------------
  requestBodies:
    Mutating:
      description: Plan or apply request (see `MutatingRequest`).
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MutatingRequest' }

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema: { type: string }
    PathTaskId:
      in: path
      name: task_id
      required: true
      schema: { type: string, format: uuid }
    QueryLimit:
      in: query
      name: limit
      schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # =========================================================================
  # System / capabilities / inventory
  # =========================================================================
  /system:
    get:
      tags: [system]
      operationId: getSystem
      summary: Get cluster mode, node identity, capabilities.
      description: Returns the singleton `Cluster` and the local `Node`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: object
                        required: [cluster, node]
                        properties:
                          cluster: { $ref: '#/components/schemas/Cluster' }
                          node:    { $ref: '#/components/schemas/Node' }
        '500': { $ref: '#/components/responses/Internal' }

  /capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: Get the capability map (Phase 0 advertises HA disabled).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500': { $ref: '#/components/responses/Internal' }

  /inventory:
    get:
      tags: [inventory]
      operationId: getInventory
      summary: Get full hardware and software inventory snapshot.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500': { $ref: '#/components/responses/Internal' }

  /controllers:
    get:
      tags: [system]
      operationId: listControllers
      summary: List nodes (one in Phase 0; alias preserved for compatibility).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Node' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # Storage — disks, arrays, filesystems
  # =========================================================================
  /mcp/apps/raid-create:
    get:
      tags: [storage]
      operationId: getMcpRaidCreateAppConfig
      summary: Get the server-owned configuration for the MCP RAID Create App.
      description: >-
        Read-only bootstrap data for `mcp_apps.raid_create`. Values are derived
        from the same xiRAID constraint tables used by plan and apply validation.
        The endpoint does not create a plan, task, confirmation, or storage state.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: object
                        required:
                          - app
                          - resource_uri
                          - levels
                          - constraints
                          - strip_sizes_kib
                          - block_sizes
                          - defaults
                          - tools
                        properties:
                          app: { type: string, const: raid_create }
                          resource_uri: { type: string, const: 'ui://xinas/raid-create' }
                          levels:
                            type: array
                            items:
                              type: string
                              enum: [raid0, raid1, raid5, raid6, raid7, raid10, raid50, raid60, raid70, "n+m"]
                          constraints:
                            type: object
                            additionalProperties:
                              type: object
                              required:
                                - min_drives
                                - even_members
                                - needs_group_size
                                - group_size_min
                                - group_size_max
                                - needs_synd_cnt
                                - synd_cnt_min
                                - synd_cnt_max
                              properties:
                                min_drives: { type: integer }
                                even_members: { type: boolean }
                                needs_group_size: { type: boolean }
                                group_size_min: { type: integer }
                                group_size_max: { type: integer }
                                needs_synd_cnt: { type: boolean }
                                synd_cnt_min: { type: integer }
                                synd_cnt_max: { type: integer }
                          strip_sizes_kib:
                            type: array
                            items: { type: integer, enum: [16, 32, 64, 128, 256] }
                          block_sizes:
                            type: array
                            items: { type: integer, enum: [512, 4096] }
                          defaults:
                            type: object
                            required: [level, strip_size_kib, block_size]
                            properties:
                              level: { type: string, const: raid6 }
                              strip_size_kib: { type: integer, const: 128 }
                              block_size: { type: integer, const: 4096 }
                          name:
                            type: object
                            properties:
                              pattern: { type: string }
                              reserved:
                                type: array
                                items: { type: string }
                          tools:
                            type: object
                            additionalProperties: { type: string }
        '401': { $ref: '#/components/responses/PermissionDenied' }
        '500': { $ref: '#/components/responses/Internal' }

  /disks:
    get:
      tags: [storage]
      operationId: listDisks
      summary: List disks visible to the controller.
      parameters:
        - in: query
          name: safe_for_use
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Disk' }
        '500': { $ref: '#/components/responses/Internal' }

  /arrays:
    get:
      tags: [storage]
      operationId: listArrays
      summary: List xiRAID arrays.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/XiraidArray' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [storage]
      operationId: createOrImportArray
      summary: Create or import an array (plan/apply).
      description: |
        Two-phase. `mode=plan` returns a `Plan` with `plan_id`, blockers,
        risk classification, and client-impact estimate. `mode=apply`
        requires the `plan_id`, `expected_revision`, and `idempotency_key`.

        Create vs import is discriminated by the spec shape: a create-shaped
        spec carries `name`/`level`/`member_disk_ids` (S3, ADR-0006); an
        import-shaped spec carries the foreign array `uuid` (deferred).
        For create, `expected_revision` MUST be `0` — the array must not
        exist at apply time (ADR-0006 freshness convention).
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unsupported' }
        '500': { $ref: '#/components/responses/Internal' }

  /arrays/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [storage]
      operationId: getArray
      summary: Get a single array.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/XiraidArray' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      tags: [storage]
      operationId: updateArray
      summary: Modify array (spare-pool changes; plan/apply).
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [storage]
      operationId: deleteArray
      summary: Delete array (plan/apply; `dangerous=true` required to apply).
      description: |
        Destructive. Plan-mode reports dependent filesystems/exports as
        blockers. Apply requires `dangerous: true` in the body.
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /filesystems:
    get:
      tags: [storage]
      operationId: listFilesystems
      summary: List filesystems.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Filesystem' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [storage]
      operationId: createOrImportFilesystem
      summary: Create or import an XFS filesystem (plan/apply).
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /filesystems/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [storage]
      operationId: getFilesystem
      summary: Get a single filesystem.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Filesystem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      tags: [storage]
      operationId: updateFilesystem
      summary: Mount, unmount, grow, or change quota mode (plan/apply).
      description: |
        ONE intent key per PATCH spec — exactly one of `mounted` (boolean →
        fs.mount/fs.unmount), `grow: true` (→ fs.grow), or `quota_mode`
        (→ fs.set_quota_mode, a client-visible remount). Multiple intent
        keys → `INVALID_ARGUMENT`. Identity fields (`mountpoint`,
        `backing_device`, `log_device`, `label`, `su_kb`, `sw`,
        `sector_size`, `log_size`, `fs_type`) → per-field `UNSUPPORTED`
        with `reason: fs_identity_immutable` (re-create to change,
        ADR-0007 writability matrix).
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [storage]
      operationId: deleteFilesystem
      summary: Remove filesystem from management (data preserved by default; plan/apply).
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # NFS — shares, sessions, profile, export groups
  # =========================================================================
  /shares:
    get:
      tags: [nfs]
      operationId: listShares
      summary: List shares.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Share' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [nfs]
      operationId: createShare
      summary: Create a share (plan/apply).
      description: |
        `spec.fsid` may be omitted; the server assigns the next integer above
        the highest currently in use (0 is reserved for the installer's root
        export, and a gap left by a deleted share is not reused). Supplying an
        `fsid` another share already holds returns an `FSID_IN_USE` blocker on
        the plan rather than an error, so the operator sees the whole plan.
        `fsid` is always present on read, which is why `Share.spec` still
        requires it.
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /shares/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [nfs]
      operationId: getShare
      summary: Get a single share.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Share' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      tags: [nfs]
      operationId: updateShare
      summary: Update share (clients, options, quotas) — plan/apply.
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [nfs]
      operationId: deleteShare
      summary: Delete share (data preserved unless `delete_data=true` in spec; plan/apply).
      description: |
        Default behavior removes the export only; underlying directory and
        data are preserved. Pass `delete_data: true` inside the plan spec
        and `dangerous: true` on apply to destroy data.
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /shares/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [nfs]
      operationId: getShareSessions
      summary: Get active NFS session visibility for a share.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/NfsSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /nfs-profiles:
    get:
      tags: [nfs]
      operationId: listNfsProfiles
      summary: List NFS profiles (singleton `default` in Phase 0).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/NfsProfile' }
        '500': { $ref: '#/components/responses/Internal' }

  /nfs-profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [nfs]
      operationId: getNfsProfile
      summary: Get a single NFS profile.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/NfsProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      tags: [nfs]
      operationId: replaceNfsProfile
      summary: Replace profile spec (plan/apply).
      description: |
        Writes to HA-shaped fields (`v3_locking.fixed_rpc_ports.*`,
        `v4_recovery.recovery_root`, `v4_recovery.server_scope`) return
        `UNSUPPORTED` in Phase 0 per ADR-0005.
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unsupported' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      tags: [nfs]
      operationId: updateNfsProfile
      summary: Partial update to profile spec (plan/apply).
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
      responses:
        '200': { $ref: '#/components/responses/PlanReturned' }
        '202': { $ref: '#/components/responses/TaskAccepted' }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unsupported' }
        '500': { $ref: '#/components/responses/Internal' }

  /export-groups:
    get:
      tags: [nfs]
      operationId: listExportGroups
      summary: List export groups (singleton `default` in Phase 0).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/ExportGroup' }
        '500': { $ref: '#/components/responses/Internal' }

  # =========================================================================
  # Network — interfaces, RDMA, service IPs
  # =========================================================================
  /network:
    get:
      tags: [network]
      operationId: getNetworkSnapshot
      summary: Get network snapshot (interfaces, RDMA, netplan ownership).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500': { $ref: '#/components/responses/Internal' }

  /network/interfaces:
    get:
      tags: [network]
      operationId: listNetworkInterfaces
      summary: List network interfaces.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/NetworkInterface' }
        '500': { $ref: '#/components/responses/Internal' }

  /network/interfaces/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [network]
      operationId: getNetworkInterface
      summary: Get a single network interface.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/NetworkInterface' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      tags: [network]
      operationId: updateNetworkInterface
      summary: Change IPs, MTU, or enablement (plan/apply).
      description: |
        Writable: addresses, mtu, enabled, cleanup (any combination).
        Immutable per-field 422 net_identity_immutable: pbr_table_id,
        managed_by_xinas, name. Non-mlx targets → 422 iface_not_managed
        (management ethernet is not writable through this surface).
      requestBody: { $ref: '#/components/requestBodies/Mutating' }
