# Phase 0 CI bootstrap.
#
# See docs/control-path/ci-bootstrap-design.md for the full design,
# gate matrix, and backfill plan.
#
# Flip-to-blocking TODOs (in spec order):
#   TODO: expand typescript-lint to style/suspicious rule categories
#         (measured 2026-06-11, biome 1.9.4, style+suspicious "all" on src/:
#         ~3.7k diagnostics (233 errors + ~3.5k warnings) — needs its own
#         debt package, likely "recommended" first)
#   TODO: graduate pyright standard -> strict per module
#   TODO: graduate ansible-lint basic -> production
#   TODO: ratchet the pytest --cov floor upward as xinas_history coverage grows
#   TODO: add MCP integration smoke test (after containerized harness exists)
#   TODO: add live contract test against the WS1 mock server (after mock ships)

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xiNAS-MCP/package-lock.json
      - run: npm ci
        working-directory: xiNAS-MCP
      - run: npm run typecheck
        working-directory: xiNAS-MCP

  typescript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xiNAS-MCP/package-lock.json
      - run: npm ci
        working-directory: xiNAS-MCP
      - run: npm run lint
        working-directory: xiNAS-MCP

  typescript-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xiNAS-MCP/package-lock.json
      - run: npm ci
        working-directory: xiNAS-MCP
      - run: npm run format:check
        working-directory: xiNAS-MCP

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xiNAS-MCP/package-lock.json
      - run: npm ci
        working-directory: xiNAS-MCP
      - run: npm test
        working-directory: xiNAS-MCP

  typescript-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xiNAS-MCP/package-lock.json
      - run: npm ci
        working-directory: xiNAS-MCP
      - run: npm run test:contracts
        working-directory: xiNAS-MCP

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      # tests/test_preset_overlay.py shells out to yq (mikefarah/yq v4 — the Go
      # binary, not the Python jq wrapper; see Important Notes in CLAUDE.md).
      # Pinned + checksum-verified, mirroring prepare_system.sh's install_yq;
      # keep the version/hash below in sync with that script's YQ_VERSION /
      # YQ_SHA256_AMD64 when bumping. Runner is always amd64.
      - run: |
          YQ_VERSION="v4.53.3"
          YQ_SHA256_AMD64="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
          tmp_yq="$(mktemp)"
          wget -qO "$tmp_yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          actual_sha="$(sha256sum "$tmp_yq" | awk '{print $1}')"
          if [ "$actual_sha" != "$YQ_SHA256_AMD64" ]; then
            echo "yq checksum mismatch: expected $YQ_SHA256_AMD64, got $actual_sha" >&2
            rm -f "$tmp_yq"
            exit 1
          fi
          sudo install -m 0755 "$tmp_yq" /usr/local/bin/yq
          rm -f "$tmp_yq"
      # Coverage floor measured at 22% on 2026-06-11; floor set just below.
      # Ratchet upward when meaningful xinas_history coverage lands.
      - run: pytest --cov=xinas_history --cov-fail-under=20

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check xinas_menu xinas_history xiNAS-MCP/nfs-helper

  python-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      # Whole-repo, not just the three package dirs: files under tests/ and
      # collection/ kept re-drifting because they were never format-checked.
      # `.` honors [tool.ruff] extend-exclude (.claude, node_modules).
      - run: ruff format --check .

  python-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pyright xinas_menu xinas_history xiNAS-MCP/nfs-helper

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install ansible-lint
      # The roles use modules from community.general (timezone) and ansible.posix
      # (sysctl, reached via the ansible.builtin redirect). ansible-lint ships
      # only ansible-core, so without these collections it fails with
      # syntax-check[unknown-module]. The deployment's full `ansible` install
      # bundles them; install them here so the lint env matches the host.
      - run: ansible-galaxy collection install community.general ansible.posix
      - run: ansible-lint collection/roles/

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yml .

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npx --yes -p @stoplight/spectral-cli@latest spectral lint \
            --ruleset .spectral.yaml \
            docs/control-path/api-v1.yaml

  # Breaking-change gate between the PR's api-v1.yaml and the base branch's.
  # PR-only: on push to main there is no base to diff against.
  # The action runs in a Docker container that cannot see the runner's /tmp,
  # so the base spec is passed as a git ref (the action's documented pattern).
  openapi-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --depth=1 origin "$GITHUB_BASE_REF"
      - uses: oasdiff/oasdiff-action/breaking@v0.0.57
        with:
          base: 'origin/${{ github.base_ref }}:docs/control-path/api-v1.yaml'
          revision: docs/control-path/api-v1.yaml
          fail-on: ERR

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required for PR scans
          GITLEAKS_CONFIG: .gitleaks.toml

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes markdownlint-cli2 'docs/**/*.md'
