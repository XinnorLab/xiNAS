# Default values for the raid_fs role
#
# This preset uses automatic NVMe namespace detection.
# The nvme_namespace role will:
# - Detect all non-system NVMe drives
# - Create small namespaces (n1) for XFS log device
# - Create large namespaces (n2) for data
# - Generate xiraid_arrays and xfs_filesystems automatically

xiraid_license_path: "/tmp/license"

# Whether to pass `--force_metadata` when creating arrays
xiraid_force_metadata: true

# TRIM/discard for new arrays: enable per array when every member reports both
# discard support and RZAT (raid-spec §7.5). `--drive_trim` is intentionally not
# forced — xiRAID enables it itself only when no disk carries metadata. Mirrored
# from the role defaults because this preset REPLACES defaults/main.yml — see the
# note on raid_create_min_free_mb.
xiraid_trim_mode: auto
xiraid_trim_create_args: "--discard 1"

# Enable automatic NVMe namespace management
# This will auto-detect drives and generate RAID configuration
nvme_auto_namespace: true

# Namespace format settings (4KB blocks; non-shared for single-controller HW)
nvme_namespace_block_size: 4096
nvme_namespace_shared: false

# RAID levels for auto-generated arrays
nvme_raid_data_level: 5       # RAID 5 for large namespaces (data array)
nvme_raid_log_level: 10       # RAID 10 for small namespaces (log array)

# Note: xiraid_arrays and xfs_filesystems are generated automatically
# by nvme_namespace role when nvme_auto_namespace: true
# Minimum free memory (MiB) required before creating each array. xiRAID
# preallocates a per-array kernel mempool (~memory_prealloc, ~2 GB) via
# __get_free_pages(); creation fails cryptically below this floor. Defined here
# because this preset REPLACES the raid_fs role's defaults/main.yml, so any
# default the role adds must be mirrored here or it is lost at preset-apply.
raid_create_min_free_mb: 2560
