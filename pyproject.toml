[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xinas-menu"
description = "xiNAS management TUI and health engine"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "xinas_menu.version.XINAS_MENU_VERSION"}

[tool.setuptools.packages.find]
include = ["xinas_menu*", "xinas_history*"]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.380",
  # Capped below the next minor, for the same reason as textual below: the
  # unpinned floor let CI float onto 0.16, whose formatter also reformats
  # Python inside Markdown fences. That turned every `docs/plans/*.md` code
  # block into a format-check failure on a repo whose Python was already
  # clean. `docs` is excluded from ruff's scope below; the cap keeps the next
  # formatter change from landing on a green branch without anyone choosing it.
  "ruff>=0.6.0,<0.17",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # TUI runtime deps, mirrored from collection/roles/xinas_menu/tasks/main.yml
  # (the deployment venv) and install.sh so pyright/tests resolve the same
  # versions CI ships. Keep the pins in sync across all three. textual is
  # capped below the next minor: an unpinned floor let CI/prod float onto a
  # release whose Worker is no longer awaitable, breaking type-check + runtime
  # repo-wide.
  "textual>=8.2.8,<8.3",
  "rich",            # imported directly (rich.text, rich.markup); textual dep
  "grpcio>=1.60.0",
  "pyyaml>=6.0",
  # Ansible's templating engine, used by tests that render a role's real Jinja
  # expressions instead of pattern-matching the task text (see
  # tests/test_storage_state_fail_closed.py). Not a xiNAS runtime dependency.
  "jinja2>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# `docs` is excluded because ruff >= 0.16 formats Python inside Markdown code
# fences. Most of those fences live in `docs/plans/`, which CLAUDE.md declares
# append-only — a landed plan records what was intended at the time and is not
# edited afterwards, least of all by a formatter. Reformatting them to satisfy
# `ruff format --check .` would rewrite ~1.8k lines of history to change
# nothing that runs. No `.py` file lives under `docs/`.
extend-exclude = [".claude", "node_modules", "xiNAS-MCP/node_modules", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: line WRAPPING is enforced by `ruff format` (a separate blocking CI job);
# E501 at >100 cols remains only in long strings/comments where rewrapping is
# churn without value.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Deliberate TUI pattern: `_log = logging.getLogger(__name__)` sits between the
# stdlib imports and the heavyweight textual/widget imports, so everything after
# it trips E402. Keeping the pattern; scoped to the files that use it.
"xinas_menu/app.py" = ["E402"]
"xinas_menu/screens/network.py" = ["E402"]
"xinas_menu/screens/nfs.py" = ["E402"]
"xinas_menu/screens/raid.py" = ["E402"]
"xinas_menu/screens/spare_pools.py" = ["E402"]
"xinas_menu/screens/welcome.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["xinas_menu", "xinas_history", "xiNAS-MCP/nfs-helper"]
exclude = ["**/__pycache__", "**/.git", "**/node_modules", "**/.venv"]
# textual's screen/mount APIs (push_screen, mount, recompose, ...) return
# optionally-awaitable objects; the fire-and-forget call is the framework's
# documented idiom, so an unawaited result is not a bug in this codebase.
# Warning keeps the signal visible without failing CI.
reportUnusedCoroutine = "warning"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
